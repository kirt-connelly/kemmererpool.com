<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament (Fargo Rate Races) — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414; --bg2: #1e1e1e; --bg3: #262626; --bg4: #2e2e2e;
    --border: #363636; --border2: #464646;
    --text: #ffffff; --text2: #b0a898; --text3: #666058;
    --accent: #27855a; --cream: #e8ddd0; --green2: #32a870; --loss: #cc4444;
    --on-accent: #ffffff;
    --radius: 8px; --radius-sm: 5px;
  }
  html[data-theme="light"] {
    --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae6df; --bg4: #ddd8ce;
    --border: #d6d0c5; --border2: #bcb4a6;
    --text: #1a1714; --text2: #5a5348; --text3: #8b8376;
    --accent: #1f6b48; --cream: #2b2419; --green2: #1a7a4e; --loss: #b23636;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); }
  .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0,#154d28 4px,#1a5c32 8px); opacity: .5; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 12px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
  .theme-btn { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-size: 13px; padding: 0; }
  .theme-btn:hover { background: var(--bg4); color: var(--text); }

  main { padding: 22px 0 70px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-meta { font-size: 12px; color: var(--text3); }
  .pad { padding: 18px; }
  .setup-head { cursor: pointer; user-select: none; }
  .setup-head:hover .card-title { color: var(--green2); }
  .head-right { display: flex; align-items: center; gap: 11px; }
  .chev { font-size: 20px; line-height: 1; color: var(--text2); display: inline-block; transition: transform .18s; }
  /* Collapsed after the draw — the setup is done, the bracket is the point. */
  .setup-card.collapsed .pad { display: none; }
  .setup-card.collapsed .chev { transform: rotate(-90deg); }

  label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font-family: inherit; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .fee-row { margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .fee-input { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
  .fee-input:focus-within { border-color: var(--accent); }
  .fee-input span { color: var(--text3); font-size: 14px; }
  .fee-input input { width: 76px; border: none; background: none; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 9px 0; }
  .fee-input input:focus { outline: none; }
  .fee-input select { border: none; background: none; color: var(--text); font-family: inherit;
    font-size: 14px; padding: 9px 0; cursor: pointer; }
  .fee-input select:focus { outline: none; }

  /* ── Player lookup ── */
  .lookup { display: flex; gap: 10px; flex-wrap: wrap; }
  .lookup input { flex: 1; min-width: 200px; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
  .lookup input:focus { outline: none; border-color: var(--accent); }
  .results { display: flex; flex-direction: column; gap: 1px; margin-top: 10px; background: var(--border);
    border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .results:empty { display: none; }
  .result { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; background: var(--bg); cursor: pointer; font-size: 14px; }
  .result:hover, .result.sel { background: var(--bg3); }
  .result .rn { color: var(--cream); font-weight: 600; }
  .result .rd { font-size: 11px; color: var(--text3); }
  .result .rr { font-weight: 700; font-variant-numeric: tabular-nums; }
  .roster { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .roster:empty { display: none; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; }
  .rrow .n { flex: 1; color: var(--cream); font-weight: 600; }
  .rrow .f { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rrow .d { font-size: 11px; color: var(--text3); }
  .rrow .x { background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px; }
  .rrow .x:hover { color: var(--loss); }
  .rrow.manual .f { color: var(--text2); }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green2); margin-right: 7px; vertical-align: middle;
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .notice-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px; color: var(--text2); font-size: 14px; }
  .th-live { color: var(--green2); font-weight: 600; }
  .ro-banner { padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--accent);
    border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2);
    font-size: 13px; font-weight: 500; }
  body.read-only .slot { cursor: default; }
  body.read-only .slot:hover:not(.locked) { background: none; }
  body.read-only .payout .place, body.read-only .payout .amt { cursor: default; }
  body.read-only .payout .place:hover, body.read-only .payout .amt:hover { background: none; }

  .code-entry { max-width: 380px; margin: 7vh auto 40px; }
  .code-entry .pad { padding: 22px; }
  .code-entry label.fl { text-align: center; margin-bottom: 10px; }
  /* min-width:0 matters — an input won't shrink below its intrinsic size
     otherwise, which pushed the button outside the card. */
  .code-input { display: block; width: 100%; min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 30px; font-weight: 700; letter-spacing: .34em; text-indent: .34em;
    text-align: center; text-transform: uppercase; color: var(--cream);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 10px; }
  .code-input::placeholder { color: var(--text3); }
  .code-input:focus { outline: none; border-color: var(--accent); }
  .code-go { display: block; width: 100%; margin-top: 12px; padding: 13px;
    font-size: 15px; text-align: center; }
  .code-help { margin-top: 14px; text-align: center; font-size: 12px;
    color: var(--text3); line-height: 1.6; }
  .code-entry .hint:not(:empty) { margin-top: 10px; text-align: center; }

  /* ── Add late player ── */
  .modal-back { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 80;
    background: rgba(0,0,0,.55); display: flex; align-items: flex-start;
    justify-content: center; padding: 8vh 16px 16px; overflow-y: auto; }
  .modal { width: 100%; max-width: 440px; background: var(--bg2);
    border: 1px solid var(--border2); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .modal-head { padding: 14px 18px; background: var(--bg3);
    border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600;
    color: var(--cream); border-radius: var(--radius) var(--radius) 0 0; }
  .modal-head .mh-sub { float: right; font-size: 12px; font-weight: 400; color: var(--text3);
    padding-top: 3px; }
  .late-in { width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; }
  .late-in:focus { outline: none; border-color: var(--accent); }
  #late-results { margin-top: 10px; max-height: 260px; overflow-y: auto; }
  #late-results .res { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg);
    margin-bottom: 6px; cursor: pointer; }
  #late-results .res:hover, #late-results .res.sel { border-color: var(--accent); background: var(--bg3); }
  #late-results .rn { flex: 1; min-width: 0; color: var(--cream); font-weight: 600; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #late-results .rd { font-size: 11px; color: var(--text3); white-space: nowrap; }
  #late-results .rf { font-size: 16px; font-weight: 700; color: var(--green2);
    font-variant-numeric: tabular-nums; }
  @media print { .modal-back { display: none !important; } }

  /* ── Removing a player ── */
  .rm-list { max-height: 300px; overflow-y: auto; }
  .rm-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 6px; font-family: inherit; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); cursor: pointer; }
  .rm-row:hover { border-color: var(--loss); }
  .rm-row .rn2 { flex: 1; min-width: 0; color: var(--cream); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm-row .rm2 { font-size: 11px; color: var(--text3); white-space: nowrap; }
  .rm-none { padding: 18px 4px; color: var(--text3); font-size: 14px; line-height: 1.6; }

  /* ── Tournament header ── */
  .tourney-head { display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .th-name { font-size: 20px; font-weight: 700; color: var(--cream); line-height: 1.2; }
  .th-meta { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .th-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
  .th-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── Saving ── */
  .name-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .tname { width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; }
  .tname:focus { outline: none; border-color: var(--accent); }
  .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    color: var(--text2); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 12px; letter-spacing: .04em; }
  .saved-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .saved-row { display: flex; align-items: center; gap: 12px; padding: 11px 18px;
    background: var(--bg2); font-size: 14px; flex-wrap: wrap; }
  .saved-row .sn { flex: 1; min-width: 140px; color: var(--cream); font-weight: 600; }
  .saved-row .sm { font-size: 11px; color: var(--text3); }
  .saved-row .sid { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text3); }
  .saved-row.current { border-left: 3px solid var(--accent); }
  .saved-empty { padding: 20px 18px; color: var(--text3); font-size: 13px; background: var(--bg2); }

  /* ── Payouts ── */
  .payouts { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .payout { flex: 1; min-width: 128px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); padding: 12px 14px; }
  .payout .place { font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text3); }
  .payout .amt { font-size: 22px; font-weight: 700; color: var(--cream); margin-top: 3px;
    font-variant-numeric: tabular-nums; }
  .payout .place, .payout .amt { cursor: pointer; border-radius: 3px; }
  .payout .place:hover, .payout .amt:hover { background: var(--bg3); }
  .payout.add { flex: 0 0 auto; min-width: 48px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-family: inherit; color: var(--text3);
    cursor: pointer; border: 1px dashed var(--border2); border-radius: var(--radius-sm);
    background: none; padding: 12px 14px; }
  .payout.add:hover { color: var(--green2); border-color: var(--accent); }
  .pay-input { width: 100%; font-family: inherit; background: var(--bg2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; }
  .pay-input:focus { outline: none; }
  .pay-input.place, .pay-input.label { font-size: 11px; font-weight: 700; letter-spacing: .09em; }
  .pay-input.amt { font-size: 20px; font-weight: 700; }
  .payout-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 0 18px 16px; }
  .tally { font-size: 12px; font-weight: 600; }
  .tally.ok { color: var(--text3); }
  .tally.off { color: var(--loss); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 12px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--text); }
  .payout.first { border-color: var(--accent); }
  .payout.first .amt { color: var(--green2); }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 18px; }
  .setup-card:not(.collapsed) .btn-row { border-top: 1px solid var(--border); }
  button.act { font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: .03em;
    padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text2); transition: background .15s, color .15s; }
  button.act:hover { background: var(--bg4); color: var(--text); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.act.primary:hover { opacity: .87; color: var(--on-accent); }
  button.act:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 12px; color: var(--text3); }

  /* ── Bracket ── */
  .bracket-scroll { overflow-x: auto; padding: 4px 18px 22px; }
  /* Positions are computed in JS and set inline — flexbox can't align a bracket
     reliably once rounds stop halving (losers-bracket major rounds feed 1:1). */
  .canvas { position: relative; min-width: min-content; }
  .round-label { position: absolute; top: 0; font-size: 10px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--text3);
    text-align: center; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .line { position: absolute; background: var(--border2); }
  .match { position: absolute; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); display: flex; flex-direction: column; }
  /* overflow:hidden used to round the ends; the pill sits above the box now, so
     the slots do their own rounding instead. */
  .match .slot:first-of-type { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .match .slot:last-of-type { border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
  .match.decided { border-color: var(--border2); }
  .match.ready { border-color: var(--accent); }
  /* The table this match is on, so players can be pointed at the right one. */
  .wait-tbl { color: var(--loss); font-weight: 600; }
  /* Straddles the top edge, centred, so it reads as a label on the match rather
     than crowding the race box in the corner. */
  .match-tbl { position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    z-index: 3; font-size: 9px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap; line-height: 1.3;
    background: var(--accent); color: var(--on-accent); padding: 1px 8px;
    border-radius: 99px; }
  .match-tbl.pick { cursor: pointer; }
  .match-tbl.none { background: var(--bg2); color: var(--text3); font-weight: 600;
    border: 1px dashed var(--border2); padding: 0 7px; }
  .match-tbl.none:hover { border-color: var(--accent); color: var(--green2); }
  .match-tbl.held { background: var(--bg2); color: var(--loss); border: 1px solid var(--loss);
    padding: 0 7px; }

  /* ── Moving a match to another table ── */
  .tbl-menu { position: fixed; z-index: 60; min-width: 190px; background: var(--bg2);
    border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .tbl-menu .hd { padding: 9px 14px; background: var(--bg3); border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text3); }
  .tbl-menu button { display: block; width: 100%; text-align: left; background: none;
    border: none; border-bottom: 1px solid var(--border); font-family: inherit;
    font-size: 14px; color: var(--text); padding: 10px 14px; cursor: pointer; }
  .tbl-menu button:last-child { border-bottom: none; }
  .tbl-menu button:hover { background: var(--bg3); }
  .tbl-menu button.on { color: var(--green2); font-weight: 700; }
  .tbl-menu button .who { float: right; font-size: 11px; color: var(--text3); }
  .tbl-menu button.clear { color: var(--text3); font-size: 13px; }
  .match-no { position: absolute; top: -1px; left: -1px; font-size: 9px; font-weight: 700;
    background: var(--bg3); color: var(--text3); padding: 1px 5px; border-radius: var(--radius-sm) 0 var(--radius-sm) 0;
    letter-spacing: .04em; }
  .slot { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 9px 0 26px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .slot:last-child { border-bottom: none; }
  .slot:hover:not(.locked) { background: var(--bg3); }
  .slot .nm { font-weight: 600; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.won .nm { color: var(--green2); }
  .slot.lost .nm { color: var(--text3); text-decoration: line-through; }
  .slot.empty .nm, .slot.bye .nm { color: var(--text3); font-weight: 400; font-style: italic; }
  .slot .src { font-size: 11px; font-weight: 600; font-style: normal; letter-spacing: .04em;
    color: var(--text3); opacity: .8; }
  .slot.locked { cursor: default; }
  .race-box { width: 24px; height: 21px; flex-shrink: 0; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg2); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; color: var(--text2);
    font-variant-numeric: tabular-nums; }
  .slot.won .race-box { border-color: var(--accent); color: var(--green2); }

  .gf-col { border-left: 1px solid var(--border); padding-left: 26px; }
  .gf-col .round-label { color: var(--accent); }
  .champion { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px;
    border: 1px solid var(--accent); border-radius: var(--radius); background: var(--bg2); margin-bottom: 18px; }
  .champion .lbl { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); }
  .champion .nm { font-size: 24px; font-weight: 700; color: var(--green2); }

  .empty-state { padding: 46px 18px; text-align: center; color: var(--text3); font-size: 14px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    h1 { font-size: 18px; }
    .round { min-width: 165px; }
  }

  /* ── Print: this gets taped to the wall and written on in pen ── */
  @media print {
    @page { size: landscape; margin: 0.4in; }
    :root, html[data-theme="light"], html[data-theme="dark"] {
      --bg: #fff; --bg2: #fff; --bg3: #f2f2f2; --bg4: #eee;
      --border: #999; --border2: #666;
      --text: #000; --text2: #222; --text3: #555;
      --accent: #000; --cream: #000; --green2: #000; --loss: #000; --on-accent: #000;
    }
    html, body { background: #fff; font-size: 9.5pt; }
    header, .setup-card, .btn-row, .theme-btn, .header-felt,
    #saved-panel, .payout.add, .linkish, .th-actions { display: none !important; }
    .th-name { font-size: 15pt; color: #000; }
    .th-meta { font-size: 8pt; color: #555; }
    main { padding: 0; }
    .wrap { max-width: none; padding: 0; }
    .card { border: none; margin-bottom: 10px; break-inside: avoid; }
    .card-header { background: transparent; border-bottom: 1px solid #000; padding: 0 0 4px; }
    .card-title { font-size: 11pt; }
    .bracket-scroll { overflow: visible; padding: 8px 0 0; }
    /* Browsers drop background colors when printing, and the connectors are
       colored divs — without this the bracket prints as boxes with no lines. */
    .line { background: #000 !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .race-box, .match { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Canvas widths are fixed pixels, so shrink to fit the page. zoom reflows
       (transform would leave the original height as blank space). */
    .canvas { zoom: .74; }
    .match { break-inside: avoid; }
    .slot { padding: 5px 7px 5px 22px; min-height: 26px; }
    .slot.won .nm { font-weight: 700; }
    .slot.lost .nm { text-decoration: line-through; }
    .race-box { border: 1px solid #666; color: #000; }
    .champion { border: 1px solid #000; }
    .print-head { display: block !important; }
  }
  footer { border-top: 1px solid var(--border); padding: 18px 0; text-align: center;
    font-size: 11px; color: var(--text3); letter-spacing: .05em; }
  .print-head { display: none; margin-bottom: 10px; }
  .print-head .t { font-size: 14pt; font-weight: 700; }
  .print-head .d { font-size: 9pt; color: #555; }
</style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div>
        <h1>Tournament</h1>
        <div class="sub">Double Elimination · Fargo Rate Races</div>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark" aria-label="Toggle light or dark theme">🌙</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <div class="print-head" id="print-head"></div>

  <!-- Nothing in the address bar: let someone type a code -->
  <div class="card code-entry" id="code-entry">
    <div class="card-header"><span class="card-title">Open a tournament</span></div>
    <div class="pad">
      <label class="fl" for="code-in">Tournament code</label>
      <input id="code-in" class="code-input" type="text" maxlength="9" size="4" spellcheck="false"
        autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')goToCode()">
      <button class="act primary code-go" onclick="goToCode()">Open</button>
      <div class="hint" id="hint"></div>
      <div class="hint" id="saved-note"></div>
      <div class="code-help">Four characters, from the officer running the tournament.</div>
    </div>
  </div>

  <div id="out"></div>
  <input type="hidden" id="tname"><span id="tid" style="display:none"></span>
  <input type="hidden" id="fee"><input type="hidden" id="bar"><input type="hidden" id="chart">

</div>
</main>

<footer>
  <div class="wrap">Kemmerer Pool League &nbsp;·&nbsp; Tournament &nbsp;·&nbsp; v1.28</div>
</footer>

<script>
/* ── Theme ── */
function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('kpl-theme', t); } catch(e) {}
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = t === 'light' ? '☀' : '🌙';
}
function toggleTheme() { applyTheme(isLight() ? 'dark' : 'light'); }
(function () {
  let saved = null;
  try { saved = localStorage.getItem('kpl-theme'); } catch(e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => applyTheme(saved));
})();

/* ── Bracket construction ──
   Slots are declarative: each names a seed, or the winner/loser of an earlier
   match. Resolution is then one pass over the matches in order. */

// 1 meets the bottom seed, 2 the next, and so on. Built recursively so byes —
// which always land on the highest seed numbers — spread across the draw
// instead of clustering in one quarter.
function seedOrder(size) {
  let order = [1];
  while (order.length < size) {
    const round = order.length * 2 + 1;
    const next = [];
    for (const s of order) next.push(s, round - s);
    order = next;
  }
  return order;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBracket(names, savedSeeds, format) {
  const isSingle = format === 'single';
  // savedSeeds reproduces a draw exactly on reload; otherwise it's a fresh shuffle.
  let bySeed, size, n;
  if (savedSeeds) {
    bySeed = { ...savedSeeds };
    size = Object.keys(bySeed).length;
    n = Object.values(bySeed).filter(Boolean).length;
  } else {
    const players = shuffle(names);
    n = players.length;
    size = 1;
    while (size < n) size *= 2;
    bySeed = {};
    players.forEach((p, i) => bySeed[i + 1] = p);
    for (let s = n + 1; s <= size; s++) bySeed[s] = null;   // null === bye
  }
  const rounds = Math.log2(size);

  const matches = [];
  const add = m => { matches.push(m); return m; };

  const order = seedOrder(size);
  let prev = [];
  for (let r = 1; r <= rounds; r++) {
    const cur = [];
    for (let i = 0, c = size / Math.pow(2, r); i < c; i++) {
      cur.push(add({
        id: `W${r}-${i}`, bracket: 'W', round: r, winner: null,
        slots: r === 1
          ? [{ type: 'seed', seed: order[i*2] }, { type: 'seed', seed: order[i*2+1] }]
          : [{ type: 'winner', of: prev[i*2].id }, { type: 'winner', of: prev[i*2+1].id }],
      }));
    }
    prev = cur;
  }
  const wbFinal = prev[0];

  // Single elimination stops here: the last winners match is the final.
  if (isSingle) {
    numberMatches(matches, rounds, true);
    return { matches, bySeed, size, rounds, playerCount: n, byeCount: size - n, format: 'single' };
  }

  // Losers bracket alternates minor rounds (survivors meet) with major rounds
  // (survivors meet the players just knocked out of the winners bracket).
  const wbRound = r => matches.filter(m => m.bracket === 'W' && m.round === r);
  let lbPrev = [];
  for (let r = 1, last = rounds > 1 ? (rounds - 1) * 2 : 0; r <= last; r++) {
    const cur = [];
    if (r === 1) {
      const drops = wbRound(1);
      for (let i = 0; i < drops.length / 2; i++) {
        cur.push(add({ id: `L1-${i}`, bracket: 'L', round: 1, winner: null,
          slots: [{ type: 'loser', of: drops[i*2].id }, { type: 'loser', of: drops[i*2+1].id }] }));
      }
    } else if (r % 2 === 0) {
      const drops = wbRound(r / 2 + 1);
      // Cross-over: losers dropping out of the winners bracket must not land on
      // the side holding the players they just beat. Reversing the drop order on
      // the first major round (and alternating after) sends them to the opposite
      // end of the losers bracket.
      const dd = (r / 2) % 2 === 1 ? [...drops].reverse() : drops;
      for (let i = 0; i < lbPrev.length; i++) {
        cur.push(add({ id: `L${r}-${i}`, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'loser', of: dd[i].id }, { type: 'winner', of: lbPrev[i].id }] }));
      }
    } else {
      for (let i = 0; i < lbPrev.length / 2; i++) {
        cur.push(add({ id: `L${r}-${i}`, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'winner', of: lbPrev[i*2].id }, { type: 'winner', of: lbPrev[i*2+1].id }] }));
      }
    }
    lbPrev = cur;
  }
  const lbFinal = lbPrev.length ? lbPrev[0] : null;

  // A 2-player field has no losers bracket, so the opponent is the winners-final loser.
  add({ id: 'GF', bracket: 'GF', round: 1, winner: null,
    slots: [{ type: 'winner', of: wbFinal.id },
            lbFinal ? { type: 'winner', of: lbFinal.id } : { type: 'loser', of: wbFinal.id }] });
  add({ id: 'GF2', bracket: 'GF', round: 2, winner: null,
    slots: [{ type: 'winner', of: 'GF' }, { type: 'loser', of: 'GF' }] });

  numberMatches(matches, rounds);
  return { matches, bySeed, size, rounds, playerCount: n, byeCount: size - n, format: 'double' };
}

// Number matches in the order they'll actually be called, so "Match 12" means
// something to whoever is running the tournament.
function numberMatches(matches, rounds, isSingle) {
  const seq = [];
  for (let r = 1; r <= rounds; r++) {
    seq.push(...matches.filter(m => m.bracket === 'W' && m.round === r));
    if (isSingle) continue;
    if (r === 1) seq.push(...matches.filter(m => m.bracket === 'L' && m.round === 1));
    else {
      seq.push(...matches.filter(m => m.bracket === 'L' && m.round === (r - 1) * 2));
      seq.push(...matches.filter(m => m.bracket === 'L' && m.round === (r - 1) * 2 + 1));
    }
  }
  seq.push(...matches.filter(m => m.bracket === 'GF'));
  let no = 1;
  for (const m of seq) if (!m.no) m.no = no++;
}

function resolve(b) {
  const byId = Object.fromEntries(b.matches.map(m => [m.id, m]));
  const nameOf = slot => {
    if (slot.type === 'seed') return b.bySeed[slot.seed] ?? null;
    const src = byId[slot.of];
    if (!src || !src.resolved) return undefined;
    return slot.type === 'winner' ? src.winnerName : src.loserName;
  };

  for (const m of b.matches) {
    m.players = m.slots.map(nameOf);
    m.resolved = false; m.autoWon = false; m.live = true;
    m.winnerName = undefined; m.loserName = undefined;

    // The reset is only played if the losers-bracket player took the first
    // grand final — otherwise the winners-bracket player finished unbeaten.
    if (m.id === 'GF2') {
      const gf = byId['GF'];
      if (!gf) { m.live = false; m.players = [undefined, undefined]; continue; }
      m.live = gf.resolved && gf.winner === 1;
      if (!m.live) { m.players = [undefined, undefined]; continue; }
    }

    const [a, c] = m.players;
    if (a === undefined || c === undefined) continue;

    if (a === null && c === null) { m.winnerName = null; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (c === null) { m.winnerName = a; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (a === null) { m.winnerName = c; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (m.winner === 0 || m.winner === 1) {
      m.winnerName = m.players[m.winner];
      m.loserName  = m.players[1 - m.winner];
      m.resolved = true;
    }
  }
  return b.matches;
}

function champion(b) {
  const byId = Object.fromEntries(b.matches.map(m => [m.id, m]));
  if (b.format === 'single') {
    const final = b.matches.filter(m => m.bracket === 'W' && m.round === b.rounds)[0];
    return final && final.resolved ? final.winnerName : null;
  }
  const gf = byId['GF'], gf2 = byId['GF2'];
  if (!gf || !gf.resolved) return null;
  if (gf.winner === 0) return gf.winnerName;
  return gf2.resolved ? gf2.winnerName : null;
}

/* The pill on each match box. A leading T so "12" reads as a table rather than
   a score or a match number. While scoring it doubles as the override control,
   and a match still waiting for a table gets a dashed one to press. */
function tablePill(m) {
  const scoring = !!(serverCode && adminCode);
  const t = B.assigned && B.assigned[m.id];
  const ready = !m.resolved && m.players[0] !== undefined && m.players[1] !== undefined
             && m.players[0] !== null && m.players[1] !== null;
  if (B.held && B.held[m.id]) {
    return `<span class="match-tbl held${scoring ? ' pick' : ''}"${
      scoring ? ` onclick="openTableMenu(event,'${m.id}')"` : ''}>On hold</span>`;
  }
  if (!t && (!ready || !scoring || !(B.tableList || []).length)) return '';
  const cls = 'match-tbl' + (t ? '' : ' none') + (scoring ? ' pick' : '');
  const click = scoring ? ` onclick="openTableMenu(event,'${m.id}')"` : '';
  return `<span class="${cls}"${click}>${t ? `Table ${esc(t)}` : 'No table'}</span>`;
}

/* ── Display names ──
   A bracket box has room for "Kirt C", not "Kirt Connelly". Shortening happens
   here rather than in the stored data, so tournaments created before this and
   names typed in by hand get the same treatment. Two people who shorten to the
   same thing keep letters of the surname until they differ. */
const NAME_SUFFIXES = ['jr', 'jr.', 'sr', 'sr.', 'ii', 'iii', 'iv'];


/* First name plus as much of the surname as it takes to be unique. */
function uniqueShort(first, last, taken) {
  const list = taken || [];
  for (let i = 1; i <= last.length; i++) {
    const cand = first + ' ' + last.slice(0, i);
    if (!list.some(t => String(t).toLowerCase() === cand.toLowerCase())) return cand;
  }
  return first + ' ' + last;
}

function shortenName(full, taken) {
  const raw = String(full || '').trim();
  // FargoRate carries nicknames in brackets — "Taydon (TK) Reilly". Everyone at
  // the bar calls him TK, so that's the name that goes on the sheet.
  const nick = (raw.match(/\(([^)]+)\)/) || [])[1];
  let parts = raw.replace(/\([^)]*\)/g, ' ').trim().split(/\s+/).filter(Boolean);
  while (parts.length > 2 && NAME_SUFFIXES.indexOf(parts[parts.length - 1].toLowerCase()) >= 0) parts.pop();
  if (nick) {
    if (!parts.length) return nick.trim();
    const surname = parts[parts.length - 1];
    return uniqueShort(nick.trim(), surname, taken);
  }
  if (parts.length < 2) return parts[0] || '';
  const first = parts[0], last = parts[parts.length - 1];
  return uniqueShort(first, last, taken);
}

/* Built once per render so the whole field is considered together. */
function buildDisplayNames(names) {
  const map = {}, taken = [];
  names.filter(Boolean).forEach(full => {
    if (map[full]) return;
    const s = shortenName(full, taken);
    taken.push(s);
    map[full] = s;
  });
  return map;
}

const disp = (n) => (DISPLAY && DISPLAY[n]) || n;
let DISPLAY = {};

/* ── Table assignment ──
   Matches that are ready to play get a table, best table first. The rules, in
   the order they bite:

     1. Once the final is ready it claims the top-priority table. If that table
        is busy the final waits for it rather than dropping to a lesser one.
        Until the final is ready the top table is used normally — reserving it
        all tournament would leave the best table dark all night.
     2. Winners-bracket matches get first call on what's left, lowest match
        number first.
     3. No table ever sits empty while a match is ready to play. Winners
        matches get first pick, so they take the better tables, but once
        they're all placed a losers match takes whatever is left — including
        the top table.
     4. An assignment sticks until the match is played, so nobody gets moved
        mid-rack, and an admin can override any of it.

   `assigned` maps matchId -> table label, and is carried with the tournament. */

function readyMatches(B) {
  return B.matches.filter(function (m) {
    return m.live && !m.resolved
        && !(B.held && B.held[m.id])          // a player has stepped out
        && m.players[0] !== undefined && m.players[1] !== undefined
        && m.players[0] !== null && m.players[1] !== null;
  });
}

/* The last match on the winners side — a grand final, or for single elimination
   the winners final itself. */
function finalIds(B) {
  var ids = [];
  var gf = B.matches.filter(function (m) { return m.bracket === 'GF'; });
  if (gf.length) {
    gf.forEach(function (m) { ids.push(m.id); });
  } else {
    B.matches.forEach(function (m) {
      if (m.bracket === 'W' && m.round === B.rounds) ids.push(m.id);
    });
  }
  return ids;
}

function anyWinnersUnplayed(B) {
  return B.matches.some(function (m) {
    return m.live && m.bracket === 'W' && !m.resolved;
  });
}

function assignTables(B) {
  var list = (B.tableList || []).slice();
  if (!list.length) { B.assigned = {}; return B.assigned; }
  list.sort(function (a, b) { return a.priority - b.priority; });

  var prev = B.assigned || {};
  Object.keys(B.held || {}).forEach(function (id) { delete prev[id]; });
  var ready = readyMatches(B);
  var readyIds = {};
  ready.forEach(function (m) { readyIds[m.id] = m; });

  // Keep what's already out there; drop assignments for matches now played.
  var next = {}, taken = {};
  Object.keys(prev).forEach(function (id) {
    if (readyIds[id] && list.some(function (t) { return t.label === prev[id]; })
        && !taken[prev[id]]) {
      next[id] = prev[id];
      taken[prev[id]] = true;
    }
  });

  var top = list[0].label;
  var finals = finalIds(B);
  var isFinal = function (id) { return finals.indexOf(id) >= 0; };

  // A ready final claims the top table, displacing nothing — it simply waits
  // until that table comes free.
  var readyFinal = ready.filter(function (m) { return isFinal(m.id) && !next[m.id]; })[0];
  if (readyFinal && !taken[top]) { next[readyFinal.id] = top; taken[top] = true; }

  var queue = ready
    .filter(function (m) { return !next[m.id] && !isFinal(m.id); })
    .sort(function (a, b) {
      if (a.bracket !== b.bracket) return a.bracket === 'W' ? -1 : 1;
      return a.no - b.no;
    });

  queue.forEach(function (m) {
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (taken[t.label]) continue;
      next[m.id] = t.label;
      taken[t.label] = true;
      return;
    }
  });

  B.assigned = next;
  return next;
}

/* Moving a match by hand. If the table is already taken the two swap, so the
   match that was there keeps a table where it can. If the mover had none, the
   one being displaced goes back to waiting — which is the point when someone
   has stepped out and you want their table given to a match that can start. */
function moveMatchToTable(B, matchId, label) {
  B.assigned = B.assigned || {};
  var had = B.assigned[matchId] || null;
  if (!label) { delete B.assigned[matchId]; return B.assigned; }
  var holder = null;
  Object.keys(B.assigned).forEach(function (id) {
    if (B.assigned[id] === label && id !== matchId) holder = id;
  });
  if (holder) {
    if (had) B.assigned[holder] = had;
    else delete B.assigned[holder];
  }
  B.assigned[matchId] = label;
  return B.assigned;
}

/* ── Payouts ──
   First takes half the pot. The other half splits two-thirds / one-third between
   second and third — the same as a straight 1/2, 1/3, 1/6 of the whole.
   First and second round to the nearest $5 so they're payable in bills; third
   absorbs the difference, keeping the three payouts equal to what was collected. */
const ORDINALS = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];

/* The suggested split when you pick a number of spots: first takes half, and
   the other half is shared among the rest in descending weights. At three spots
   that lands exactly on the league's usual 50 / 33.33 / 16.67. */
function suggestedSplit(spots) {
  const n = Math.max(1, Math.min(10, spots | 0));
  if (n === 1) return [100];
  const weights = [];
  for (let i = 1; i < n; i++) weights.push(n - i);
  const total = weights.reduce((a, b) => a + b, 0);
  return [50, ...weights.map(w => (w / total) * 50)];
}

const DEFAULT_PAYOUTS = suggestedSplit(3).map((pct, i) => ({ label: ORDINALS[i], pct }));

/* Percentages in, dollars out. Every spot rounds to the nearest $5 so it can be
   paid in bills, and the last one absorbs the difference — so the payouts always
   add up to exactly what was collected. */
function computePayouts(players, feeDollars, addOnDollars, spec) {
  const entries = Math.round(players * feeDollars * 100);    // cents, no float drift
  const addOn   = Math.round((addOnDollars || 0) * 100);
  const pot     = entries + addOn;
  if (pot <= 0) return null;

  const rows = (spec && spec.length ? spec : DEFAULT_PAYOUTS)
    .map(r => ({ label: r.label, pct: Number(r.pct) || 0 }));
  const to5 = (cents) => Math.round(cents / 500) * 500;

  let out = rows.map(r => ({ label: r.label, cents: to5(pot * r.pct / 100) }));

  // On a small pot the lower places can round away to nothing. Drop them rather
  // than listing someone for $0 — this has to catch middle places too, not just
  // the tail, since the last place is about to absorb the remainder.
  out = out.filter((r, i) => i === 0 || r.cents > 0);

  for (;;) {
    const others = out.slice(0, -1).reduce((a, r) => a + r.cents, 0);
    out[out.length - 1].cents = pot - others;          // last place takes the remainder
    if (out.length === 1 || out[out.length - 1].cents > 0) break;
    out.pop();
  }
  return { pot, entries, addOn, rows: out };
}

const money = (cents) => {
  const v = cents / 100;
  return '$' + (Number.isInteger(v) ? v.toLocaleString('en-US')
                                    : v.toLocaleString('en-US', { minimumFractionDigits: 2 }));
};

/* The generator seeds the split; from there every line is editable and you can
   add your own (Top Lady, high break, whatever). Once anything is touched the
   card stops recalculating so an edit can't be wiped by a fee change. */
function autoPayouts(players, fee, addOn) {
  const p = computePayouts(players, fee, addOn, B && B.payoutSpec);
  return p ? p.rows : [];
}

function payoutRows(players, fee, addOn) {
  if (!B.payoutsManual) return autoPayouts(players, fee, addOn);
  return B.payoutsManual;
}

// Copy the computed rows into an editable set the first time anything changes.
function goManual(players, fee, addOn) {
  if (!B.payoutsManual) B.payoutsManual = autoPayouts(players, fee, addOn);
  return B.payoutsManual;
}

function editPayout(idx, field) {
  if (readOnly) return;
  const el = document.querySelector(`.payout[data-idx="${idx}"] .${field === 'label' ? 'place' : 'amt'}`);
  if (!el || el.querySelector('input')) return;
  const rows = goManual(lastPayoutCtx.players, lastPayoutCtx.fee, lastPayoutCtx.addOn);
  const row = rows[idx];
  if (!row) return;

  const val = field === 'label' ? row.label : (row.cents / 100);
  el.innerHTML = `<input class="pay-input ${field}" value="${esc(val)}"
    ${field === 'amt' ? 'type="number" step="5" min="0"' : 'spellcheck="false"'}>`;
  const inp = el.querySelector('input');

/* ── Hot races ──
   FargoRate's published "hot" charts. Each row is [minDiff, maxDiff, [favorite,
   underdog]] — note these shorten the underdog's race as the gap grows rather
   than lengthening the favorite's, so races stay a sensible length. */
const RACE_CHARTS = {
  R2: [[0,67,[2,2]], [68,112,[3,2]], [113,Infinity,[4,2]]],
  R3: [[0,67,[3,3]], [68,112,[3,2]], [113,147,[4,2]], [148,Infinity,[5,2]]],
  R4: [[0,45,[4,4]], [46,80,[4,3]], [81,146,[5,3]], [147,175,[5,2]], [176,Infinity,[6,2]]],
  R5: [[0,34,[5,5]], [35,62,[5,4]], [63,108,[6,4]], [109,131,[6,3]], [132,151,[7,3]],
       [152,Infinity,[8,3]]],
  R6: [[0,27,[6,6]], [28,51,[6,5]], [52,85,[7,5]], [86,106,[7,4]], [107,151,[8,4]],
       [152,169,[8,3]], [170,Infinity,[9,3]]],
  R7: [[0,23,[7,7]], [24,43,[7,6]], [44,71,[8,6]], [72,89,[8,5]], [90,123,[9,5]],
       [124,139,[9,4]], [140,185,[10,4]], [186,Infinity,[10,3]]],
};

function currentChart() {
  const k = (document.getElementById('chart') || {}).value || 'R3';
  return RACE_CHARTS[k] ? k : 'R3';
}

/* Two ways to set races. A hot chart works off the gap between the two players,
   so the same person races differently depending who they draw. Custom bands
   give each player one race from their own rating, whoever is across the table. */
function bandRace(rating) {
  const rows = (B && B.raceBands && B.raceBands.length) ? B.raceBands : null;
  if (!rows) return DEFAULT_RACE;
  if (!rating) return rows[rows.length - 1].race;      // unrated gets the longest
  for (const b of rows) {
    if (b.max === null || b.max === undefined || rating <= b.max) return b.race;
  }
  return rows[rows.length - 1].race;
}

const DEFAULT_RACE = 3;

/* Returns [raceForA, raceForB] for two ratings. */
function hotRace(ra, rb) {
  if (B && B.raceMode === 'bands') return [bandRace(ra), bandRace(rb)];
  const chart = RACE_CHARTS[currentChart()];
  const even  = chart[0][2][0];                 // the chart's level race, e.g. 3 for R3
  if (!ra || !rb) return [even, even];

  const diff = Math.abs(ra - rb);
  const row  = chart.find(([lo, hi]) => diff >= lo && diff <= hi) || chart[chart.length - 1];
  const [fav, dog] = row[2];
  if (ra === rb) return [even, even];
  return ra > rb ? [fav, dog] : [dog, fav];
}

const ratingOf = (name) => {
  const p = roster.find(x => x.name === name);
  return p ? p.rating : null;
};

const raceOf = (name) => (B && B.races && B.races[name]) || DEFAULT_RACE;

let serverCode = null;      // set when opened from a link

async function openFromServer(code, admin) {
  serverCode = code;
  adminCode = admin || null;
  readOnly = !adminCode;
  note('Loading ' + code + '…');
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(code), {
      headers: adminCode ? { 'X-Admin-Code': adminCode } : {},
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      document.getElementById('code-entry').style.display = 'none';
      document.getElementById('out').innerHTML = `<div class="notice-card">${

      return;

      adminCode = null; readOnly = true;
      note('That admin code was not accepted — showing it read only.', true);
    }

/* Every division page carries the full dropdown, so fetching any one of them
   gives the current list — new seasons included, without editing this file. */
async function fetchDivisions() {
  for (const seed of DIVISIONS.map(d => d[0])) {
    try {
      const r = await fetch(PROXY + encodeURIComponent(`${LMS}/LeagueReports/${seed}`));
      if (!r.ok) continue;

      const sel = html.match(/<select[^>]*id="division-list"[^>]*>([\s\S]*?)<\/select>/i);
      if (!sel) continue;
      const found = [];
      const re = /<option[^>]*value="([0-9a-f-]{36})"[^>]*>([\s\S]*?)<\/option>/gi;
      let m;
      while ((m = re.exec(sel[1]))) {
        found.push([m[1], m[2].replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim()]);
      }
      if (found.length) return found;

/* Ratings move once a week, so a day-old index is fine and saves rebuilding it
   on every visit. */
const INDEX_CACHE = 'kpl-fargo-index';
const CACHE_HOURS = 24;

function readCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(INDEX_CACHE));
    if (!raw || !raw.at || !Array.isArray(raw.players)) return null;
    if (Date.now() - raw.at > CACHE_HOURS * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
}
function writeCache(players, divisions) {
  try {
    localStorage.setItem(INDEX_CACHE, JSON.stringify({ at: Date.now(), players, divisions }));
  } catch (e) { /* storage full or blocked — the index just rebuilds next time */ }
}

/* ── Fargo lookup ── */
function parsePlayerList(html, divLabel) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return [];

  const rows = [...table.querySelectorAll('tr')];
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  if (!headers.length && rows[0]) headers = [...rows[0].querySelectorAll('td')].map(td => td.textContent.trim());
  const ratingIdx = headers.findIndex(h => /rating|fargo/i.test(h));
  const nameIdx   = headers.findIndex(h => /name/i.test(h));

  const out = [];
  rows.slice(1).forEach(tr => {
    const cells = [...tr.querySelectorAll('td')].map(td => td.textContent.replace(/\s+/g,' ').trim());
    if (!cells.length) return;
    const raw = cells[nameIdx >= 0 ? nameIdx : 1] || cells[0];
    const rating = parseInt(cells[ratingIdx >= 0 ? ratingIdx : cells.length - 1], 10);
    if (!raw || !rating) return;
    // FargoRate lists names "Last, First" — flip for searching
    const name = /,\s/.test(raw) ? raw.replace(/^([^,]+),\s*(.+)$/, '$2 $1') : raw;
    out.push({ name, rating, division: divLabel });
  });
  return out;
}

async function loadIndex() {
  if (playerIndex) return playerIndex;
  if (indexLoading) return indexLoading;

  const cached = readCache();
  if (cached) {
    playerIndex = cached.players;
    lateStatus(`${playerIndex.length} players (saved earlier today)`);
    return playerIndex;
  }

  lateStatus('Loading player lists from FargoRate…');
  indexLoading = (async () => {
    const divisions = await fetchDivisions();
    const all = [];
    let failed = 0;
    await Promise.all(divisions.map(async ([id, label]) => {
      try {
        const r = await fetch(PROXY + encodeURIComponent(`${LMS}/GeneratePlayerListReport/${id}`));
        if (!r.ok) throw new Error(r.status);
        all.push(...parsePlayerList(await r.text(), label));
      } catch (e) { failed++; }
    }));

    // Same player can appear in several divisions — keep the highest rating.
    const byKey = {};
    all.forEach(p => {
      const k = p.name.toLowerCase();
      if (!byKey[k] || p.rating > byKey[k].rating) byKey[k] = p;
    });
    playerIndex = Object.values(byKey).sort((a, b) => a.name.localeCompare(b.name));
    if (playerIndex.length) writeCache(playerIndex, divisions.map(d => d[1]));

    lateStatus(playerIndex.length
      ? `${playerIndex.length} players from ${divisions.length} divisions${failed ? ` · ${failed} unavailable` : ''}`
      : 'No players came back — check the proxy, or add players by hand.');
    return playerIndex;
  })();
  return indexLoading;
}

          <div id="late-results" class="results"></div>

            <button class="linkish" onclick="lateManualMode()">Not in a league? Enter it by hand</button>
          </div>
        </div>
        <div id="late-hand" style="display:none">
          <label class="fl" for="late-name">Name</label>
          <input id="late-name" class="late-in" type="text" spellcheck="false" placeholder="Barry McIff">
          <label class="fl" for="late-rating" style="margin-top:12px">Fargo rating</label>
          <input id="late-rating" class="late-in" type="number" min="0" max="1200" placeholder="450">
          <div class="hint" id="late-hand-msg" style="margin-top:8px"></div>
          <div class="btn-row" style="padding:14px 0 0;border:none">
            <button class="act primary" onclick="lateAddByHand()">Add player</button>
            <button class="linkish" onclick="lateFindMode()">Search instead</button>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(back);
  document.getElementById('late-search').focus();
  loadIndex();                                   // warm it while they type
}

function lateManualMode() {
  document.getElementById('late-find').style.display = 'none';
  document.getElementById('late-hand').style.display = '';
  document.getElementById('late-name').focus();
}
function lateFindMode() {
  document.getElementById('late-hand').style.display = 'none';
  document.getElementById('late-find').style.display = '';
  document.getElementById('late-search').focus();
}

async function lateSearch() {
  const q = document.getElementById('late-search').value.trim().toLowerCase();
  const box = document.getElementById('late-results');
  if (q.length < 2) { box.innerHTML = ''; lateHits = []; return; }
  const index = await loadIndex();
  if (!index) return;
  lateHits = index.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
  lateSel = 0;
  box.innerHTML = lateHits.length
    ? lateHits.map((p, i) => `<div class="res${i === lateSel ? ' sel' : ''}"
        data-n="${esc(p.name)}" data-r="${p.rating}" onclick="lateAddFrom(this)">
        <span class="rn">${esc(p.name)}</span>
        <span class="rd">${esc(p.division)}</span>
        <span class="rf">${p.rating}</span></div>`).join('')
    : `<div class="hint" style="padding:8px 0">Nobody by that name — add them by hand.</div>`;
}

function lateKey(e) {
  if (!lateHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    lateSel = Math.max(0, Math.min(lateHits.length - 1, lateSel + (e.key === 'ArrowDown' ? 1 : -1)));
    [...document.querySelectorAll('#late-results .res')].forEach((el, i) =>
      el.classList.toggle('sel', i === lateSel));
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const el = document.querySelectorAll('#late-results .res')[lateSel];
    if (el) lateAddFrom(el);
  }
  if (e.key === 'Escape') closeLate();
}

function lateAddFrom(el) { placeLatePlayer(el.dataset.n, parseInt(el.dataset.r, 10) || 0); }

function lateAddByHand() {
  const name = (document.getElementById('late-name').value || '').trim();
  const rating = parseInt(document.getElementById('late-rating').value, 10) || 0;
  const msg = document.getElementById('late-hand-msg');
  if (!name) { msg.textContent = 'Give them a name.'; msg.style.color = 'var(--loss)'; return; }
  placeLatePlayer(name, rating);
}

/* ── Removing a player ──
   Only before they have played. Taking someone out after a real result would
   invalidate it, so the same downstream check that governs byes applies here:
   their own match must be undecided and nothing after it played. */
function removablePlayers() {
  const out = [];
  B.matches.filter(m => m.bracket === 'W' && m.round === 1).forEach(m => {
    const ownPlayed = m.resolved && !m.autoWon;
    if (ownPlayed || downstreamPlayed(m.id)) return;
    m.slots.forEach((s) => {
      if (s.type !== 'seed') return;
      const name = B.bySeed[s.seed];
      if (!name) return;
      out.push({ name, seed: s.seed, mid: m.id, no: m.no });
    });
  });
  return out.sort((a, b) => a.name.localeCompare(b.name));
}

function closeRemove() {
  const el = document.getElementById('rm-back');
  if (el) el.remove();
}

function showRemove() {
  if (readOnly || !B) return;
  closeRemove();
  const list = removablePlayers();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.id = 'rm-back';
  back.onclick = (e) => { if (e.target === back) closeRemove(); };
  back.innerHTML = `
    <div class="modal">
      <div class="modal-head">Remove a player
        <span class="mh-sub">${list.length} can be removed</span>
      </div>
      <div class="pad">
        ${list.length ? `
          <div class="hint" style="margin-bottom:10px">
            Their spot becomes a bye. Only players who haven't played yet are listed.
          </div>
          <div class="rm-list">${list.map(r => `
            <button class="rm-row" data-seed="${r.seed}" data-mid="${r.mid}"
              data-name="${esc(r.name)}" onclick="removeFrom(this)">
              <span class="rn2">${esc(disp(r.name))}</span>
              <span class="rm2">match ${r.no}</span>
            </button>`).join('')}</div>`
        : `<div class="rm-none">Nobody can be removed &mdash; everyone still in has
             played a match, or has a result riding on theirs.</div>`}
      </div>
    </div>`;
  document.body.appendChild(back);
}

function removeFrom(el) {
  const name = el.dataset.name;
  if (!confirm(`Take ${name} out? Their spot becomes a bye.`)) return;
  const seed = Number(el.dataset.seed);
  B.bySeed[seed] = null;
  clearDownstream(el.dataset.mid);
  roster = roster.filter(x => x.name !== name);
  closeRemove();
  render();
  note(`${name} removed — their spot is a bye.`);
}

/* ── Late entry ──
   A latecomer is drawn at random into one of the open byes rather than placed
   by hand, so nobody gets to pick the soft side of the draw. A bye only counts
   as open while nothing downstream of it has been played — once the player who
   got that bye has won a real match, dropping someone in would wipe a result. */
function downstreamPlayed(mid) {
  const deps = {};
  B.matches.forEach(m => m.slots.forEach(s => {
    if (s.of) (deps[s.of] = deps[s.of] || []).push(m.id);
  }));
  const byId = Object.fromEntries(B.matches.map(m => [m.id, m]));
  const seen = new Set([mid]);
  const stack = [mid];
  while (stack.length) {
    for (const nid of (deps[stack.pop()] || [])) {
      if (seen.has(nid)) continue;
      seen.add(nid);
      const m = byId[nid];
      // Only a result that still stands counts. A stored winner on a match whose
      // players are no longer known is stale, and shouldn't keep a bye shut.
      if (m && m.live && m.resolved && !m.autoWon) return true;
      stack.push(nid);
    }
  }
  return false;
}

function openByes() {
  const out = [];
  B.matches.filter(m => m.bracket === 'W' && m.round === 1).forEach(m => {
    m.slots.forEach((s, i) => {
      if (s.type === 'seed' && B.bySeed[s.seed] === null && !downstreamPlayed(m.id))
        out.push({ mid: m.id, seed: s.seed });
    });
  });
  return out;
}

function addLatePlayer() {
  if (readOnly || !B) return;
  const open = openByes();
  if (!open.length) {
    note('No open spots left — every bye has already been played through.', true);
    return;
  }
  lateSpots = open.length;
  showLate();
}

/* Draws them at random into one of the open byes. */
function placeLatePlayer(name, rating) {
  const open = openByes();
  if (!open.length) { closeLate(); note('No open spots left.', true); return; }
  if (Object.values(B.bySeed).some(n => n && n.toLowerCase() === name.toLowerCase())) {
    lateStatus(`${name} is already in this tournament.`, true);
    const hm = document.getElementById('late-hand-msg');
    if (hm) { hm.textContent = `${name} is already in this tournament.`; hm.style.color = 'var(--loss)'; }
    return;
  }
  roster = roster.filter(x => x.name.toLowerCase() !== name.toLowerCase());
  roster.push({ name, rating, division: null });

  const spot = open[Math.floor(Math.random() * open.length)];
  B.bySeed[spot.seed] = name;
  clearDownstream(spot.mid);
  const no = B.matches.find(m => m.id === spot.mid).no;
  closeLate();
  render();
  note(`${name} drawn into match ${no}${rating ? ' at ' + rating : ''}.`);
}

/* Adding a player mid-tournament invalidates anything decided after that match,
   so those results are cleared rather than left pointing at the wrong person. */
function clearDownstream(mid, keepSelf) {
  const deps = {};
  B.matches.forEach(m => m.slots.forEach(s => {
    if (s.of) (deps[s.of] = deps[s.of] || []).push(m.id);
  }));
  const seen = new Set();
  const walk = (id) => {
    (deps[id] || []).forEach(nid => {
      if (seen.has(nid)) return;
      seen.add(nid);
      const m = B.matches.find(x => x.id === nid);
      if (m) m.winner = null;
      walk(nid);
    });
  };
  const self = B.matches.find(x => x.id === mid);
  if (self && !keepSelf) self.winner = null;
  walk(mid);
}

const COL_W = 172, COL_GAP = 48, SLOT_H = 32, MATCH_H = SLOT_H * 2 + 2,
      LANE = 84, HEAD_H = 34, LEFT_PAD = 24;

/* A match sits at the vertical midpoint of whatever feeds it. Round one is
   evenly spaced; everything after is derived, so joins land dead center between
   their two feeders and 1:1 feeds run perfectly straight. */
// Vertical offset of a row's center from the box center.
const rowOffset = i => (i + 0.5) * SLOT_H - MATCH_H / 2 + 1;

function computeLayout(list, lane) {
  const rounds = [...new Set(list.map(m => m.round))].sort((a, b) => a - b);
  const pos = {};
  rounds.forEach((r, ri) => {
    const cur = list.filter(m => m.round === r);
    const prevIds = ri ? list.filter(m => m.round === rounds[ri - 1]).map(m => m.id) : [];
    cur.forEach((m, i) => {
      let y;
      if (!ri) y = HEAD_H + (i + 0.5) * lane;
      else {
        const feeds = [];
        m.slots.forEach((s, si) => {
          if (s.of && prevIds.includes(s.of) && !feeds.some(f => f.id === s.of))
            feeds.push({ id: s.of, y: pos[s.of].y, slot: si });
        });
        if (feeds.length === 1) {
          // Only one player arrives along the bracket (the other drops in from
          // the winners side). Sit the box so that feed is a straight line into
          // its row, leaving the drop-in row above it.
          y = feeds[0].y - rowOffset(feeds[0].slot);
        } else if (feeds.length) {
          y = feeds.reduce((a, f) => a + f.y, 0) / feeds.length;
        } else {
          y = HEAD_H + (i + 0.5) * lane;
        }
      }
      pos[m.id] = { col: ri, y, round: r };
    });
  });
  return { pos, rounds };
}

const colX = col => LEFT_PAD + col * (COL_W + COL_GAP);

/* Every feed ends at the row that will hold that player, not the middle of the
   box — that's what makes it read as a bracket. */
function connectorHTML(list, pos) {
  const px = [];
  const line = (x, y, w, h) => px.push(
    `<div class="line" style="left:${Math.round(x)}px;top:${Math.round(y)}px;width:${Math.max(w,1)}px;height:${Math.max(h,1)}px"></div>`);
  const rowY = (m, i) => pos[m.id].y - MATCH_H / 2 + 1 + (i + 0.5) * SLOT_H;

  list.forEach(m => {
    const myCol = pos[m.id].col, myLeft = colX(myCol);
    m.slots.forEach((s, i) => {
      if (!s.of) return;
      const y = rowY(m, i);
      const src = pos[s.of];

      if (src && src.col === myCol - 1) {
        const fRight = colX(src.col) + COL_W, midX = fRight + COL_GAP / 2;
        line(fRight, src.y, midX - fRight, 1);                            // out of the feeder
        if (Math.abs(src.y - y) > 0.5)
          line(midX, Math.min(src.y, y), 1, Math.abs(src.y - y));         // step across to the row
        line(midX, y, myLeft - midX, 1);                                  // into the row
      }
      // Rows fed from the other bracket get no line — the L-number already says
      // which match that player fell out of, and a stub to nowhere just adds noise.
    });
  });
  return px.join('');
}

function bracketHTML(list, labelFor, lane) {
  if (!list.length) return '';
  const { pos, rounds } = computeLayout(list, lane);
  const height = Math.max(...Object.values(pos).map(p => p.y)) + MATCH_H / 2 + 12;
  const width  = colX(rounds.length - 1) + COL_W;

  const labels = rounds.map((r, ri) => {
    const n = list.filter(m => m.round === r).length;
    return `<div class="round-label" style="left:${colX(ri)}px;width:${COL_W}px">${labelFor(r, n)}</div>`;
  }).join('');

  const boxes = list.map(m => {
    const p = pos[m.id];
    return `<div class="match${m.resolved ? ' decided' : ''}"
      style="left:${colX(p.col)}px;top:${Math.round(p.y - MATCH_H / 2)}px;width:${COL_W}px;height:${MATCH_H}px">
      <span class="match-no">${m.no}</span>${tablePill(m)}${slotHTML(m,0)}${slotHTML(m,1)}</div>`;
  }).join('');

  return `<div class="canvas" style="height:${Math.round(height)}px;width:${width}px">
    ${labels}${connectorHTML(list, pos)}${boxes}</div>`;
}

function render() {
  resolve(B);
  DISPLAY = buildDisplayNames(Object.keys(B.bySeed).sort((a, b) => a - b).map(k => B.bySeed[k]));
  assignTables(B);
  const waitingForTable = B.tableList && B.tableList.length
    ? readyMatches(B).filter(m => !B.assigned[m.id]).length : 0;
  queueSave();
  const wb = B.matches.filter(m => m.bracket === 'W');
  const lb = B.matches.filter(m => m.bracket === 'L');
  const gf = B.matches.filter(m => m.bracket === 'GF' && m.live);

  // Finals continue the winners row, so they're laid out as extra rounds on the
  // same canvas — that keeps the line running straight out of the winners final.
  const wbRounds = Math.max(...wb.map(m => m.round));
  const gfShifted = gf.map(m => ({ ...m, round: wbRounds + m.round }));
  const wbAll = [...wb, ...gfShifted];

  const single = B.format === 'single';
  const wbLabel = (r) => r > wbRounds ? (r === wbRounds + 2 ? 'Final #2' : 'Final')
    : r === wbRounds ? (single ? 'Final' : 'Winners Final')
    : r === wbRounds - 1 ? (single ? 'Semifinals' : 'Winners Semis')
    : r === wbRounds - 2 && single ? 'Quarterfinals'
    : single ? `Round ${r}` : `Winners R${r}`;
  const lbLast = (B.rounds - 1) * 2;
  const lbLabel = (r) => r === lbLast ? 'Losers Final'
    : r === lbLast - 1 ? 'Losers Semis' : `Losers R${r}`;

  // The losers bracket opens with half as many matches, so its lane is doubled
  // and the two brackets end up on the same rows.
  const lbFirst = lb.filter(m => m.round === 1).length || 1;
  const lbLane = ((B.size / 2) * LANE) / lbFirst;

  const champ = champion(B);
  const live = Object.values(B.bySeed).filter(Boolean).length;
  const byes = B.size - live;
  const byeNote = byes ? ` · ${byes} bye${byes === 1 ? '' : 's'}` : '';

  document.getElementById('print-head').innerHTML =
    `<div class="t">Kemmerer Pool League — Tournament</div>
     <div class="d">${live} players${byeNote} · ${B.raceMode === 'bands' ? 'custom races' : currentChart() + ' hot races'} · Drawn ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>`;

  const fee = parseFloat(document.getElementById('fee').value) || 0;
  const bar = parseFloat(document.getElementById('bar').value) || 0;

  const tName = (document.getElementById('tname').value || '').trim();
  const scoring = !!(serverCode && adminCode);

  document.getElementById('out').innerHTML = `
    ${scoring
        ? `<div class="ro-banner"><span class="live-dot"></span>Scoring — tap a name to advance them. Anyone watching sees it within twenty seconds.</div>`
        : ''}
    <div class="tourney-head">
      <div class="th-left">
        <div class="th-name">${tName ? esc(tName) : 'Untitled tournament'}</div>
        <div class="th-meta"><span class="th-id">${esc(currentId || '')}</span>
          <span id="save-meta"></span></div>
      </div>
      <div class="th-actions">
        ${scoring && openByes().length
          ? `<button class="act" onclick="addLatePlayer()">Add late player</button>` : ''}
        ${scoring && removablePlayers().length
          ? `<button class="act" onclick="showRemove()">Remove player</button>` : ''}
        ${scoring ? `<button class="act" onclick="copyViewLink()">Copy view link</button>` : ''}
        <button class="act" onclick="window.print()">Print</button>
      </div>
    </div>
    ${payoutHTML(live, fee, bar, champ)}
    ${champ ? `<div class="champion"><span class="lbl">Champion</span><span class="nm">${esc(disp(champ))}</span></div>` : ''}
    <div class="card">
      <div class="card-header">
        <span class="card-title">${single ? 'Bracket' : 'Winners Bracket'}</span>
        <span class="card-meta">${waitingForTable
          ? `<span class="wait-tbl">${waitingForTable} waiting for a table</span> &middot; ` : ''}${live} players${byeNote} · ${B.raceMode === 'bands' ? 'custom races' : currentChart() + ' hot'}</span>
      </div>
      <div class="bracket-scroll">${bracketHTML(wbAll, wbLabel, LANE)}</div>
    </div>
    ${lb.length ? `<div class="card">
      <div class="card-header"><span class="card-title">Losers Bracket</span></div>
      <div class="bracket-scroll">${bracketHTML(lb, lbLabel, lbLane)}</div>
    </div>` : ''}`;
}

updateCount();

// ?t=… is a shared tournament packed into the link; #ID reopens a local one.
/* ── Overriding a table ── */
function closeTableMenu() {
  const el = document.getElementById('tbl-menu');
  if (el) el.remove();
}

function openTableMenu(ev, mid) {
  ev.stopPropagation();
  closeTableMenu();
  if (!(serverCode && adminCode) || !(B.tableList || []).length) return;

  const m = B.matches.find(x => x.id === mid);
  const here = B.assigned[mid] || null;
  const holderOf = (label) => {
    const id = Object.keys(B.assigned).find(k => B.assigned[k] === label && k !== mid);
    if (!id) return '';
    const o = B.matches.find(x => x.id === id);
    return o ? `#${o.no}` : '';
  };

  const list = (B.tableList || []).slice().sort((a, b) => a.priority - b.priority);
  const menu = document.createElement('div');
  menu.className = 'tbl-menu';
  menu.id = 'tbl-menu';
  menu.innerHTML = `<div class="hd">Match ${m.no} &middot; move to</div>`
    + list.map(t => {
        const who = holderOf(t.label);
        return `<button class="${t.label === here ? 'on' : ''}" data-t="${esc(t.label)}">
          Table ${esc(t.label)}<span class="who">${who ? 'now ' + who : 'free'}</span></button>`;
      }).join('')
    + `<button class="clear" data-hold="1">${B.held && B.held[mid]
        ? 'Back in play' : 'Hold &mdash; a player has stepped out'}</button>`;

  document.body.appendChild(menu);
  const r = ev.target.getBoundingClientRect();
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left - w + r.width)) + 'px';
  menu.style.top = (r.bottom + h + 8 > window.innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';

  menu.querySelectorAll('button').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      B.held = B.held || {};
      if (b.dataset.hold) {
        if (B.held[mid]) delete B.held[mid];
        else { B.held[mid] = true; delete B.assigned[mid]; }   // frees it for someone else
      } else {
        delete B.held[mid];
        moveMatchToTable(B, mid, b.dataset.t || null);
      }
      closeTableMenu();
      renderKeepingTables();
    };
  });
}

/* A hand-placed match must survive the next automatic pass, so run the render
   without letting the assigner reshuffle what was just set. */
function renderKeepingTables() {
  render();
  queuePush();
}

document.addEventListener('click', closeTableMenu);

function goToCode() {
  const v = (document.getElementById('code-in').value || '').replace(/\s/g, '').toUpperCase();
  // An officer who knows their admin code can enter CODE-ADMIN here and land
  // straight in scoring. The hint underneath only ever mentions the four
  // character public code, so it isn't something a player stumbles into.
  const pair = v.match(/^([A-Z1-9]{4})-?([A-Z1-9]{4})$/);
  if (pair) { location.search = '?t=' + pair[1] + '&a=' + pair[2]; return; }
  if (v.length !== 4) {
    const h = document.getElementById('hint');
    h.textContent = 'Codes are four characters.'; h.style.color = 'var(--loss)';
    return;
  }
  location.search = '?t=' + v;
}

(function () {
  const q = new URLSearchParams(location.search);
  const code = (q.get('t') || '').toUpperCase();
  if (code) openFromServer(code, (q.get('a') || '').toUpperCase());
})();
</script>
