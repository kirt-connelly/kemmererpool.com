<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414; --bg2: #1e1e1e; --bg3: #262626; --bg4: #2e2e2e;
    --border: #363636; --border2: #464646;
    --text: #ffffff; --text2: #b0a898; --text3: #666058;
    --accent: #27855a; --cream: #e8ddd0; --green2: #32a870; --loss: #cc4444;
    --on-accent: #ffffff;
    --radius: 8px; --radius-sm: 5px;
  }
  html[data-theme="light"] {
    --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae6df; --bg4: #ddd8ce;
    --border: #d6d0c5; --border2: #bcb4a6;
    --text: #1a1714; --text2: #5a5348; --text3: #8b8376;
    --accent: #1f6b48; --cream: #2b2419; --green2: #1a7a4e; --loss: #b23636;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); }
  .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0,#154d28 4px,#1a5c32 8px); opacity: .5; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 12px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
  .theme-btn { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-size: 13px; padding: 0; }
  .theme-btn:hover { background: var(--bg4); color: var(--text); }

  main { padding: 22px 0 70px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-meta { font-size: 12px; color: var(--text3); }
  .pad { padding: 18px; }
  .setup-head { cursor: pointer; user-select: none; }
  .setup-head:hover .card-title { color: var(--green2); }
  .head-right { display: flex; align-items: center; gap: 11px; }
  .chev { font-size: 20px; line-height: 1; color: var(--text2); display: inline-block; transition: transform .18s; }
  /* Collapsed after the draw — the setup is done, the bracket is the point. */
  .setup-card.collapsed .pad { display: none; }
  .setup-card.collapsed .chev { transform: rotate(-90deg); }

  label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font-family: inherit; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .fee-row { margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .fee-input { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
  .fee-input:focus-within { border-color: var(--accent); }
  .fee-input span { color: var(--text3); font-size: 14px; }
  .fee-input input { width: 76px; border: none; background: none; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 9px 0; }
  .fee-input input:focus { outline: none; }
  .fee-input select { border: none; background: none; color: var(--text); font-family: inherit;
    font-size: 14px; padding: 9px 0; cursor: pointer; }
  .fee-input select:focus { outline: none; }

  /* ── Player lookup ── */
  .lookup { display: flex; gap: 10px; flex-wrap: wrap; }
  .lookup input { flex: 1; min-width: 200px; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
  .lookup input:focus { outline: none; border-color: var(--accent); }
  .results { display: flex; flex-direction: column; gap: 1px; margin-top: 10px; background: var(--border);
    border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .results:empty { display: none; }
  .result { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; background: var(--bg); cursor: pointer; font-size: 14px; }
  .result:hover, .result.sel { background: var(--bg3); }
  .result .rn { color: var(--cream); font-weight: 600; }
  .result .rd { font-size: 11px; color: var(--text3); }
  .result .rr { font-weight: 700; font-variant-numeric: tabular-nums; }
  .roster { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .roster:empty { display: none; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; }
  .rrow .n { flex: 1; color: var(--cream); font-weight: 600; }
  .rrow .f { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rrow .d { font-size: 11px; color: var(--text3); }
  .rrow .x { background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px; }
  .rrow .x:hover { color: var(--loss); }
  .rrow.manual .f { color: var(--text2); }

  /* ── Payouts ── */
  .payouts { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .payout { flex: 1; min-width: 128px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); padding: 12px 14px; }
  .payout .place { font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text3); }
  .payout .amt { font-size: 22px; font-weight: 700; color: var(--cream); margin-top: 3px;
    font-variant-numeric: tabular-nums; }
  .payout .place, .payout .amt { cursor: pointer; border-radius: 3px; }
  .payout .place:hover, .payout .amt:hover { background: var(--bg3); }
  .payout.add { flex: 0 0 auto; min-width: 48px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-family: inherit; color: var(--text3);
    cursor: pointer; border: 1px dashed var(--border2); border-radius: var(--radius-sm);
    background: none; padding: 12px 14px; }
  .payout.add:hover { color: var(--green2); border-color: var(--accent); }
  .pay-input { width: 100%; font-family: inherit; background: var(--bg2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; }
  .pay-input:focus { outline: none; }
  .pay-input.place, .pay-input.label { font-size: 11px; font-weight: 700; letter-spacing: .09em; }
  .pay-input.amt { font-size: 20px; font-weight: 700; }
  .payout-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 0 18px 16px; }
  .tally { font-size: 12px; font-weight: 600; }
  .tally.ok { color: var(--text3); }
  .tally.off { color: var(--loss); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 12px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--text); }
  .payout.first { border-color: var(--accent); }
  .payout.first .amt { color: var(--green2); }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 18px; }
  .setup-card:not(.collapsed) .btn-row { border-top: 1px solid var(--border); }
  button.act { font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: .03em;
    padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text2); transition: background .15s, color .15s; }
  button.act:hover { background: var(--bg4); color: var(--text); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.act.primary:hover { opacity: .87; color: var(--on-accent); }
  button.act:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 12px; color: var(--text3); }

  /* ── Bracket ── */
  .bracket-scroll { overflow-x: auto; padding: 4px 18px 22px; }
  /* Positions are computed in JS and set inline — flexbox can't align a bracket
     reliably once rounds stop halving (losers-bracket major rounds feed 1:1). */
  .canvas { position: relative; min-width: min-content; }
  .round-label { position: absolute; top: 0; font-size: 10px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--text3);
    text-align: center; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .line { position: absolute; background: var(--border2); }
  .match { position: absolute; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  .match.decided { border-color: var(--border2); }
  .match.ready { border-color: var(--accent); }
  .match-no { position: absolute; top: -1px; left: -1px; font-size: 9px; font-weight: 700;
    background: var(--bg3); color: var(--text3); padding: 1px 5px; border-radius: var(--radius-sm) 0 var(--radius-sm) 0;
    letter-spacing: .04em; }
  .slot { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 9px 0 26px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .slot:last-child { border-bottom: none; }
  .slot:hover:not(.locked) { background: var(--bg3); }
  .slot .nm { font-weight: 600; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.won .nm { color: var(--green2); }
  .slot.lost .nm { color: var(--text3); text-decoration: line-through; }
  .slot.empty .nm, .slot.bye .nm { color: var(--text3); font-weight: 400; font-style: italic; }
  .slot .src { font-size: 11px; font-weight: 600; font-style: normal; letter-spacing: .04em;
    color: var(--text3); opacity: .8; }
  .slot.locked { cursor: default; }
  .slot.bye.open { cursor: pointer; }
  .slot.bye.open .nm { color: var(--accent); font-style: normal; font-weight: 600; }
  .slot.bye.open:hover { background: var(--bg3); }
  .slot-input { width: 100%; font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--cream); background: var(--bg2); border: 1px solid var(--accent);
    border-radius: 3px; padding: 3px 6px; }
  .slot-input:focus { outline: none; }
  .race-box { width: 24px; height: 21px; flex-shrink: 0; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg2); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; color: var(--text2);
    font-variant-numeric: tabular-nums; }
  .slot.won .race-box { border-color: var(--accent); color: var(--green2); }

  .gf-col { border-left: 1px solid var(--border); padding-left: 26px; }
  .gf-col .round-label { color: var(--accent); }
  .champion { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px;
    border: 1px solid var(--accent); border-radius: var(--radius); background: var(--bg2); margin-bottom: 18px; }
  .champion .lbl { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); }
  .champion .nm { font-size: 24px; font-weight: 700; color: var(--green2); }

  .empty-state { padding: 46px 18px; text-align: center; color: var(--text3); font-size: 14px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    h1 { font-size: 18px; }
    .round { min-width: 165px; }
  }

  /* ── Print: this gets taped to the wall and written on in pen ── */
  @media print {
    @page { size: landscape; margin: 0.4in; }
    :root, html[data-theme="light"], html[data-theme="dark"] {
      --bg: #fff; --bg2: #fff; --bg3: #f2f2f2; --bg4: #eee;
      --border: #999; --border2: #666;
      --text: #000; --text2: #222; --text3: #555;
      --accent: #000; --cream: #000; --green2: #000; --loss: #000; --on-accent: #000;
    }
    html, body { background: #fff; font-size: 9.5pt; }
    header, .setup-card, .btn-row, .theme-btn, .header-felt { display: none !important; }
    main { padding: 0; }
    .wrap { max-width: none; padding: 0; }
    .card { border: none; margin-bottom: 10px; break-inside: avoid; }
    .card-header { background: transparent; border-bottom: 1px solid #000; padding: 0 0 4px; }
    .card-title { font-size: 11pt; }
    .bracket-scroll { overflow: visible; padding: 8px 0 0; }
    /* Browsers drop background colours when printing, and the connectors are
       coloured divs — without this the bracket prints as boxes with no lines. */
    .line { background: #000 !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .race-box, .match { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Canvas widths are fixed pixels, so shrink to fit the page. zoom reflows
       (transform would leave the original height as blank space). */
    .canvas { zoom: .74; }
    .match { break-inside: avoid; }
    .slot { padding: 5px 7px 5px 22px; min-height: 26px; }
    .slot.won .nm { font-weight: 700; }
    .slot.lost .nm { text-decoration: line-through; }
    .race-box { border: 1px solid #666; color: #000; }
    .champion { border: 1px solid #000; }
    .print-head { display: block !important; }
  }
  footer { border-top: 1px solid var(--border); padding: 18px 0; text-align: center;
    font-size: 11px; color: var(--text3); letter-spacing: .05em; }
  .print-head { display: none; margin-bottom: 10px; }
  .print-head .t { font-size: 14pt; font-weight: 700; }
  .print-head .d { font-size: 9pt; color: #555; }
</style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div>
        <h1>Tournament</h1>
        <div class="sub">Kemmerer Pool League · Double Elimination · Fargo Races</div>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark" aria-label="Toggle light or dark theme">🌙</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <div class="print-head" id="print-head"></div>

  <div class="card setup-card">
    <div class="card-header setup-head" onclick="toggleSetup()" title="Show or hide setup">
      <span class="card-title">Players and Entry Fee</span>
      <span class="head-right">
        <span class="card-meta" id="count-meta">0 players</span>
        <span class="chev">▾</span>
      </span>
    </div>
    <div class="pad">
      <div class="lookup">
        <input id="search" type="text" spellcheck="false" autocomplete="off"
          placeholder="Type a player's name…" oninput="onSearch()" onkeydown="onSearchKey(event)">
        <button class="act" onclick="onSearch(true)">Search</button>
        <button class="act" onclick="manualAdd()">Add manually</button>
      </div>
      <div id="search-status" class="hint"></div>
      <div id="results" class="results"></div>
      <div id="roster" class="roster"></div>
      <div class="fee-row">
        <div>
          <label class="fl" for="fee">Entry fee per player</label>
          <div class="fee-input"><span>$</span><input id="fee" type="number" min="0" step="1"
            value="10" inputmode="decimal" oninput="onFeeChange()"></div>
        </div>
        <div>
          <label class="fl" for="bar">Bar add-on</label>
          <div class="fee-input"><span>$</span><input id="bar" type="number" min="0" step="5"
            value="0" inputmode="decimal" oninput="onFeeChange()"></div>
        </div>
        <div>
          <label class="fl" for="chart">Race chart</label>
          <div class="fee-input"><select id="chart" onchange="onFeeChange()">
            <option value="R2">R2 — hot</option>
            <option value="R3" selected>R3 — hot</option>
            <option value="R4">R4 — hot</option>
            <option value="R5">R5 — hot</option>
            <option value="R6">R6 — hot</option>
            <option value="R7">R7 — hot</option>
          </select></div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="act primary" id="draw-btn" onclick="draw()">Go — build bracket</button>
      <button class="act" id="redraw-btn" onclick="draw()" disabled>Redraw</button>
      <button class="act" id="print-btn" onclick="window.print()" disabled>Print</button>
      <button class="act" id="clear-btn" onclick="clearResults()" disabled>Clear results</button>
      <span class="hint" id="hint"></span>
    </div>
  </div>

  <div id="out"></div>

</div>
</main>

<footer>
  <div class="wrap">Kemmerer Pool League &nbsp;·&nbsp; Tournament &nbsp;·&nbsp; v1.4</div>
</footer>

<script>
/* ── Theme ── */
function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('kpl-theme', t); } catch(e) {}
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = t === 'light' ? '☀' : '🌙';
}
function toggleTheme() { applyTheme(isLight() ? 'dark' : 'light'); }
(function () {
  let saved = null;
  try { saved = localStorage.getItem('kpl-theme'); } catch(e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => applyTheme(saved));
})();

/* ── Bracket construction ──
   Slots are declarative: each names a seed, or the winner/loser of an earlier
   match. Resolution is then one pass over the matches in order. */

// 1 meets the bottom seed, 2 the next, and so on. Built recursively so byes —
// which always land on the highest seed numbers — spread across the draw
// instead of clustering in one quarter.
function seedOrder(size) {
  let order = [1];
  while (order.length < size) {
    const round = order.length * 2 + 1;
    const next = [];
    for (const s of order) next.push(s, round - s);
    order = next;
  }
  return order;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBracket(names) {
  const players = shuffle(names);
  const n = players.length;
  let size = 1;
  while (size < n) size *= 2;
  const rounds = Math.log2(size);

  const bySeed = {};
  players.forEach((p, i) => bySeed[i + 1] = p);
  for (let s = n + 1; s <= size; s++) bySeed[s] = null;   // null === bye

  const matches = [];
  const add = m => { matches.push(m); return m; };

  const order = seedOrder(size);
  let prev = [];
  for (let r = 1; r <= rounds; r++) {
    const cur = [];
    for (let i = 0, c = size / Math.pow(2, r); i < c; i++) {
      cur.push(add({
        id: `W${r}-${i}`, bracket: 'W', round: r, winner: null,
        slots: r === 1
          ? [{ type: 'seed', seed: order[i*2] }, { type: 'seed', seed: order[i*2+1] }]
          : [{ type: 'winner', of: prev[i*2].id }, { type: 'winner', of: prev[i*2+1].id }],
      }));
    }
    prev = cur;
  }
  const wbFinal = prev[0];

  // Losers bracket alternates minor rounds (survivors meet) with major rounds
  // (survivors meet the players just knocked out of the winners bracket).
  const wbRound = r => matches.filter(m => m.bracket === 'W' && m.round === r);
  let lbPrev = [];
  for (let r = 1, last = rounds > 1 ? (rounds - 1) * 2 : 0; r <= last; r++) {
    const cur = [];
    if (r === 1) {
      const drops = wbRound(1);
      for (let i = 0; i < drops.length / 2; i++) {
        cur.push(add({ id: `L1-${i}`, bracket: 'L', round: 1, winner: null,
          slots: [{ type: 'loser', of: drops[i*2].id }, { type: 'loser', of: drops[i*2+1].id }] }));
      }
    } else if (r % 2 === 0) {
      const drops = wbRound(r / 2 + 1);
      // Cross-over: losers dropping out of the winners bracket must not land on
      // the side holding the players they just beat. Reversing the drop order on
      // the first major round (and alternating after) sends them to the opposite
      // end of the losers bracket.
      const dd = (r / 2) % 2 === 1 ? [...drops].reverse() : drops;
      for (let i = 0; i < lbPrev.length; i++) {
        cur.push(add({ id: `L${r}-${i}`, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'loser', of: dd[i].id }, { type: 'winner', of: lbPrev[i].id }] }));
      }
    } else {
      for (let i = 0; i < lbPrev.length / 2; i++) {
        cur.push(add({ id: `L${r}-${i}`, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'winner', of: lbPrev[i*2].id }, { type: 'winner', of: lbPrev[i*2+1].id }] }));
      }
    }
    lbPrev = cur;
  }
  const lbFinal = lbPrev.length ? lbPrev[0] : null;

  // A 2-player field has no losers bracket, so the opponent is the winners-final loser.
  add({ id: 'GF', bracket: 'GF', round: 1, winner: null,
    slots: [{ type: 'winner', of: wbFinal.id },
            lbFinal ? { type: 'winner', of: lbFinal.id } : { type: 'loser', of: wbFinal.id }] });
  add({ id: 'GF2', bracket: 'GF', round: 2, winner: null,
    slots: [{ type: 'winner', of: 'GF' }, { type: 'loser', of: 'GF' }] });

  numberMatches(matches, rounds);
  return { matches, bySeed, size, rounds, playerCount: n, byeCount: size - n };
}

// Number matches in the order they'll actually be called, so "Match 12" means
// something to whoever is running the tournament.
function numberMatches(matches, rounds) {
  const seq = [];
  for (let r = 1; r <= rounds; r++) {
    seq.push(...matches.filter(m => m.bracket === 'W' && m.round === r));
    if (r === 1) seq.push(...matches.filter(m => m.bracket === 'L' && m.round === 1));
    else {
      seq.push(...matches.filter(m => m.bracket === 'L' && m.round === (r - 1) * 2));
      seq.push(...matches.filter(m => m.bracket === 'L' && m.round === (r - 1) * 2 + 1));
    }
  }
  seq.push(...matches.filter(m => m.bracket === 'GF'));
  let no = 1;
  for (const m of seq) if (!m.no) m.no = no++;
}

function resolve(b) {
  const byId = Object.fromEntries(b.matches.map(m => [m.id, m]));
  const nameOf = slot => {
    if (slot.type === 'seed') return b.bySeed[slot.seed] ?? null;
    const src = byId[slot.of];
    if (!src || !src.resolved) return undefined;
    return slot.type === 'winner' ? src.winnerName : src.loserName;
  };

  for (const m of b.matches) {
    m.players = m.slots.map(nameOf);
    m.resolved = false; m.autoWon = false; m.live = true;
    m.winnerName = undefined; m.loserName = undefined;

    // The reset is only played if the losers-bracket player took the first
    // grand final — otherwise the winners-bracket player finished unbeaten.
    if (m.id === 'GF2') {
      const gf = byId['GF'];
      m.live = gf.resolved && gf.winner === 1;
      if (!m.live) { m.players = [undefined, undefined]; continue; }
    }

    const [a, c] = m.players;
    if (a === undefined || c === undefined) continue;

    if (a === null && c === null) { m.winnerName = null; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (c === null) { m.winnerName = a; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (a === null) { m.winnerName = c; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (m.winner === 0 || m.winner === 1) {
      m.winnerName = m.players[m.winner];
      m.loserName  = m.players[1 - m.winner];
      m.resolved = true;
    }
  }
  return b.matches;
}

function champion(b) {
  const byId = Object.fromEntries(b.matches.map(m => [m.id, m]));
  const gf = byId['GF'], gf2 = byId['GF2'];
  if (!gf.resolved) return null;
  if (gf.winner === 0) return gf.winnerName;
  return gf2.resolved ? gf2.winnerName : null;
}

/* ── Payouts ──
   First takes half the pot. The other half splits two-thirds / one-third between
   second and third — the same as a straight 1/2, 1/3, 1/6 of the whole.
   First and second round to the nearest $5 so they're payable in bills; third
   absorbs the difference, keeping the three payouts equal to what was collected. */
function computePayouts(players, feeDollars, addOnDollars) {
  const entries = Math.round(players * feeDollars * 100);    // cents, no float drift
  const addOn   = Math.round((addOnDollars || 0) * 100);
  const pot     = entries + addOn;
  if (pot <= 0) return null;
  const to5 = (cents) => Math.round(cents / 500) * 500;

  const first  = to5(pot / 2);
  let   second = to5(pot / 3);
  let   third  = pot - first - second;

  // Tiny pots can leave nothing for third — pay two places instead of a zero.
  if (third <= 0) { second = pot - first; third = 0; }
  return { pot, entries, addOn, first, second, third };
}

const money = (cents) => {
  const v = cents / 100;
  return '$' + (Number.isInteger(v) ? v.toLocaleString('en-US')
                                    : v.toLocaleString('en-US', { minimumFractionDigits: 2 }));
};

/* The generator seeds the split; from there every line is editable and you can
   add your own (Top Lady, high break, whatever). Once anything is touched the
   card stops recalculating so an edit can't be wiped by a fee change. */
function autoPayouts(players, fee, addOn) {
  const p = computePayouts(players, fee, addOn);
  if (!p) return [];
  const rows = [{ label: '1st', cents: p.first }, { label: '2nd', cents: p.second }];
  if (p.third > 0) rows.push({ label: '3rd', cents: p.third });
  return rows;
}

function payoutRows(players, fee, addOn) {
  if (!B.payoutsManual) return autoPayouts(players, fee, addOn);
  return B.payoutsManual;
}

// Copy the computed rows into an editable set the first time anything changes.
function goManual(players, fee, addOn) {
  if (!B.payoutsManual) B.payoutsManual = autoPayouts(players, fee, addOn);
  return B.payoutsManual;
}

function editPayout(idx, field) {
  const el = document.querySelector(`.payout[data-idx="${idx}"] .${field === 'label' ? 'place' : 'amt'}`);
  if (!el || el.querySelector('input')) return;
  const rows = goManual(lastPayoutCtx.players, lastPayoutCtx.fee, lastPayoutCtx.addOn);
  const row = rows[idx];
  if (!row) return;

  const val = field === 'label' ? row.label : (row.cents / 100);
  el.innerHTML = `<input class="pay-input ${field}" value="${esc(val)}"
    ${field === 'amt' ? 'type="number" step="5" min="0"' : 'spellcheck="false"'}>`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();

  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    if (save) {
      if (field === 'label') {
        const t = inp.value.trim();
        if (!t) rows.splice(idx, 1);            // clearing the label removes the line
        else row.label = t;
      } else {
        row.cents = Math.round((parseFloat(inp.value) || 0) * 100);
      }
    }
    render();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit(true);
    if (e.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', () => commit(true));
}

function addPayout() {
  const rows = goManual(lastPayoutCtx.players, lastPayoutCtx.fee, lastPayoutCtx.addOn);
  rows.push({ label: 'Prize', cents: 0 });
  render();
  editPayout(rows.length - 1, 'label');
}

function resetPayouts() { B.payoutsManual = null; render(); }

let lastPayoutCtx = { players: 0, fee: 0, addOn: 0 };

function payoutHTML(players, feeDollars, addOnDollars, champ) {
  lastPayoutCtx = { players, fee: feeDollars, addOn: addOnDollars };
  const p = computePayouts(players, feeDollars, addOnDollars);
  if (!p) return '';
  const rows = payoutRows(players, feeDollars, addOnDollars);
  const paid = rows.reduce((a, r) => a + r.cents, 0);
  const off  = paid - p.pot;

  const breakdown = `${players} × ${money(Math.round(feeDollars*100))}`
    + (p.addOn ? ` + ${money(p.addOn)} bar` : '')
    + ` = ${money(p.pot)} pot`;

  const tally = off === 0
    ? `<span class="tally ok">Paying out ${money(paid)} — balanced</span>`
    : `<span class="tally off">Paying out ${money(paid)} — ${off > 0 ? money(off) + ' over' : money(-off) + ' left'}</span>`;

  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Payouts</span>
      <span class="card-meta">${breakdown}</span>
    </div>
    <div class="payouts">
      ${rows.map((r, i) => `<div class="payout${i === 0 ? ' first' : ''}" data-idx="${i}">
        <div class="place" onclick="editPayout(${i},'label')">${esc(r.label)}</div>
        <div class="amt" onclick="editPayout(${i},'amt')">${money(r.cents)}</div>
      </div>`).join('')}
      <button class="payout add" onclick="addPayout()" title="Add a payout">+</button>
    </div>
    <div class="payout-foot">
      ${tally}
      ${B.payoutsManual ? `<button class="linkish" onclick="resetPayouts()">Reset to calculated</button>` : ''}
    </div>
  </div>`;
}

/* ── Fargo lookup ── */
function parsePlayerList(html, divLabel) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return [];

  const rows = [...table.querySelectorAll('tr')];
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  if (!headers.length && rows[0]) headers = [...rows[0].querySelectorAll('td')].map(td => td.textContent.trim());
  const ratingIdx = headers.findIndex(h => /rating|fargo/i.test(h));
  const nameIdx   = headers.findIndex(h => /name/i.test(h));

  const out = [];
  rows.slice(1).forEach(tr => {
    const cells = [...tr.querySelectorAll('td')].map(td => td.textContent.replace(/\s+/g,' ').trim());
    if (!cells.length) return;
    const raw = cells[nameIdx >= 0 ? nameIdx : 1] || cells[0];
    const rating = parseInt(cells[ratingIdx >= 0 ? ratingIdx : cells.length - 1], 10);
    if (!raw || !rating) return;
    // FargoRate lists names "Last, First" — flip for searching
    const name = /,\s/.test(raw) ? raw.replace(/^([^,]+),\s*(.+)$/, '$2 $1') : raw;
    out.push({ name, rating, division: divLabel });
  });
  return out;
}

async function loadIndex() {
  if (playerIndex) return playerIndex;
  if (indexLoading) return indexLoading;

  setStatus('Loading player lists from FargoRate…');
  indexLoading = (async () => {
    const all = [];
    let failed = 0;
    await Promise.all(DIVISIONS.map(async ([id, label]) => {
      try {
        const r = await fetch(PROXY + encodeURIComponent(`${LMS}/GeneratePlayerListReport/${id}`));
        if (!r.ok) throw new Error(r.status);
        all.push(...parsePlayerList(await r.text(), label));
      } catch (e) { failed++; }
    }));

    // Same player can appear in several divisions — keep the highest rating.
    const byKey = {};
    all.forEach(p => {
      const k = p.name.toLowerCase();
      if (!byKey[k] || p.rating > byKey[k].rating) byKey[k] = p;
    });
    playerIndex = Object.values(byKey).sort((a, b) => a.name.localeCompare(b.name));

    setStatus(playerIndex.length
      ? `${playerIndex.length} players loaded${failed ? ` · ${failed} division${failed>1?'s':''} unavailable` : ''}`
      : 'No players came back — check the proxy, or add players manually.');
    return playerIndex;
  })();
  return indexLoading;
}

function setStatus(msg, bad) {
  const el = document.getElementById('search-status');
  el.textContent = msg || '';
  el.style.color = bad ? 'var(--loss)' : 'var(--text3)';
}

async function onSearch(force) {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const box = document.getElementById('results');
  if (q.length < 2 && !force) { box.innerHTML = ''; return; }
  const idx = await loadIndex();
  const hits = idx.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
  searchSel = 0;
  if (!hits.length) {
    box.innerHTML = '';
    if (q) setStatus(`No one matching "${q}" — use Add manually if they're not in a Jenkins league.`);
    return;
  }
  box.innerHTML = hits.map((p, i) => `<div class="result${i===0?' sel':''}" onclick="addFromIndex('${esc(p.name).replace(/'/g,"\\'")}')">
    <span><span class="rn">${esc(p.name)}</span> <span class="rd">${esc(p.division)}</span></span>
    <span class="rr">${p.rating}</span></div>`).join('');
}

function onSearchKey(e) {
  const items = [...document.querySelectorAll('#results .result')];
  if (e.key === 'Enter') {
    e.preventDefault();
    if (items[searchSel]) items[searchSel].click(); else onSearch(true);
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('sel', i === searchSel));
  }
}

/* ── Hot races ──
   FargoRate's published "hot" charts. Each row is [minDiff, maxDiff, [favourite,
   underdog]] — note these shorten the underdog's race as the gap grows rather
   than lengthening the favourite's, so races stay a sensible length. */
const RACE_CHARTS = {
  R2: [[0,67,[2,2]], [68,112,[3,2]], [113,Infinity,[4,2]]],
  R3: [[0,67,[3,3]], [68,112,[3,2]], [113,147,[4,2]], [148,Infinity,[5,2]]],
  R4: [[0,45,[4,4]], [46,80,[4,3]], [81,146,[5,3]], [147,175,[5,2]], [176,Infinity,[6,2]]],
  R5: [[0,34,[5,5]], [35,62,[5,4]], [63,108,[6,4]], [109,131,[6,3]], [132,151,[7,3]],
       [152,Infinity,[8,3]]],
  R6: [[0,27,[6,6]], [28,51,[6,5]], [52,85,[7,5]], [86,106,[7,4]], [107,151,[8,4]],
       [152,169,[8,3]], [170,Infinity,[9,3]]],
  R7: [[0,23,[7,7]], [24,43,[7,6]], [44,71,[8,6]], [72,89,[8,5]], [90,123,[9,5]],
       [124,139,[9,4]], [140,185,[10,4]], [186,Infinity,[10,3]]],
};

function currentChart() {
  const k = (document.getElementById('chart') || {}).value || 'R3';
  return RACE_CHARTS[k] ? k : 'R3';
}

const DEFAULT_RACE = 3;

/* Returns [raceForA, raceForB] for two ratings under the selected chart. */
function hotRace(ra, rb) {
  const chart = RACE_CHARTS[currentChart()];
  const even  = chart[0][2][0];                 // the chart's level race, e.g. 3 for R3
  if (!ra || !rb) return [even, even];

  const diff = Math.abs(ra - rb);
  const row  = chart.find(([lo, hi]) => diff >= lo && diff <= hi) || chart[chart.length - 1];
  const [fav, dog] = row[2];
  if (ra === rb) return [even, even];
  return ra > rb ? [fav, dog] : [dog, fav];
}

const ratingOf = (name) => {
  const p = roster.find(x => x.name === name);
  return p ? p.rating : null;
};

const raceOf = (name) => (B && B.races && B.races[name]) || DEFAULT_RACE;

function clearResults() {

function pick(id, slotIdx) {
  const m = B.matches.find(x => x.id === id);
  if (!m || m.autoWon || !m.live) return;
  if (m.players[0] === undefined || m.players[1] === undefined) return;
  m.winner = (m.winner === slotIdx) ? null : slotIdx;   // click again to undo
  render();
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function slotHTML(m, i) {
  const v = m.players[i];
  const seedSlot = m.slots[i].type === 'seed' ? m.slots[i].seed : null;
  let cls = 'slot', label, click = `pick('${m.id}',${i})`;

  if (v === undefined) {
    cls += ' empty locked';
    label = `<span class="src">${sourceLabel(m.slots[i])}</span>`;
  }
  else if (v === null) {
    // A first-round bye can be filled in when someone turns up late. Byes
    // further down the losers bracket are consequences, not open slots.
    if (seedSlot !== null) { cls += ' bye open'; label = 'Bye — add player';
                             click = `editBye('${m.id}',${i})`; }
    else                   { cls += ' bye locked'; label = 'Bye'; }
  } else {
    label = esc(v);
    if (m.resolved) cls += (m.winner === i || (m.autoWon && m.winnerName === v)) ? ' won' : ' lost';
    if (m.autoWon) cls += ' locked';
    if (seedSlot !== null) cls += ' named';           // right-click to correct a name
  }
  const races = matchRaces(m);
  const race = (v !== undefined && v !== null) ? (races[i] ?? '') : '';
  return `<div class="${cls}" data-m="${m.id}" data-i="${i}" onclick="${click}"${
    seedSlot !== null ? ` oncontextmenu="editBye('${m.id}',${i});return false"` : ''}>
    <span class="nm">${label}</span><span class="race-box">${race}</span></div>`;
}

/* Both players' races for this match, worked out from their ratings.
   Blank until both are known — a race needs two ratings. */
function matchRaces(m) {
  const [a, b] = m.players || [];
  if (!a || !b) return [null, null];
  const ra = ratingOf(a), rb = ratingOf(b);
  if (!ra || !rb) return [null, null];
  return hotRace(ra, rb);
}

/* Where an undecided slot's player will come from — "L14" is the loser of
   match 14, "W9" the winner of match 9. Lets you trace the bracket on paper. */
function sourceLabel(slot) {
  if (!slot.of) return '—';
  const src = B.matches.find(m => m.id === slot.of);
  if (!src) return '—';
  return (slot.type === 'loser' ? 'L' : 'W') + src.no;
}

/* Replace a slot with an input so a latecomer can be typed straight in. */
function editBye(mid, i) {
  const m = B.matches.find(x => x.id === mid);
  if (!m || m.slots[i].type !== 'seed') return;
  const seed = m.slots[i].seed;
  const el = document.querySelector(`.slot[data-m="${mid}"][data-i="${i}"]`);
  if (!el || el.querySelector('input')) return;

  const cur = B.bySeed[seed] || '';
  el.innerHTML = `<input class="slot-input" value="${esc(cur)}"
    placeholder="Late player's name" spellcheck="false">`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();

  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    if (save) {
      const name = inp.value.trim();
      const changed = (B.bySeed[seed] || '') !== name;
      B.bySeed[seed] = name || null;        // blank puts the bye back
      // A latecomer needs a rating before their races can be worked out.
      if (name && !roster.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        const r = prompt(`Fargo rating for ${name}?`, '450');
        roster.push({ name, rating: parseInt(r, 10) || 0, division: null });
        renderRoster();
      }
      if (changed) clearDownstream(mid);
      updateCount();
    }
    render();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit(true);
    if (e.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', () => commit(true));
}

/* Adding a player mid-tournament invalidates anything decided after that match,
   so those results are cleared rather than left pointing at the wrong person. */
function clearDownstream(mid) {
  const deps = {};
  B.matches.forEach(m => m.slots.forEach(s => {
    if (s.of) (deps[s.of] = deps[s.of] || []).push(m.id);
  }));
  const seen = new Set();
  const walk = (id) => {
    (deps[id] || []).forEach(nid => {
      if (seen.has(nid)) return;
      seen.add(nid);
      const m = B.matches.find(x => x.id === nid);
      if (m) m.winner = null;
      walk(nid);
    });
  };
  const self = B.matches.find(x => x.id === mid);
  if (self) self.winner = null;
  walk(mid);
}

function matchHTML(m) {
  const ready = !m.resolved && m.players[0] !== undefined && m.players[1] !== undefined;
  const cls = 'match' + (m.resolved ? ' decided' : ready ? ' ready' : '');
  return `<div class="${cls}"><span class="match-no">${m.no}</span>
    ${slotHTML(m,0)}${slotHTML(m,1)}</div>`;
}

const COL_W = 172, COL_GAP = 48, SLOT_H = 32, MATCH_H = SLOT_H * 2 + 2,
      LANE = 84, HEAD_H = 34, LEFT_PAD = 24;

/* A match sits at the vertical midpoint of whatever feeds it. Round one is
   evenly spaced; everything after is derived, so joins land dead centre between
   their two feeders and 1:1 feeds run perfectly straight. */
// Vertical offset of a row's centre from the box centre.
const rowOffset = i => (i + 0.5) * SLOT_H - MATCH_H / 2 + 1;

function computeLayout(list, lane) {
  const rounds = [...new Set(list.map(m => m.round))].sort((a, b) => a - b);
  const pos = {};
  rounds.forEach((r, ri) => {
    const cur = list.filter(m => m.round === r);
    const prevIds = ri ? list.filter(m => m.round === rounds[ri - 1]).map(m => m.id) : [];
    cur.forEach((m, i) => {
      let y;
      if (!ri) y = HEAD_H + (i + 0.5) * lane;
      else {
        const feeds = [];
        m.slots.forEach((s, si) => {
          if (s.of && prevIds.includes(s.of) && !feeds.some(f => f.id === s.of))
            feeds.push({ id: s.of, y: pos[s.of].y, slot: si });
        });
        if (feeds.length === 1) {
          // Only one player arrives along the bracket (the other drops in from
          // the winners side). Sit the box so that feed is a straight line into
          // its row, leaving the drop-in row above it.
          y = feeds[0].y - rowOffset(feeds[0].slot);
        } else if (feeds.length) {
          y = feeds.reduce((a, f) => a + f.y, 0) / feeds.length;
        } else {
          y = HEAD_H + (i + 0.5) * lane;
        }
      }
      pos[m.id] = { col: ri, y, round: r };
    });
  });
  return { pos, rounds };
}

const colX = col => LEFT_PAD + col * (COL_W + COL_GAP);

/* Every feed ends at the row that will hold that player, not the middle of the
   box — that's what makes it read as a bracket. */
function connectorHTML(list, pos) {
  const px = [];
  const line = (x, y, w, h) => px.push(
    `<div class="line" style="left:${Math.round(x)}px;top:${Math.round(y)}px;width:${Math.max(w,1)}px;height:${Math.max(h,1)}px"></div>`);
  const rowY = (m, i) => pos[m.id].y - MATCH_H / 2 + 1 + (i + 0.5) * SLOT_H;

  list.forEach(m => {
    const myCol = pos[m.id].col, myLeft = colX(myCol);
    m.slots.forEach((s, i) => {
      if (!s.of) return;
      const y = rowY(m, i);
      const src = pos[s.of];

      if (src && src.col === myCol - 1) {
        const fRight = colX(src.col) + COL_W, midX = fRight + COL_GAP / 2;
        line(fRight, src.y, midX - fRight, 1);                            // out of the feeder
        if (Math.abs(src.y - y) > 0.5)
          line(midX, Math.min(src.y, y), 1, Math.abs(src.y - y));         // step across to the row
        line(midX, y, myLeft - midX, 1);                                  // into the row
      }
      // Rows fed from the other bracket get no line — the L-number already says
      // which match that player fell out of, and a stub to nowhere just adds noise.
    });
  });
  return px.join('');
}

function bracketHTML(list, labelFor, lane) {
  if (!list.length) return '';
  const { pos, rounds } = computeLayout(list, lane);
  const height = Math.max(...Object.values(pos).map(p => p.y)) + MATCH_H / 2 + 12;
  const width  = colX(rounds.length - 1) + COL_W;

  const labels = rounds.map((r, ri) => {
    const n = list.filter(m => m.round === r).length;
    return `<div class="round-label" style="left:${colX(ri)}px;width:${COL_W}px">${labelFor(r, n)}</div>`;
  }).join('');

  const boxes = list.map(m => {
    const p = pos[m.id];
    return `<div class="match${m.resolved ? ' decided' : ''}"
      style="left:${colX(p.col)}px;top:${Math.round(p.y - MATCH_H / 2)}px;width:${COL_W}px;height:${MATCH_H}px">
      <span class="match-no">${m.no}</span>${slotHTML(m,0)}${slotHTML(m,1)}</div>`;
  }).join('');

  return `<div class="canvas" style="height:${Math.round(height)}px;width:${width}px">
    ${labels}${connectorHTML(list, pos)}${boxes}</div>`;
}

function render() {
  resolve(B);
  const wb = B.matches.filter(m => m.bracket === 'W');
  const lb = B.matches.filter(m => m.bracket === 'L');
  const gf = B.matches.filter(m => m.bracket === 'GF' && m.live);

  // Finals continue the winners row, so they're laid out as extra rounds on the
  // same canvas — that keeps the line running straight out of the winners final.
  const wbRounds = Math.max(...wb.map(m => m.round));
  const gfShifted = gf.map(m => ({ ...m, round: wbRounds + m.round }));
  const wbAll = [...wb, ...gfShifted];

  const wbLabel = (r) => r > wbRounds ? (r === wbRounds + 2 ? 'Final #2' : 'Final')
    : r === wbRounds ? 'Winners Final'
    : r === wbRounds - 1 ? 'Winners Semis' : `Winners R${r}`;
  const lbLast = (B.rounds - 1) * 2;
  const lbLabel = (r) => r === lbLast ? 'Losers Final'
    : r === lbLast - 1 ? 'Losers Semis' : `Losers R${r}`;

  // The losers bracket opens with half as many matches, so its lane is doubled
  // and the two brackets end up on the same rows.
  const lbFirst = lb.filter(m => m.round === 1).length || 1;
  const lbLane = ((B.size / 2) * LANE) / lbFirst;

  const champ = champion(B);
  const live = Object.values(B.bySeed).filter(Boolean).length;
  const byes = B.size - live;
  const byeNote = byes ? ` · ${byes} bye${byes === 1 ? '' : 's'}` : '';

  document.getElementById('print-head').innerHTML =
    `<div class="t">Kemmerer Pool League — Tournament</div>
     <div class="d">${live} players${byeNote} · ${currentChart()} hot races · Drawn ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>`;

  const fee = parseFloat(document.getElementById('fee').value) || 0;
  const bar = parseFloat(document.getElementById('bar').value) || 0;

  document.getElementById('out').innerHTML = `
    ${payoutHTML(live, fee, bar, champ)}
    ${champ ? `<div class="champion"><span class="lbl">Champion</span><span class="nm">${esc(champ)}</span></div>` : ''}
    <div class="card">
      <div class="card-header">
        <span class="card-title">Winners Bracket</span>
        <span class="card-meta">${live} players${byeNote} · ${currentChart()} hot</span>
      </div>
      <div class="bracket-scroll">${bracketHTML(wbAll, wbLabel, LANE)}</div>
    </div>
    ${lb.length ? `<div class="card">
      <div class="card-header"><span class="card-title">Losers Bracket</span></div>
      <div class="bracket-scroll">${bracketHTML(lb, lbLabel, lbLane)}</div>
    </div>` : ''}`;
}

renderRoster();
updateCount();
</script>
</body>
</html>
