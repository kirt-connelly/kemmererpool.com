<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Board — Kemmerer Pool League</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ── Built for smart-TV browsers ──
   Samsung's Tizen browser is a Chromium fork frozen at whatever shipped with the
   set, so this file deliberately avoids anything newer than about 2016:
     no optional chaining or ??      (syntax errors kill the whole script)
     no flexbox gap                  (spacing silently collapses)
     no CSS grid, no inset shorthand
     no async/await                  (plain .then instead)
     no Object.fromEntries, .flat(), .at(), replaceAll
   Sizes are large because this is read from across a room. */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', Arial, sans-serif;
  background: #141414;
  color: #ffffff;
  font-size: 22px;
  line-height: 1.4;
  padding: 26px 30px 40px;
}

.head { border-bottom: 2px solid #363636; padding-bottom: 10px; margin-bottom: 16px; overflow: hidden; }
.head h1 { font-size: 27px; font-weight: 700; color: #e8ddd0; float: left; }
.head .meta { float: right; text-align: right; font-size: 17px; color: #666058; padding-top: 4px; }
.head .code { font-family: monospace; letter-spacing: .1em; color: #b0a898; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  background: #32a870; margin-right: 8px; vertical-align: middle; }

.champ { background: #1e1e1e; border: 2px solid #27855a; border-radius: 8px;
  padding: 10px 20px; margin-bottom: 16px; white-space: nowrap; }
.champ .lbl { font-size: 17px; letter-spacing: .14em; text-transform: uppercase;
  color: #666058; margin-right: 12px; }
.champ .nm { font-size: 30px; font-weight: 700; color: #32a870; }

.cols { overflow: hidden; }
.col { float: left; width: 49%; }
.col.right { float: right; }
.col.full { float: none; width: 100%; }

.panel { background: #1e1e1e; border: 2px solid #363636; border-radius: 10px;
  margin-bottom: 20px; overflow: hidden; }
.panel h2 { font-size: 20px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: #b0a898; background: #262626; padding: 12px 20px; border-bottom: 2px solid #363636; }
.panel h2 .n { float: right; color: #666058; letter-spacing: 0; text-transform: none; font-weight: 400; }

.row { padding: 13px 20px; border-bottom: 1px solid #2e2e2e; overflow: hidden; }
.row:last-child { border-bottom: none; }
.row .nm { font-size: 25px; font-weight: 600; color: #e8ddd0; float: left; }
.row .rt { float: right; color: #666058; font-size: 20px; }
.row.out { opacity: .45; }
.row.out .nm { text-decoration: line-through; font-weight: 400; }
.row.seat { background: rgba(50,168,112,.12); }
.row.seat .nm { color: #32a870; }
.row.tstart { border-top: 3px solid #464646; }

/* Chips: filled means in hand, hollow means already lost. Lost come off the left. */
.chips { float: right; padding-top: 7px; }
.chip { display: inline-block; width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid #32a870; background: #32a870; margin-left: 5px; }
.chip.spent { background: transparent; }

.match { padding: 15px 20px; border-bottom: 1px solid #2e2e2e; overflow: hidden; }
.match:last-child { border-bottom: none; }
.match .no { display: inline-block; min-width: 54px; font-size: 20px; font-weight: 700;
  color: #666058; float: left; }
.match .who { float: left; font-size: 25px; font-weight: 600; color: #e8ddd0; }
.match .vs { color: #666058; font-weight: 400; padding: 0 10px; }
.match .race { float: right; color: #b0a898; font-size: 20px; }
.match .tbl { float: right; color: #32a870; font-size: 20px; margin-left: 18px; }

.log { padding: 13px 20px; border-bottom: 1px solid #2e2e2e; font-size: 21px; color: #b0a898; }
.log:last-child { border-bottom: none; }
.log b { color: #e8ddd0; font-weight: 600; }

.empty { padding: 26px 20px; color: #666058; font-size: 21px; }

/* ── Bracket ──
   Absolutely positioned, so no flexbox or grid is needed to lay it out. */
.sec { margin-bottom: 26px; }
.sh { font-size: 19px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: #666058; margin-bottom: 10px; }
.fit { position: relative; overflow: hidden; }
.sc { position: absolute; left: 0; top: 0;
  -webkit-transform-origin: 0 0; transform-origin: 0 0; }
.cv { position: relative; }
.rl { position: absolute; top: 0; font-size: 17px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #666058; text-align: center;
  padding-bottom: 7px; border-bottom: 2px solid #363636; }
.ln { position: absolute; background: #4a4a4a; }
.mt { position: absolute; border: 2px solid #363636; border-radius: 7px;
  background: #1a1a1a; }
/* overflow used to round the ends; the table pill sits above the box now, so
   the rows round themselves instead. */
.mt .sl:first-child { border-radius: 5px 5px 0 0; }
.mt .sl:last-child { border-radius: 0 0 5px 5px; }
.mt.ready { border-color: #27855a; }
.mt.done { border-color: #2e2e2e; }
.mt .no { position: absolute; top: -2px; left: -2px; font-size: 14px; font-weight: 700;
  background: #262626; color: #8a8378; padding: 1px 7px; border-radius: 5px 0 5px 0; }
/* Which table this match is on, centred on the top edge so it clears the races
   in the right-hand corner. */
.mt .tbl { position: absolute; top: -11px; left: 50%;
  -webkit-transform: translateX(-50%); transform: translateX(-50%);
  z-index: 3; font-size: 13px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; white-space: nowrap; line-height: 1.5;
  background: #27855a; color: #ffffff; padding: 1px 10px; border-radius: 99px; }
.mt .tbl.held { background: #1e1e1e; color: #cc4444; border: 1px solid #cc4444; }
.sl { height: 33px; line-height: 33px; padding: 0 12px 0 34px; font-size: 21px;
  font-weight: 600; color: #e8ddd0; border-bottom: 1px solid #2e2e2e;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl:last-child { border-bottom: none; }
.sl.won { color: #32a870; }
.sl.lost { color: #6b6459; text-decoration: line-through; font-weight: 400; }
.sl.empty { color: #666058; font-weight: 400; }
.sl .src { font-size: 17px; letter-spacing: .04em; }
/* The race sits at the right end of each row, so a match reads
   "Dave 3 / Kirt 2" straight down the box. */
.sl .rc { float: right; min-width: 26px; margin-left: 8px; text-align: center;
  font-size: 18px; font-weight: 700; color: #b0a898;
  border: 2px solid #363636; border-radius: 5px; line-height: 24px; height: 26px;
  margin-top: 3px; }
.sl.won .rc { border-color: #27855a; color: #32a870; }
.sl.lost .rc { opacity: .45; }

.enter { max-width: 620px; margin: 6% auto 0; text-align: center; }
.enter h2 { font-size: 30px; color: #e8ddd0; margin-bottom: 8px; }
.enter p { color: #b0a898; margin-bottom: 24px; font-size: 21px; }
.enter input { width: 100%; font-family: monospace; font-size: 58px; font-weight: 700;
  letter-spacing: .3em; text-align: center; text-transform: uppercase;
  color: #e8ddd0; background: #141414; border: 3px solid #363636; border-radius: 10px;
  padding: 18px 10px; margin-bottom: 18px; }
.enter input:focus { outline: none; border-color: #27855a; }
.enter button { width: 100%; font-family: inherit; font-size: 26px; font-weight: 700;
  color: #ffffff; background: #27855a; border: none; border-radius: 10px;
  padding: 20px; cursor: pointer; }
.enter button:focus { outline: 4px solid #32a870; }
.enter .msg { margin-top: 16px; color: #cc4444; font-size: 20px; min-height: 24px; }
.enter .tip { margin-top: 26px; color: #666058; font-size: 18px; line-height: 1.6; }
</style>
</head>
<body>

<div id="enter" class="enter" style="display:none">
  <h2>Tournament board</h2>
  <p>Enter the four-character code</p>
  <input id="codebox" type="text" maxlength="4" autocomplete="off" placeholder="ABCD">
  <button id="go">Show the board</button>
  <div class="msg" id="msg"></div>
  <div class="tip">
    Easier still: point the TV straight at the address with the code on the end, for example<br>
    kemmererpool.com/tv.html?t=ABCD
  </div>
</div>

<div id="board" style="display:none">
  <div class="head">
    <h1 id="title">Tournament</h1>
    <div class="meta">
      <div><span class="dot"></span><span id="live">Live</span></div>
      <div class="code" id="code"></div>
    </div>
  </div>
  <div id="body"></div>
</div>

<script>
/* Everything below is deliberately plain: no arrow-free rules broken, but no
   optional chaining, no async/await, no newer built-ins. */

var CODE = null;
var REFRESH = 20000;

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getParam(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

/* ── Chips ── */
function chipDots(p) {
  var start = p.start || 0, left = p.chips || 0;
  var spent = start - left, out = '', i;
  for (i = 0; i < start; i++) {
    out += '<span class="chip' + (i < spent ? ' spent' : '') + '"></span>';
  }
  return '<span class="chips">' + out + '</span>';
}

/* ── Bracket rebuild ──
   Only enough of it to know who plays whom next; the scoring pages own the
   real engine. Slots name a seed, or the winner or loser of an earlier match. */
function seedOrder(size) {
  var order = [1], next, i, round;
  while (order.length < size) {
    round = order.length * 2 + 1;
    next = [];
    for (i = 0; i < order.length; i++) { next.push(order[i]); next.push(round - order[i]); }
    order = next;
  }
  return order;
}

function buildBracket(bySeed, format) {
  var size = 0, k;
  for (k in bySeed) { if (bySeed.hasOwnProperty(k)) size++; }
  var rounds = Math.round(Math.log(size) / Math.log(2));
  var matches = [], order = seedOrder(size), prev = [], cur, r, i, count;

  for (r = 1; r <= rounds; r++) {
    count = size / Math.pow(2, r);
    cur = [];
    for (i = 0; i < count; i++) {
      cur.push({ id: 'W' + r + '-' + i, bracket: 'W', round: r, winner: null,
        slots: r === 1
          ? [{ type: 'seed', seed: order[i * 2] }, { type: 'seed', seed: order[i * 2 + 1] }]
          : [{ type: 'winner', of: prev[i * 2].id }, { type: 'winner', of: prev[i * 2 + 1].id }] });
      matches.push(cur[cur.length - 1]);
    }
    prev = cur;
  }
  var wbFinal = prev[0];
  if (format === 'single') { number(matches, rounds, true); return matches; }

  function wbRound(n) {
    var out = [], j;
    for (j = 0; j < matches.length; j++) {
      if (matches[j].bracket === 'W' && matches[j].round === n) out.push(matches[j]);
    }
    return out;
  }
  var lbPrev = [], last = rounds > 1 ? (rounds - 1) * 2 : 0, drops, dd, m;
  for (r = 1; r <= last; r++) {
    cur = [];
    if (r === 1) {
      drops = wbRound(1);
      for (i = 0; i < drops.length / 2; i++) {
        m = { id: 'L1-' + i, bracket: 'L', round: 1, winner: null,
          slots: [{ type: 'loser', of: drops[i * 2].id }, { type: 'loser', of: drops[i * 2 + 1].id }] };
        cur.push(m); matches.push(m);
      }
    } else if (r % 2 === 0) {
      drops = wbRound(r / 2 + 1);
      dd = ((r / 2) % 2 === 1) ? drops.slice().reverse() : drops;
      for (i = 0; i < lbPrev.length; i++) {
        m = { id: 'L' + r + '-' + i, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'loser', of: dd[i].id }, { type: 'winner', of: lbPrev[i].id }] };
        cur.push(m); matches.push(m);
      }
    } else {
      for (i = 0; i < lbPrev.length / 2; i++) {
        m = { id: 'L' + r + '-' + i, bracket: 'L', round: r, winner: null,
          slots: [{ type: 'winner', of: lbPrev[i * 2].id }, { type: 'winner', of: lbPrev[i * 2 + 1].id }] };
        cur.push(m); matches.push(m);
      }
    }
    lbPrev = cur;
  }
  var lbFinal = lbPrev.length ? lbPrev[0] : null;
  matches.push({ id: 'GF', bracket: 'GF', round: 1, winner: null,
    slots: [{ type: 'winner', of: wbFinal.id },
            lbFinal ? { type: 'winner', of: lbFinal.id } : { type: 'loser', of: wbFinal.id }] });
  matches.push({ id: 'GF2', bracket: 'GF', round: 2, winner: null,
    slots: [{ type: 'winner', of: 'GF' }, { type: 'loser', of: 'GF' }] });
  number(matches, rounds, false);
  return matches;
}

function number(matches, rounds, single) {
  var seq = [], r, i, no = 1;
  function pick(br, rd) {
    var out = [], j;
    for (j = 0; j < matches.length; j++) {
      if (matches[j].bracket === br && matches[j].round === rd) out.push(matches[j]);
    }
    return out;
  }
  for (r = 1; r <= rounds; r++) {
    seq = seq.concat(pick('W', r));
    if (single) continue;
    if (r === 1) seq = seq.concat(pick('L', 1));
    else { seq = seq.concat(pick('L', (r - 1) * 2)); seq = seq.concat(pick('L', (r - 1) * 2 + 1)); }
  }
  seq = seq.concat(pick('GF', 1)).concat(pick('GF', 2));
  for (i = 0; i < seq.length; i++) { if (!seq[i].no) seq[i].no = no++; }
}

function resolve(matches, bySeed, winners) {
  var byId = {}, i, j, m, s, a, b;
  for (i = 0; i < matches.length; i++) byId[matches[i].id] = matches[i];
  for (i = 0; i < matches.length; i++) {
    m = matches[i];
    m.winner = (winners && winners[m.id] !== undefined) ? winners[m.id] : null;
    m.players = []; m.live = true; m.resolved = false; m.autoWon = false;
    if (m.id === 'GF2') {
      var gf = byId['GF'];
      if (!gf || !gf.resolved || gf.winner !== 1) { m.live = false; continue; }
    }
    for (j = 0; j < m.slots.length; j++) {
      s = m.slots[j];
      if (s.type === 'seed') {
        m.players.push(bySeed[s.seed] === undefined ? null : bySeed[s.seed]);
      } else {
        var src = byId[s.of];
        if (!src || !src.resolved) m.players.push(undefined);
        else m.players.push(s.type === 'winner' ? src.winnerName : src.loserName);
      }
    }
    a = m.players[0]; b = m.players[1];
    if (a === undefined || b === undefined) continue;
    if (a === null && b === null) { m.winnerName = null; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (b === null) { m.winnerName = a; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (a === null) { m.winnerName = b; m.loserName = null; m.resolved = true; m.autoWon = true; }
    else if (m.winner === 0 || m.winner === 1) {
      m.winnerName = m.players[m.winner];
      m.loserName = m.players[1 - m.winner];
      m.resolved = true;
    }
  }
  return matches;
}

/* ── Fargo hot race charts, for showing each match's race ── */
var CHARTS = {
  R2: [[0,67,2,2],[68,112,3,2],[113,null,4,2]],
  R3: [[0,67,3,3],[68,112,3,2],[113,147,4,2],[148,null,5,2]],
  R4: [[0,45,4,4],[46,80,4,3],[81,146,5,3],[147,175,5,2],[176,null,6,2]],
  R5: [[0,34,5,5],[35,62,5,4],[63,108,6,4],[109,131,6,3],[132,151,7,3],[152,null,8,3]],
  R6: [[0,27,6,6],[28,51,6,5],[52,85,7,5],[86,106,7,4],[107,151,8,4],[152,169,8,3],[170,null,9,3]],
  R7: [[0,23,7,7],[24,43,7,6],[44,71,8,6],[72,89,8,5],[90,123,9,5],[124,139,9,4],[140,185,10,4],[186,null,10,3]]
};

/* Each player's race for this match. A manual-race bracket carries them per
   player; a Fargo tournament works them out from the two ratings, so both
   players have to be known before either race means anything. */
function bandRaceOf(rating, rows) {
  if (!rows || !rows.length) return null;
  if (!rating) return rows[rows.length - 1].race;      // unrated gets the longest
  for (var i = 0; i < rows.length; i++) {
    var b = rows[i];
    if (b.max === null || b.max === undefined || rating <= b.max) return b.race;
  }
  return rows[rows.length - 1].race;
}

function racesFor(d, m) {
  var a = m.players[0], b = m.players[1];
  if (d.kind === 'bracket') {
    var races = d.races || {};
    return [ (a === undefined || a === null) ? null : (races[a] || 3),
             (b === undefined || b === null) ? null : (races[b] || 3) ];
  }
  if (d.kind !== 'tournament') return [null, null];
  if (a === undefined || b === undefined || a === null || b === null) return [null, null];
  var roster = d.roster || [], i, ratA = 0, ratB = 0;
  for (i = 0; i < roster.length; i++) {
    if (roster[i].name === a) ratA = roster[i].rating;
    if (roster[i].name === b) ratB = roster[i].rating;
  }

  // Custom bands give each player a race from their own rating, whoever they
  // draw. A hot chart works off the gap between the two instead.
  if (d.raceMode === 'bands') {
    return [bandRaceOf(ratA, d.raceBands), bandRaceOf(ratB, d.raceBands)];
  }

  if (!ratA || !ratB) return [null, null];
  var chart = CHARTS[d.chart] || CHARTS.R3;
  var diff = Math.abs(ratA - ratB), row = chart[chart.length - 1], j;
  for (j = 0; j < chart.length; j++) {
    if (chart[j][1] === null || diff <= chart[j][1]) { row = chart[j]; break; }
  }
  var fav = row[2], dog = row[3];
  return ratA >= ratB ? [fav, dog] : [dog, fav];
}

/* ── Drawing ── */

/* ── Display names ──
   Bracket boxes have room for "Kirt C", not "Kirt Connelly". Shortened here at
   draw time, so tournaments created before this read the same way. Two people
   who shorten alike keep letters of the surname until they differ. */
var NAME_SUFFIXES = ['jr', 'jr.', 'sr', 'sr.', 'ii', 'iii', 'iv'];
var DISPLAY = {};

function uniqueShort(first, last, taken) {
  var j, k, cand, hit;
  for (j = 1; j <= last.length; j++) {
    cand = first + ' ' + last.slice(0, j);
    hit = false;
    for (k = 0; k < taken.length; k++) {
      if (String(taken[k]).toLowerCase() === cand.toLowerCase()) { hit = true; break; }
    }
    if (!hit) return cand;
  }
  return first + ' ' + last;
}

function shortenName(full, taken) {
  var raw = String(full || '').replace(/^\s+|\s+$/g, '');
  // FargoRate carries nicknames in brackets — "Taydon (TK) Reilly". Everyone at
  // the bar calls him TK, so that is the name that goes on the board.
  var nickMatch = raw.match(/\(([^)]+)\)/);
  var nick = nickMatch ? nickMatch[1].replace(/^\s+|\s+$/g, '') : '';
  var parts = raw.replace(/\([^)]*\)/g, ' ').replace(/^\s+|\s+$/g, '').split(/\s+/);
  var clean = [], i;
  for (i = 0; i < parts.length; i++) if (parts[i]) clean.push(parts[i]);
  while (clean.length > 2 &&
         NAME_SUFFIXES.indexOf(clean[clean.length - 1].toLowerCase()) >= 0) clean.pop();
  if (nick) {
    if (!clean.length) return nick;
    return uniqueShort(nick, clean[clean.length - 1], taken);
  }
  if (clean.length < 2) return clean[0] || '';
  return uniqueShort(clean[0], clean[clean.length - 1], taken);
}

function buildDisplayNames(names) {
  var map = {}, taken = [], i, s;
  for (i = 0; i < names.length; i++) {
    if (!names[i] || map[names[i]]) continue;
    s = shortenName(names[i], taken);
    taken.push(s);
    map[names[i]] = s;
  }
  return map;
}

function disp(n) { return DISPLAY[n] || n; }

/* ── Chip session board ──
   Out on top, then the queue reading down, then whoever is on a table — the same
   order as the scoring page, so the two read alike. */
function drawChip(d) {
  var roster = d.roster || [], tables = d.tables || [], queue = d.queue || [];
  var i, j, k, p, html, alive = 0, chipsLeft = 0;

  for (i = 0; i < roster.length; i++) {
    if (roster[i].chips > 0) { alive++; chipsLeft += roster[i].chips; }
  }

  var out = [], queued = [], seated = [];
  for (i = 0; i < roster.length; i++) { if (roster[i].chips <= 0) out.push(roster[i]); }
  out.sort(function (a, b) { return (a.outAt || 0) - (b.outAt || 0); });
  for (i = queue.length - 1; i >= 0; i--) {
    for (j = 0; j < roster.length; j++) { if (roster[j].name === queue[i]) queued.push(roster[j]); }
  }
  for (i = 0; i < tables.length; i++) {
    for (j = 0; j < 2; j++) {
      if (!tables[i][j]) continue;
      for (k = 0; k < roster.length; k++) {
        if (roster[k].name === tables[i][j]) seated.push({ p: roster[k], table: i + 1 });
      }
    }
  }

  html = '<div class="cols"><div class="col">';
  html += '<div class="panel"><h2>Players<span class="n">' + alive + ' of ' + roster.length
        + ' in &middot; ' + chipsLeft + ' chips left</span></h2>';
  for (i = 0; i < out.length; i++) {
    html += '<div class="row out"><span class="nm">' + esc(disp(out[i].name))
          + '</span><span class="rt">out</span></div>';
  }
  for (i = 0; i < queued.length; i++) {
    p = queued[i];
    html += '<div class="row"><span class="nm">' + esc(disp(p.name)) + '</span>' + chipDots(p) + '</div>';
  }
  var lastTable = null;
  for (i = 0; i < seated.length; i++) {
    p = seated[i].p;
    var isNew = seated[i].table !== lastTable;
    lastTable = seated[i].table;
    html += '<div class="row seat' + (isNew ? ' tstart' : '') + '">'
          + '<span class="nm">' + esc(disp(p.name)) + '</span>' + chipDots(p) + '</div>';
  }
  html += '</div></div><div class="col right">';

  html += '<div class="panel"><h2>Tables</h2>';
  for (i = 0; i < tables.length; i++) {
    if (!tables[i][0] && !tables[i][1]) continue;
    var tl = (d.tableList && d.tableList[i]) ? d.tableList[i].label : String(i + 1);
    html += '<div class="match"><span class="no">' + esc(tl) + '</span><span class="who">'
          + esc(tables[i][0] ? disp(tables[i][0]) : 'Open') + '<span class="vs">v</span>'
          + esc(tables[i][1] ? disp(tables[i][1]) : 'Open') + '</span></div>';
  }
  html += '</div>';

  var log = d.log || [];
  if (log.length) {
    html += '<div class="panel"><h2>Just played</h2>';
    for (i = 0; i < Math.min(6, log.length); i++) {
      if (log[i].manual) html += '<div class="log">' + esc(log[i].text) + '</div>';
      else {
        var lt = (d.tableList && d.tableList[log[i].table - 1])
          ? d.tableList[log[i].table - 1].label : log[i].table;
        html += '<div class="log"><b>' + esc(disp(log[i].winner)) + '</b> beat '
              + esc(disp(log[i].loser)) + ' on table ' + esc(lt) + '</div>';
      }
    }
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

/* Bracket geometry. Every match sits at the vertical midpoint of whatever feeds
   it — one rule, applied outward from round one. Absolute positioning, so no
   flexbox or grid is involved and old browsers lay it out identically. */
var COL_W = 208, COL_GAP = 54, SLOT_H = 33, MATCH_H = 68, HEAD_H = 30;

function colX(col) { return col * (COL_W + COL_GAP); }

function computeLayout(list, lane) {
  var rounds = [], pos = {}, i, j, r, cur, prevIds, m, feeds, y, seen = {};
  for (i = 0; i < list.length; i++) {
    if (!seen[list[i].round]) { seen[list[i].round] = 1; rounds.push(list[i].round); }
  }
  rounds.sort(function (a, b) { return a - b; });

  for (r = 0; r < rounds.length; r++) {
    cur = [];
    for (i = 0; i < list.length; i++) { if (list[i].round === rounds[r]) cur.push(list[i]); }
    prevIds = [];
    if (r > 0) {
      for (i = 0; i < list.length; i++) {
        if (list[i].round === rounds[r - 1]) prevIds.push(list[i].id);
      }
    }
    for (i = 0; i < cur.length; i++) {
      m = cur[i];
      if (r === 0) { y = HEAD_H + (i + 0.5) * lane; }
      else {
        feeds = [];
        for (j = 0; j < m.slots.length; j++) {
          var of = m.slots[j].of;
          if (of && prevIds.join(',').indexOf(of) > -1 && pos[of]) {
            var already = false, k;
            for (k = 0; k < feeds.length; k++) { if (feeds[k].id === of) already = true; }
            if (!already) feeds.push({ id: of, y: pos[of].y, slot: j });
          }
        }
        if (feeds.length === 1) {
          // Only one player arrives along the bracket; the other drops in from
          // the winners side. Sit the box so that feed runs level into its row.
          y = feeds[0].y - ((feeds[0].slot + 0.5) * SLOT_H - MATCH_H / 2 + 1);
        } else if (feeds.length > 1) {
          y = 0;
          for (j = 0; j < feeds.length; j++) y += feeds[j].y;
          y = y / feeds.length;
        } else { y = HEAD_H + (i + 0.5) * lane; }
      }
      pos[m.id] = { col: r, y: y, round: rounds[r] };
    }
  }
  return { pos: pos, rounds: rounds };
}

function connectors(list, pos) {
  var out = [], i, j, k, m, feeds, fRight, midX, myLeft, rowY, sy, seen;
  function line(x, y, w, h) {
    out.push('<div class="ln" style="left:' + Math.round(x) + 'px;top:' + Math.round(y)
      + 'px;width:' + Math.max(w, 1) + 'px;height:' + Math.max(h, 1) + 'px"></div>');
  }
  for (i = 0; i < list.length; i++) {
    m = list[i];
    myLeft = colX(pos[m.id].col);
    for (j = 0; j < m.slots.length; j++) {
      var of = m.slots[j].of;
      if (!of || !pos[of] || pos[of].col !== pos[m.id].col - 1) continue;
      sy = pos[m.id].y - MATCH_H / 2 + 1 + (j + 0.5) * SLOT_H;
      fRight = colX(pos[of].col) + COL_W;
      midX = fRight + COL_GAP / 2;
      line(fRight, pos[of].y, midX - fRight, 1);
      if (Math.abs(pos[of].y - sy) > 0.5) {
        line(midX, Math.min(pos[of].y, sy), 1, Math.abs(pos[of].y - sy));
      }
      line(midX, sy, myLeft - midX, 1);
    }
  }
  return out.join('');
}

function slotHTML(m, i, d) {
  var v = m.players[i], cls = 'sl', label, race = '';
  if (v === undefined) {
    var s = m.slots[i], src = null, j;
    if (s.of) { for (j = 0; j < d.__all.length; j++) { if (d.__all[j].id === s.of) src = d.__all[j]; } }
    label = '<span class="src">' + (src ? (s.type === 'loser' ? 'L' : 'W') + src.no : '&mdash;') + '</span>';
    cls += ' empty';
  } else if (v === null) { label = '<span class="src">Bye</span>'; cls += ' empty'; }
  else {
    label = esc(disp(v));
    if (m.resolved) cls += (m.winnerName === v) ? ' won' : ' lost';
    var rr = racesFor(d, m);
    if (rr[i]) race = '<span class="rc">' + rr[i] + '</span>';
  }
  return '<div class="' + cls + '">' + race + '<span class="n">' + label + '</span></div>';
}

function canvas(list, labelFor, lane, d) {
  if (!list.length) return { html: '', w: 0, h: 0 };
  var L = computeLayout(list, lane), pos = L.pos, rounds = L.rounds;
  var maxY = 0, i, r, m, p, k;
  for (k in pos) { if (pos.hasOwnProperty(k) && pos[k].y > maxY) maxY = pos[k].y; }
  var h = maxY + MATCH_H / 2 + 14, w = colX(rounds.length - 1) + COL_W;

  var html = '<div class="cv" style="width:' + w + 'px;height:' + h + 'px">';
  for (r = 0; r < rounds.length; r++) {
    var count = 0;
    for (i = 0; i < list.length; i++) { if (list[i].round === rounds[r]) count++; }
    html += '<div class="rl" style="left:' + colX(r) + 'px;width:' + COL_W + 'px">'
          + labelFor(rounds[r], count) + '</div>';
  }
  html += connectors(list, pos);
  for (i = 0; i < list.length; i++) {
    m = list[i]; p = pos[m.id];
    var ready = !m.resolved && !(d.held && d.held[m.id])
             && m.players[0] !== undefined && m.players[1] !== undefined
             && m.players[0] !== null && m.players[1] !== null;
    html += '<div class="mt' + (ready ? ' ready' : '') + (m.resolved ? ' done' : '')
          + '" style="left:' + colX(p.col) + 'px;top:' + Math.round(p.y - MATCH_H / 2)
          + 'px;width:' + COL_W + 'px;height:' + MATCH_H + 'px">'
          + '<span class="no">' + m.no + '</span>'
          + ((d.held && d.held[m.id])
              ? '<span class="tbl held">On hold</span>'
              : (d.assigned && d.assigned[m.id])
                ? '<span class="tbl">Table ' + esc(d.assigned[m.id]) + '</span>' : '')
          + slotHTML(m, 0, d) + slotHTML(m, 1, d) + '</div>';
  }
  html += '</div>';
  return { html: html, w: w, h: h };
}

function drawBracket(d) {
  var matches = buildBracket(d.bySeed || {}, d.format);
  resolve(matches, d.bySeed || {}, d.winners || {});
  d.__all = matches;

  var wb = [], lb = [], gf = [], i, m;
  for (i = 0; i < matches.length; i++) {
    m = matches[i];
    if (m.bracket === 'W') wb.push(m);
    else if (m.bracket === 'L') lb.push(m);
    else if (m.live) gf.push(m);
  }
  var wbRounds = 0;
  for (i = 0; i < wb.length; i++) { if (wb[i].round > wbRounds) wbRounds = wb[i].round; }

  // The finals continue the winners row, so they share that canvas.
  var wbAll = wb.slice(), shifted;
  for (i = 0; i < gf.length; i++) {
    shifted = {};
    for (var k in gf[i]) { if (gf[i].hasOwnProperty(k)) shifted[k] = gf[i][k]; }
    shifted.round = wbRounds + gf[i].round;
    wbAll.push(shifted);
  }

  var single = d.format === 'single';
  function wbLabel(r) {
    if (r > wbRounds) return r === wbRounds + 2 ? 'Final #2' : 'Final';
    if (r === wbRounds) return single ? 'Final' : 'Winners Final';
    if (r === wbRounds - 1) return single ? 'Semifinals' : 'Winners Semis';
    return single ? 'Round ' + r : 'Winners R' + r;
  }
  var lbLast = (wbRounds - 1) * 2;
  function lbLabel(r) {
    if (r === lbLast) return 'Losers Final';
    if (r === lbLast - 1) return 'Losers Semis';
    return 'Losers R' + r;
  }

  var LANE = 88;
  var lbFirst = 0;
  for (i = 0; i < lb.length; i++) { if (lb[i].round === 1) lbFirst++; }
  var size = 0;
  for (var s in (d.bySeed || {})) { if (d.bySeed.hasOwnProperty(s)) size++; }
  var lbLane = lbFirst ? ((size / 2) * LANE) / lbFirst : LANE;

  var A = canvas(wbAll, wbLabel, LANE, d);
  var B = lb.length ? canvas(lb, lbLabel, lbLane, d) : { html: '', w: 0, h: 0 };

  return { top: A, bottom: B };
}

function championOf(d) {
  if (d.champion) return d.champion;
  return null;
}

/* A wall display can't scroll, so whatever is drawn gets scaled to fit the
   screen. Below about 60% the names stop being readable across a room, so at
   that point the two halves take turns instead of being squeezed together. */
var SHOWING = 'both', FLIP = 0, LAST = null;

function fit(w, h) {
  var availW = document.documentElement.clientWidth - 60;
  var availH = document.documentElement.clientHeight - 150;
  if (!w || !h) return 1;
  return Math.min(1, availW / w, availH / h);
}

function draw(d) {
  LAST = d;
  var pool = [], k;
  if (d.kind === 'chip') {
    for (k = 0; k < (d.roster || []).length; k++) pool.push(d.roster[k].name);
  } else {
    for (k in (d.bySeed || {})) { if (d.bySeed.hasOwnProperty(k)) pool.push(d.bySeed[k]); }
  }
  DISPLAY = buildDisplayNames(pool);
  $('board').style.display = '';
  $('enter').style.display = 'none';
  $('title').innerHTML = esc(d.name || 'Tournament');
  $('code').innerHTML = esc(CODE);

  var champ = championOf(d), html = '';
  if (champ) {
    html += '<div class="champ"><span class="lbl">Champion</span><span class="nm">'
          + esc(disp(champ)) + '</span></div>';
  }

  if (d.kind === 'chip') { $('body').innerHTML = html + drawChip(d); return; }

  var parts = drawBracket(d);
  var A = parts.top, B = parts.bottom;
  var bothH = A.h + B.h + (B.h ? 46 : 0);
  var bothW = Math.max(A.w, B.w);
  var scaleBoth = fit(bothW, bothH + (champ ? 62 : 0));

  if (!B.h || scaleBoth >= 0.6) {
    SHOWING = 'both';
    html += wrap(A, scaleBoth, d.format === 'single' ? 'Bracket' : 'Winners');
    if (B.h) html += wrap(B, scaleBoth, 'Losers');
  } else {
    // Too tight to show both — alternate, each scaled on its own.
    SHOWING = (FLIP % 2 === 0) ? 'winners' : 'losers';
    var P = SHOWING === 'winners' ? A : B;
    html += wrap(P, fit(P.w, P.h + (champ ? 62 : 0)),
                 SHOWING === 'winners' ? 'Winners bracket' : 'Losers bracket');
  }
  $('body').innerHTML = html;
}

function wrap(part, scale, label) {
  if (!part.h) return '';
  return '<div class="sec"><div class="sh">' + label + '</div>'
    + '<div class="fit" style="height:' + Math.ceil(part.h * scale) + 'px">'
    + '<div class="sc" style="-webkit-transform:scale(' + scale + ');transform:scale(' + scale + ')">'
    + part.html + '</div></div></div>';
}

/* ── Loading, with plain .then rather than async/await ── */
var lastSaved = -1;

function load(first) {
  fetch('/api/t/' + encodeURIComponent(CODE))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) {
        if (first) fail('No tournament with code ' + CODE);
        return;
      }
      var d = j.data;
      if (d.kind === 'signup') { fail('That code is a signup sheet, not a tournament.'); return; }
      if (d.saved !== lastSaved) { lastSaved = d.saved; draw(d); }
      else { LAST = d; }
      $('live').innerHTML = 'Live';
    })
    ['catch'](function () {
      $('live').innerHTML = 'Offline';
      if (first) fail('Could not reach the server.');
    });
}

function fail(text) {
  $('enter').style.display = '';
  $('board').style.display = 'none';
  $('msg').innerHTML = esc(text);
}

function start() {
  var c = getParam('t').toUpperCase();
  if (c) {
    CODE = c;
    load(true);
    window.setInterval(function () { load(false); }, REFRESH);
    // When the two halves are taking turns, swap every fifteen seconds.
    window.setInterval(function () {
      if (SHOWING !== 'both' && LAST) { FLIP++; draw(LAST); }
    }, 15000);
    window.onresize = function () { if (LAST) draw(LAST); };
    return;
  }
  $('enter').style.display = '';
  $('codebox').focus();
}

$('go').onclick = function () {
  var v = $('codebox').value.replace(/\s/g, '').toUpperCase();
  if (v.length !== 4) { $('msg').innerHTML = 'Codes are four characters.'; return; }
  // Assigning to location.search does not navigate on some TV browsers, so
  // build the whole address and use assign().
  window.location.assign(window.location.pathname + '?t=' + v);
};

$('codebox').onkeyup = function (e) {
  this.value = this.value.toUpperCase();
  if (e.keyCode === 13) $('go').onclick();
};

start();
</script>
</body>
