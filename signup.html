<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Signup — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414; --bg2: #1e1e1e; --bg3: #262626; --bg4: #2e2e2e;
    --border: #363636; --border2: #464646;
    --text: #ffffff; --text2: #b0a898; --text3: #666058;
    --accent: #27855a; --cream: #e8ddd0; --green2: #32a870; --loss: #cc4444;
    --on-accent: #ffffff;
    --radius: 8px; --radius-sm: 5px;
  }
  html[data-theme="light"] {
    --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae6df; --bg4: #ddd8ce;
    --border: #d6d0c5; --border2: #bcb4a6;
    --text: #1a1714; --text2: #5a5348; --text3: #8b8376;
    --accent: #1f6b48; --cream: #2b2419; --green2: #1a7a4e; --loss: #b23636;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); }
  .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0,#154d28 4px,#1a5c32 8px); opacity: .5; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 12px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
  .theme-btn { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-size: 13px; padding: 0; }
  .theme-btn:hover { background: var(--bg4); color: var(--text); }

  main { padding: 22px 0 70px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-meta { font-size: 12px; color: var(--text3); }
  .pad { padding: 18px; }
  .setup-head { cursor: pointer; user-select: none; }
  .setup-head:hover .card-title { color: var(--green2); }
  .head-right { display: flex; align-items: center; gap: 11px; }
  .chev { font-size: 20px; line-height: 1; color: var(--text2); display: inline-block; transition: transform .18s; }
  /* Collapsed after the draw — the setup is done, the bracket is the point. */
  .setup-card.collapsed .pad { display: none; }
  .setup-card.collapsed .chev { transform: rotate(-90deg); }

  label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font-family: inherit; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .fee-row { margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .fee-input { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
  .fee-input:focus-within { border-color: var(--accent); }
  .fee-input span { color: var(--text3); font-size: 14px; }
  .fee-input input { width: 76px; border: none; background: none; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 9px 0; }
  .fee-input input:focus { outline: none; }
  .fee-input select { border: none; background: none; color: var(--text); font-family: inherit;
    font-size: 14px; padding: 9px 0; cursor: pointer; }
  .fee-input select:focus { outline: none; }
/* ── Player lookup ── */
  .lookup { display: flex; gap: 10px; flex-wrap: wrap; }
  .lookup input { flex: 1; min-width: 200px; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
  .lookup input:focus { outline: none; border-color: var(--accent); }
  .results { display: flex; flex-direction: column; gap: 1px; margin-top: 10px; background: var(--border);
    border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .results:empty { display: none; }
  .result { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; background: var(--bg); cursor: pointer; font-size: 14px; }
  .result:hover, .result.sel { background: var(--bg3); }
  .result .rn { color: var(--cream); font-weight: 600; }
  .result .rd { font-size: 11px; color: var(--text3); }
  .result .rr { font-weight: 700; font-variant-numeric: tabular-nums; }
  .roster { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .roster:empty { display: none; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; }
  .rrow .n { flex: 1; color: var(--cream); font-weight: 600; }
  .rrow .f { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rrow .d { font-size: 11px; color: var(--text3); }
  .rrow .x { background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px; }
  .rrow .x:hover { color: var(--loss); }
  .rrow.manual .f { color: var(--text2); }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green2); margin-right: 7px; vertical-align: middle;
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .notice-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px; color: var(--text2); font-size: 14px; }
  .th-live { color: var(--green2); font-weight: 600; }
  .ro-banner { padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--accent);
    border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2);
    font-size: 13px; font-weight: 500; }
  body.read-only .slot { cursor: default; }
  body.read-only .slot:hover:not(.locked) { background: none; }
  body.read-only .payout .place, body.read-only .payout .amt { cursor: default; }
  body.read-only .payout .place:hover, body.read-only .payout .amt:hover { background: none; }

  /* ── Tournament header ── */
  .tourney-head { display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .th-name { font-size: 20px; font-weight: 700; color: var(--cream); line-height: 1.2; }
  .th-meta { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .th-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
  .th-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── Saving ── */
  .name-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .tname { width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; }
  .tname:focus { outline: none; border-color: var(--accent); }
  .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    color: var(--text2); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 12px; letter-spacing: .04em; }
  .saved-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .saved-row { display: flex; align-items: center; gap: 12px; padding: 11px 18px;
    background: var(--bg2); font-size: 14px; flex-wrap: wrap; }
  .saved-row .sn { flex: 1; min-width: 140px; color: var(--cream); font-weight: 600; }
  .saved-row .sm { font-size: 11px; color: var(--text3); }
  .saved-row .sid { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text3); }
  .saved-row.current { border-left: 3px solid var(--accent); }
  .saved-empty { padding: 20px 18px; color: var(--text3); font-size: 13px; background: var(--bg2); }

  /* ── Buttons and rows ── */
  /* .act rather than button.act: the list uses anchors styled as buttons. */
  .act { display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: .02em;
    padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
  .act:hover { background: var(--bg4); color: var(--text); }
  .act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .act.primary:hover { background: var(--accent); opacity: .88; color: var(--on-accent); }
  .act:disabled { opacity: .45; cursor: default; }
  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 16px 18px; border-top: 1px solid var(--border); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 13px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--text); }
  .hint { font-size: 13px; color: var(--text3); }

  .page { max-width: 560px; margin: 0 auto; }
  .desc { color: var(--text2); font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .fl2 { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  .inp { width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; }
  .inp:focus { outline: none; border-color: var(--accent); }
  select.inp { cursor: pointer; }
  .field { margin-bottom: 16px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .picked { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--bg);
    padding: 12px 14px; }
  .picked .pn { color: var(--cream); font-weight: 600; font-size: 15px; }
  .picked .pd { font-size: 12px; color: var(--text3); }
  .picked .pr { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--green2); }
  .done { text-align: center; padding: 34px 22px; }
  .done .tick { font-size: 34px; color: var(--green2); }
  .done h2 { font-size: 20px; margin: 10px 0 6px; color: var(--cream); }
  .done p { color: var(--text2); font-size: 14px; }
  .count { font-size: 13px; color: var(--text3); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 13px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--text); }
  .hint { font-size: 13px; color: var(--text3); }
  .code-entry { max-width: 380px; margin: 7vh auto 40px; }
  .code-input { display: block; width: 100%; min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 30px; font-weight: 700; letter-spacing: .34em; text-indent: .34em;
    text-align: center; text-transform: uppercase; color: var(--cream);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 10px; }
  .code-input:focus { outline: none; border-color: var(--accent); }
  .code-go { display: block; width: 100%; margin-top: 12px; padding: 13px; font-size: 15px; }
  footer { border-top: 1px solid var(--border); padding: 18px 0; text-align: center;
    font-size: 11px; color: var(--text3); letter-spacing: .05em; }
</style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div>
        <h1>Tournament Signup</h1>
        <div class="sub">Kemmerer Pool League</div>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark">&#127769;</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">
  <div class="card code-entry" id="code-entry">
    <div class="card-header"><span class="card-title">Open a signup sheet</span></div>
    <div class="pad">
      <label class="fl2" for="code-in">Signup code</label>
      <input id="code-in" class="code-input" type="text" maxlength="4" size="4" spellcheck="false"
        autocomplete="off" autocapitalize="characters" placeholder="ABCD"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')goToCode()">
      <button class="act primary code-go" onclick="goToCode()">Open</button>
      <div class="hint" id="code-msg" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="page" id="page"></div>
</div>
</main>

<footer>
  <div class="wrap">Kemmerer Pool League &nbsp;&middot;&nbsp; Signup &nbsp;&middot;&nbsp; v1.01</div>
</footer>

<script>
/* ── Theme ── */
function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('kpl-theme', t); } catch(e) {}
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = t === 'light' ? '☀' : '🌙';
}
function toggleTheme() { applyTheme(isLight() ? 'dark' : 'light'); }
(function () {
  let saved = null;
  try { saved = localStorage.getItem('kpl-theme'); } catch(e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => applyTheme(saved));
})();

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const PROXY = '/proxy?url=';
const LMS   = 'https://lms.fargorate.com/PublicReport';

/* Jenkins divisions the lookup searches. IDs change each season — refresh from
   the division dropdown on the LMS league page when a new one starts. */
const LEAGUE_ID = '6e402f34-de51-4e68-9e30-aeeb014fb597';   // Jenkins Music & Vending

/* Fallback only. The live list is read from the LMS division dropdown at load
   time, because these IDs change every season — this is what to fall back on if
   that fetch fails. Current as of August 2026. */
const DIVISIONS = [
  ['e9b068bc-155c-4b51-aea7-b37d01026668', 'Afton 8 Ball 25/26'],
  ['5607ca18-56b5-45a1-a8a0-b203003df484', 'Bridger Valley A 2024-25'],
  ['f4399f90-0c64-49f1-8b0a-b46a014a6186', "Bridger Valley Summer 10-Ball/Scotch '26"],
  ['19e3dc05-7d67-4c77-8f36-b3b600f992cf', 'Dubois 25/26'],
  ['18e0f3a3-3c8a-4d3c-a769-b42f00b35c96', "Evanston Spring 10-Ball '26"],
  ['1dc8b2aa-62eb-41a6-a8f6-b379014efe83', 'Kemmerer 8 Ball 25-26'],
  ['c97cf1bf-ff08-44a0-b916-b4520124b3e6', 'Kemmerer Summer 10 Ball 2026'],
  ['f73e5d93-9d85-4f25-ad40-b48501232c67', 'Lander Summer 10 Ball 2026'],
  ['915b2c1d-72c3-4365-9130-b30e01504c6c', 'Lander Summer 9 Ball'],
  ['77b7699b-2970-4094-8012-b370010637cd', 'Lander Valley 8 Ball 25/26'],
  ['5f253980-93db-4984-8cc9-b46401249525', 'Riverton Summer 9-Ball/Scotch 2026'],
  ['b2f40913-6cee-4653-a691-b36e010710e1', 'Sublette County 8 Ball 25/26'],
  ['b84871df-aaef-42d5-adce-b46a0118883c', 'Sublette County 9/10 Scotch 26'],
  ['e32cc8d3-222d-4c0e-b065-b38c016a32ab', 'Sublette County Top Gun 25/26'],
  ['ac0a71bc-e011-4c98-a3e7-b463010d8b26', 'SWC 10-Ball Capped Summer 2026'],
  ['da5a4c20-a467-4204-8e16-b463015de862', 'SWC 10-Ball No Cap Summer 2026'],
];

/* Every division page carries the full dropdown, so fetching any one of them
   gives the current list — new seasons included, without editing this file. */
async function fetchDivisions() {
  for (const seed of DIVISIONS.map(d => d[0])) {
    try {
      const r = await fetch(PROXY + encodeURIComponent(`${LMS}/LeagueReports/${seed}`));
      if (!r.ok) continue;
      const html = await r.text();
      const sel = html.match(/<select[^>]*id="division-list"[^>]*>([\s\S]*?)<\/select>/i);
      if (!sel) continue;
      const found = [];
      const re = /<option[^>]*value="([0-9a-f-]{36})"[^>]*>([\s\S]*?)<\/option>/gi;
      let m;
      while ((m = re.exec(sel[1]))) {
        found.push([m[1], m[2].replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim()]);
      }
      if (found.length) return found;
    } catch (e) { /* try the next seed */ }
  }
  return DIVISIONS;
}

/* Ratings move once a week, so a day-old index is fine and saves rebuilding it
   on every visit. */
const INDEX_CACHE = 'kpl-fargo-index';
const CACHE_HOURS = 24;

function readCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(INDEX_CACHE));
    if (!raw || !raw.at || !Array.isArray(raw.players)) return null;
    if (Date.now() - raw.at > CACHE_HOURS * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
}
function writeCache(players, divisions) {
  try {
    localStorage.setItem(INDEX_CACHE, JSON.stringify({ at: Date.now(), players, divisions }));
  } catch (e) { /* storage full or blocked — the index just rebuilds next time */ }
}


let playerIndex = null;      // [{name, rating, division}] across every division
let indexLoading = null;
// no roster here — one person picks themselves

/* ── Fargo lookup ── */
function parsePlayerList(html, divLabel) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return [];

  const rows = [...table.querySelectorAll('tr')];
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  if (!headers.length && rows[0]) headers = [...rows[0].querySelectorAll('td')].map(td => td.textContent.trim());
  const ratingIdx = headers.findIndex(h => /rating|fargo/i.test(h));
  const nameIdx   = headers.findIndex(h => /name/i.test(h));

  const out = [];
  rows.slice(1).forEach(tr => {
    const cells = [...tr.querySelectorAll('td')].map(td => td.textContent.replace(/\s+/g,' ').trim());
    if (!cells.length) return;
    const raw = cells[nameIdx >= 0 ? nameIdx : 1] || cells[0];
    const rating = parseInt(cells[ratingIdx >= 0 ? ratingIdx : cells.length - 1], 10);
    if (!raw || !rating) return;
    // FargoRate lists names "Last, First" — flip for searching
    const name = /,\s/.test(raw) ? raw.replace(/^([^,]+),\s*(.+)$/, '$2 $1') : raw;
    out.push({ name, rating, division: divLabel });
  });
  return out;
}

async function loadIndex() {
  if (playerIndex) return playerIndex;
  if (indexLoading) return indexLoading;

  const cached = readCache();
  if (cached) {
    playerIndex = cached.players;
    setStatus(`${playerIndex.length} players (saved earlier today)`);
    return playerIndex;
  }

  setStatus('Loading player lists from FargoRate…');
  indexLoading = (async () => {
    const divisions = await fetchDivisions();
    const all = [];
    let failed = 0;
    await Promise.all(divisions.map(async ([id, label]) => {
      try {
        const r = await fetch(PROXY + encodeURIComponent(`${LMS}/GeneratePlayerListReport/${id}`));
        if (!r.ok) throw new Error(r.status);
        all.push(...parsePlayerList(await r.text(), label));
      } catch (e) { failed++; }
    }));

    // Same player can appear in several divisions — keep the highest rating.
    const byKey = {};
    all.forEach(p => {
      const k = p.name.toLowerCase();
      if (!byKey[k] || p.rating > byKey[k].rating) byKey[k] = p;
    });
    playerIndex = Object.values(byKey).sort((a, b) => a.name.localeCompare(b.name));
    if (playerIndex.length) writeCache(playerIndex, divisions.map(d => d[1]));

    setStatus(playerIndex.length
      ? `${playerIndex.length} players from ${divisions.length} divisions${failed ? ` · ${failed} unavailable` : ''}`
      : 'No players came back — check the proxy, or add players by hand.');
    return playerIndex;
  })();
  return indexLoading;
}

function setStatus(msg, bad) {
  const el = document.getElementById('search-status');
  el.textContent = msg || '';
  el.style.color = bad ? 'var(--loss)' : 'var(--text3)';
}

let searchSel = 0;
async function onSearch(force) {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const box = document.getElementById('results');
  if (q.length < 2 && !force) { box.innerHTML = ''; return; }
  const idx = await loadIndex();
  const hits = idx.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
  searchSel = 0;
  if (!hits.length) {
    box.innerHTML = '';
    if (q) setStatus(`No one matching "${q}" — use Add manually if they're not in a Jenkins league.`);
    return;
  }
  box.innerHTML = hits.map((p, i) => `<div class="result${i===0?' sel':''}" onclick="addFromIndex('${esc(p.name).replace(/'/g,"\\'")}')">
    <span><span class="rn">${esc(p.name)}</span> <span class="rd">${esc(p.division)}</span></span>
    <span class="rr">${p.rating}</span></div>`).join('');
}

function onSearchKey(e) {
  const items = [...document.querySelectorAll('#results .result')];
  if (e.key === 'Enter') {
    e.preventDefault();
    if (items[searchSel]) items[searchSel].click(); else onSearch(true);
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('sel', i === searchSel));
  }
}

function addFromIndex(name) {
  const p = (playerIndex || []).find(x => x.name === name);
  if (!p) return;
  addToRoster(p.name, p.rating, p.division);
}



let sheet = null, code = null, picked = null;

function note(msg, bad) {
  const el = document.getElementById('form-msg');
  if (!el) return;
  el.textContent = msg || '';
  el.style.color = bad ? 'var(--loss)' : 'var(--text3)';
}

function codeMsg(text, bad) {
  const m = document.getElementById('code-msg');
  m.textContent = text;
  m.style.color = bad ? 'var(--loss)' : 'var(--text3)';
}

async function load(c) {
  code = c;
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(c));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      codeMsg(j.code === 'not_configured'
        ? 'Signups are not set up on this site yet.'
        : 'No signup sheet with that code.', true);
      return;
    }
    if (j.data.kind !== 'signup') { codeMsg('That code is a tournament, not a signup sheet.', true); return; }
    sheet = j.data;
    document.getElementById('code-entry').style.display = 'none';
    render();
  } catch (e) { codeMsg('Could not reach the server.', true); }
}

function render() {
  const cats = sheet.categories || [];
  const closed = !!sheet.closed;

  document.getElementById('page').innerHTML = `
    <div class="card" style="margin-bottom:18px">
      <div class="card-header">
        <span class="card-title">${esc(sheet.name || 'Tournament')}</span>
        <span class="count">${sheet.entryCount ?? 0} signed up</span>
      </div>
      ${sheet.description ? `<div class="pad"><div class="desc">${esc(sheet.description)}</div></div>` : ''}
    </div>

    ${closed ? `<div class="card"><div class="done">
        <h2>Signups are closed</h2>
        <p>Have a word with an officer if you still want in.</p>
      </div></div>` : `
    <div class="card">
      <div class="card-header"><span class="card-title">Add your name</span></div>
      <div class="pad">
        ${picked ? `
          <div class="field">
            <label class="fl2">You</label>
            <div class="picked">
              <span>
                <span class="pn">${esc(picked.name)}</span><br>
                <span class="pd">${picked.division ? esc(picked.division) : 'rating entered by hand'}</span>
              </span>
              <span class="pr">${picked.rating || '—'}</span>
            </div>
            <div style="margin-top:8px">
              <button class="linkish" onclick="clearPick()">Not you? Search again</button>
            </div>
          </div>
        ` : `
          <div class="field">
            <label class="fl2" for="search">Find yourself</label>
            <div class="lookup">
              <input id="search" class="inp" type="text" spellcheck="false" autocomplete="off"
                placeholder="Type your name…" oninput="onSearch()" onkeydown="onSearchKey(event)">
              <button class="act" onclick="onSearch(true)">Search</button>
            </div>
            <div id="search-status" class="hint"></div>
            <div id="results" class="results"></div>
            <div style="margin-top:10px">
              <button class="linkish" onclick="manualEntry()">Not in a Jenkins league? Enter it by hand</button>
            </div>
          </div>
        `}

        ${cats.length ? `
          <div class="field">
            <label class="fl2" for="cat">Division</label>
            <select id="cat" class="inp">
              ${cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
            </select>
          </div>` : ''}

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button class="act primary" style="width:100%;padding:13px;font-size:15px"
          onclick="submitEntry()" ${picked ? '' : 'disabled'}>Sign me up</button>
        <div class="hint" id="form-msg" style="margin-top:10px;text-align:center"></div>
      </div>
    </div>`}`;
}

function clearPick() { picked = null; render(); }

/* The lookup panel calls this when a search result is tapped. On the admin page
   the same function pushes onto a roster; here one person is picking themselves. */
function addToRoster(name, rating, division) {
  picked = { name, rating, division };
  render();
}

function manualEntry() {
  const pre = (document.getElementById('search') || {}).value || '';
  const name = (prompt('Your name:', pre) || '').trim();
  if (!name) return;
  const r = prompt(`Fargo rating for ${name}? Leave blank if you don't have one.`, '');
  if (r === null) return;
  picked = { name, rating: parseInt(r, 10) || 0, division: null };
  render();
}

async function submitEntry() {
  if (!picked) return;
  const cat = document.getElementById('cat');
  note('Signing up…');
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(code), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: picked.name,
        rating: picked.rating,
        division: picked.division,
        category: cat ? cat.value : null,
        website: document.getElementById('website').value,     // honeypot
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      document.getElementById('page').innerHTML = `
        <div class="card"><div class="done">
          <div class="tick">&#10003;</div>
          <h2>You're in, ${esc(picked.name.split(' ')[0])}</h2>
          <p>${esc(sheet.name || 'The tournament')}${cat ? ' &middot; ' + esc(cat.value) : ''}</p>
          <p class="count" style="margin-top:10px">${j.count} signed up so far</p>
        </div></div>`;
      return;
    }
    note(j.error || 'Could not sign you up.', true);
  } catch (e) { note('Could not reach the server.', true); }
}

function goToCode() {
  const v = (document.getElementById('code-in').value || '').trim().toUpperCase();
  if (v.length !== 4) { codeMsg('Codes are four characters.', true); return; }
  location.search = '?t=' + v;
}

(function () {
  const c = (new URLSearchParams(location.search).get('t') || '').toUpperCase();
  if (c) load(c);
})();
</script>
