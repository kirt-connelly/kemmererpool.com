<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kemmerer Pool League</title>
  <meta name="description" content="Official standings, player stats, and schedule for the Kemmerer Pool League." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Same room as the front page: tungsten on green cloth, mahogany
         rails, warm brown dark. The old token names are kept so every
         renderer below carries over untouched. */
      --brass:     #d4a13c;
      --bone:      #f4efe4;

      --bg:        #14100c;
      --bg2:       #1d1712;
      --bg3:       #251d15;
      --bg4:       #31261b;
      --border:    #33291f;
      --border2:   #473829;
      --text:      #f4efe4;
      --text2:     #b7ab99;
      --text3:     #8d8172;
      --accent:    #d4a13c;
      --accent-dim:#a87c26;
      --cream:     #f4efe4;
      --green:     #2f8a63;
      --green2:    #4fae86;
      --felt:      repeating-linear-gradient(90deg,#1c5142 0px,#153f34 4px,#1c5142 8px);
      --loss:      #c0553f;
      --on-accent: #201910;
      --overlay:   rgba(10,7,4,.90);
      --radius:    6px;
      --radius-sm: 4px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; font-size: 15px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .felt-strip { height: 4px; background: var(--felt); }

    /* ── Header ── */
    header { background: var(--bg2); border-bottom: 1px solid var(--border); }
    .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0px,#154d28 4px,#1a5c32 8px); opacity: .5; }
    .header-inner { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 0 0; gap: 12px; flex-wrap: nowrap; }
    .logo-block { display: flex; align-items: center; gap: 0; min-width: 0; }
    .league-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.02em; line-height: 1.2; }
    .league-sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 3px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
    .live-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .live-pill.live { background: rgba(50,168,112,.12); border: 1px solid rgba(50,168,112,.3); color: var(--green2); }
    .live-pill.demo { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
    .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .live-pill.live .dot { background: var(--green2); }
    .live-pill.demo .dot { background: var(--text3); }
    .theme-btn { width: 27px; height: 27px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; transition: background .15s, color .15s; }
    .theme-btn:hover { background: var(--bg4); color: var(--text); }
    .refresh-note { font-size: 11px; color: var(--text3); }

    /* ── League tabs ── */
    .league-tabs { display: flex; gap: 3px; padding-top: 14px; }
    .ltab { padding: 8px 18px; cursor: pointer; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm) var(--radius-sm) 0 0; border: 1px solid var(--border); border-bottom: none; background: var(--bg3); color: var(--text2); transition: all .15s; white-space: nowrap; }
    .ltab:hover:not(.active) { color: var(--text); background: var(--bg4); }
    .ltab.inactive-league { color: var(--text2); background: var(--bg3); }
    .ltab.inactive-league:hover { color: var(--text); background: var(--bg4); }
    .ltab.active { background: var(--bg); color: var(--text); border-color: var(--border); border-bottom-color: var(--bg); position: relative; bottom: -1px; font-weight: 600; }
    .ltab .badge { font-size: 9px; background: var(--green); color: var(--on-accent); border-radius: 99px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; font-weight: 600; }

    /* ── View tabs ── */
    .view-bar { background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; overflow-x: auto; }
    .view-bar::-webkit-scrollbar { display: none; }
    .view-bar-inner { display: flex; gap: 2px; padding: 8px 0; white-space: nowrap; min-width: min-content; }
    .vtab { padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 400; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); transition: all .12s; white-space: nowrap; flex-shrink: 0; }
    .vtab:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .vtab.active { background: var(--bg3); color: var(--text); font-weight: 600; border-left: 2px solid var(--accent); padding-left: 12px; }

    /* ── Main ── */
    main { padding: 24px 0 80px; }
    .view-bar + main { padding-top: 22px; }

    /* ── Card ── */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg3); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-meta { font-size: 12px; color: var(--text3); }

    /* ── Table ── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; color: var(--text2); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--bg3); }
    .num { font-variant-numeric: tabular-nums; }
    .rank-num { font-size: 12px; font-weight: 500; color: var(--text3); width: 24px; display: inline-block; text-align: right; }

    /* ── Bar ── */
    .bar-wrap { display: flex; align-items: center; gap: 10px; }
    .bar-track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; flex-shrink: 0; }
    .bar-fill { height: 100%; border-radius: 3px; }

    /* ── Fargo bar ── */
    .fargo-wrap { display: flex; align-items: center; gap: 10px; }
    .fargo-track { width: 90px; height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; flex-shrink: 0; }
    .fargo-fill { height: 100%; border-radius: 4px; }
    .fargo-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── Team section (Players/Team) ── */
    .team-section-hdr { padding: 9px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--cream); letter-spacing: .05em; text-transform: uppercase; border-left: 3px solid var(--accent); }

    /* ── Schedule ── */
    .sched-block { margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .sched-date-hdr { padding: 10px 16px; background: var(--bg3); font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
    .sched-block.sched-next { border-color: var(--accent); }
    .next-pill { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; letter-spacing: .06em; vertical-align: middle; }
    .sched-count { font-weight: 400; color: var(--text3); font-size: 11px; }
    .match-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); }
    @media (max-width: 700px) { .match-grid { grid-template-columns: 1fr; } }
    .match-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px 16px; background: var(--bg2); min-height: 110px; }
    .match-card:hover { background: var(--bg3); }
    .match-teams-row { display: flex; align-items: center; justify-content: center; width: 100%; }
    .match-home { width: 160px; text-align: right; padding-right: 14px; display: flex; flex-direction: column; align-items: flex-end; }
    .match-away { width: 160px; text-align: left; padding-left: 14px; display: flex; flex-direction: column; align-items: flex-start; }
    .match-name { font-size: 14px; font-weight: 700; color: var(--cream); line-height: 1.2; }
    .match-label { font-size: 10px; color: var(--text3); margin-top: 3px; letter-spacing: .06em; text-transform: uppercase; }
    .vs-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
    .vs-chip { background: var(--accent); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 800; color: var(--on-accent); letter-spacing: .08em; }
    .result-btn {
      background: var(--bg3);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.03em;
    }
    .result-btn:hover {
      background: var(--accent);
      color: var(--on-accent);
    }
    .venue-label { font-size: 13px; color: var(--text2); text-align: center; font-weight: 500; }

    /* ── Print toolbar ── */
    .sched-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .print-title { display: none; }
    .print-btn {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
      padding: 6px 14px; border-radius: var(--radius-sm); font-family: inherit;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s;
    }
    .print-btn:hover { background: var(--bg4); color: var(--text); }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 0; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { color: var(--text3); font-size: 13px; }

    /* ── Notice ── */
    .notice { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; color: var(--text2); font-size: 14px; line-height: 1.8; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header-inner { padding: 12px 0 0; gap: 8px; }
      .league-name { font-size: 20px; }
      .league-sub { display: none; }
      .live-pill { font-size: 10px; padding: 3px 9px; }
      .refresh-note { font-size: 10px; }
      .league-tabs { padding-top: 12px; }
      .ltab { padding: 7px 14px; font-size: 13px; }
      .vtab { padding: 6px 10px; font-size: 12px; }
      .vtab.active { padding-left: 9px; }
      .tbl th { padding: 8px 8px; font-size: 10px; }
      .tbl td { padding: 10px 8px; font-size: 13px; }
      .match-card { grid-template-columns: 1fr 50px 1fr; gap: 4px; padding: 10px 10px; }
      .match-name { font-size: 12px; }
      .fargo-track { width: 50px; }
      .bar-track { width: 50px !important; }
    }

    /* ── Leagues on Info ──
       One block per season, newest first: what it is, whether it's running, and
       the two things people come for — the standings and the schedule. */
    .lg-block { border-top: 1px solid var(--border); }
    .lg-block:first-of-type { border-top: none; }
    .lg-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
    .lg-name { font-size: 17px; font-weight: 700; color: var(--cream); }
    .lg-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border2); color: var(--text3);
      white-space: nowrap; }
    .lg-tag.on { border-color: var(--accent); color: var(--green2); }
    .lg-tag.soon { border-color: var(--border2); color: var(--text2); }
    .lg-body { padding: 10px 18px 16px; }
    .lg-note { font-size: 14px; color: var(--text2); line-height: 1.7; margin: 0; }
    .lg-note a { color: var(--green2); font-weight: 600; text-decoration: none; }
    .lg-note a:hover { text-decoration: underline; }

    .lg-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lg-link { display: block; text-align: left; font-family: inherit; cursor: pointer;
      text-decoration: none; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 15px; transition: border-color .15s; }
    .lg-link:hover { border-color: var(--accent); }
    .ll-name { display: block; font-size: 15px; font-weight: 600; color: var(--green2); }
    .ll-sub { display: block; font-size: 12px; color: var(--text3); margin-top: 3px; line-height: 1.5; }
    @media (max-width: 560px) { .lg-links { grid-template-columns: 1fr; } }

    /* ── Info photos ──
       Decoration, so they load lazily and keep a fixed shape to stop the page
       jumping about as they arrive. */
    .photo-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px; margin-bottom: 18px; }
    .shot { margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--bg2);
      border: 1px solid var(--border); aspect-ratio: 4 / 3; }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* On a phone they crowd out the information people came for. */
    @media (max-width: 700px) { .photo-strip { display: none; } }
    .pad-note { padding: 16px 18px; font-size: 14px; color: var(--text2); line-height: 1.7; }
    @media print { .photo-strip { display: none; } }

    /* ── Officer contact ── */
    .officer-contact { padding: 14px 18px; border-top: 1px solid var(--border);
      font-size: 14px; color: var(--text2); }
    .officer-contact a { color: var(--green2); font-weight: 600; text-decoration: none;
      word-break: break-all; }
    .officer-contact a:hover { text-decoration: underline; }
    @media print { .officer-contact a { color: #000; } }

    /* ── Local bars ── */
    .thanks-note { padding: 14px 18px 0; font-size: 14px; color: var(--text2); line-height: 1.6; }
    .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px; padding: 14px 18px 18px; }
    .bar { border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); padding: 14px 16px; }
    .bar .bn { font-size: 16px; font-weight: 700; color: var(--green2); }
    .bar .ba { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
    .bar .bp { display: inline-block; margin-top: 8px; font-size: 15px; font-weight: 600;
      color: var(--cream); text-decoration: none; font-variant-numeric: tabular-nums; }
    .bar .bp:hover { color: var(--green2); }
    @media print {
      .bar { break-inside: avoid; }
      .bar .bp { color: #000; }
    }

    /* ── Suggestion form ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); }
    .field input, .field textarea {
      font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 12px; width: 100%; transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .submit-btn {
      background: var(--accent); color: var(--on-accent); border: none;
      padding: 10px 22px; border-radius: var(--radius-sm); font-family: inherit;
      font-size: 13px; font-weight: 600; letter-spacing: .03em; cursor: pointer; transition: opacity .15s;
    }
    .submit-btn:hover:not(:disabled) { opacity: .85; }
    .submit-btn:disabled { opacity: .5; cursor: default; }
    .form-status { font-size: 13px; font-weight: 500; }


    /* ── Print ── */
    @media print {
      /* Repoint the palette instead of overriding every rule individually. */
      :root, html[data-theme="light"], html[data-theme="dark"] {
        --bg: #fff; --bg2: #fff; --bg3: #f2f2f2; --bg4: #e8e8e8;
        --border: #999; --border2: #777;
        --text: #000; --text2: #222; --text3: #555;
        --cream: #000; --accent: #000; --accent-dim: #000;
        --green: #000; --green2: #000; --loss: #000; --on-accent: #000;
      }
      html, body { background: #fff; font-size: 10.5pt; }
      header, .view-bar, footer, .felt-strip, .theme-btn,
      .result-btn, .print-btn, .next-pill { display: none !important; }
      main { padding: 0; }
      .wrap { max-width: none; padding: 0; }

      .sched-toolbar { display: block; margin-bottom: 14px; }
      .print-title { display: block; font-size: 14pt; font-weight: 700; color: #000; }
      .print-sub { display: block; font-size: 9pt; font-weight: 400; color: #555; margin-top: 2px; }

      /* Keep a week's matches together rather than split across a page. */
      .sched-block { break-inside: avoid; page-break-inside: avoid; margin-bottom: 8px; border: 1px solid #999; }
      .sched-date-hdr { padding: 5px 9px; font-size: 9.5pt; border-bottom: 1px solid #999; }
      .match-grid { gap: 0; }
      .match-card { padding: 7px 9px; min-height: 0; gap: 4px; border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; }
      .match-name { font-size: 10pt; }
      .match-label { font-size: 7.5pt; }
      /* These use --accent as a *background*; forcing it black would hide the
         text, and most browsers drop backgrounds when printing anyway. */
      .vs-chip, .next-pill, .submit-btn, .live-pill, a[style*="var(--accent)"] {
        background: transparent !important; color: #000 !important; border: 1px solid #999 !important;
      }
      .vs-chip { padding: 1px 8px; font-size: 8pt; }
      .venue-label { font-size: 9pt; font-weight: 600; }
    }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 11px; color: var(--text3); letter-spacing: .05em; }
    .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .footer-status { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    footer a { color: var(--text2); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* ═══════════════════════════════════════════════════════════════
       Front-page chrome. Everything above is the old page's structure
       with the palette repointed; everything here is the masthead,
       the tabs and the type, brought over from the front page so the
       two read as one site.
       ═══════════════════════════════════════════════════════════════ */
    body { font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; }

    /* The lamp over the table, same as the front page. */
    .lamp {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(120vw 70vh at 50% -18vh, rgba(212,161,60,.16), transparent 62%),
        radial-gradient(70vw 46vh at 50% -6vh, rgba(212,161,60,.10), transparent 60%);
    }
    /* .view-bar is deliberately NOT in this list. It is sticky, and a
       `position: relative` here would quietly override that — which is
       exactly what happened once. `main` sits at z-index 0 so the card
       can never paint over the bar it scrolls under. */
    /* `header` is deliberately absent here too — it sets its own
       position and z-index below, and a competing `position` declaration
       for the same selector is what broke the view bar. Nothing that
       needs to stick gets its position set in a shared rule. */
    footer, .page-hd { position: relative; z-index: 1; }
    main { position: relative; z-index: 0; }

    /* ── Masthead ───────────────────────────────────────────────── */
    header {
      background: rgba(20,16,12,.86);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid rgba(212,161,60,.15);
      position: sticky; top: 0; z-index: 40;
    }
    .mast-in { display: flex; align-items: center; gap: 24px; height: 62px; }
    .mark { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
    .mark .eight {
      width: 27px; height: 27px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: radial-gradient(circle at 33% 27%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%), #100d0a;
      box-shadow: inset -3px -4px 7px rgba(0,0,0,.6);
    }
    .mark .eight span {
      width: 12px; height: 12px; border-radius: 50%; background: var(--bone);
      font: 700 8px/12px 'Space Mono', monospace; color: #100d0a; text-align: center;
    }
    .mark b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; color: var(--bone); white-space: nowrap; }
    .mast-nav { margin-left: auto; display: flex; gap: 4px; }
    .mast-nav a {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--text3);
      text-decoration: none; padding: 8px 12px; border-radius: 4px;
    }
    .mast-nav a:hover { color: var(--bone); background: rgba(244,239,228,.06); }

    /* ── Rail diamonds ──────────────────────────────────────────── */
    .rail-rule {
      display: flex; align-items: center; justify-content: center; gap: 46px;
      height: 26px; position: relative;
    }
    .rail-rule::before {
      content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,161,60,.22) 12%,
                  rgba(212,161,60,.22) 88%, transparent);
    }
    .rail-rule i {
      width: 7px; height: 7px; background: var(--brass); opacity: .5;
      transform: rotate(45deg); position: relative; flex: none;
    }

    /* ── Page head ──────────────────────────────────────────────── */
    .page-hd { padding: 26px 0 0; }
    .eyebrow {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--brass);
    }
    .page-hd h1 {
      font-size: clamp(26px, 4vw, 38px); font-weight: 700;
      letter-spacing: -.02em; line-height: 1.1; margin: 9px 0 0; color: var(--bone);
    }
    .page-hd .sub { color: var(--text3); font-size: 15px; margin-top: 7px; }

    /* ── League tabs ────────────────────────────────────────────── */
    .league-tabs { display: flex; gap: 7px; padding-top: 20px; flex-wrap: wrap; }
    .ltab {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      padding: 10px 15px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--text3);
      position: static; bottom: auto; transition: color .15s, border-color .15s, background .15s;
    }
    .ltab:hover:not(.active), .ltab.inactive-league:hover {
      color: var(--bone); background: rgba(244,239,228,.05); border-color: var(--border2);
    }
    .ltab.active, .ltab.inactive-league.active {
      background: rgba(212,161,60,.12); border-color: rgba(212,161,60,.55);
      color: var(--brass); position: static; bottom: auto;
    }
    .ltab.inactive-league { background: transparent; color: var(--text3); }

    /* ── View tabs ──────────────────────────────────────────────── */
    .view-bar {
      background: rgba(29,23,18,.97);
      backdrop-filter: saturate(140%) blur(8px);
      -webkit-backdrop-filter: saturate(140%) blur(8px);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid rgba(212,161,60,.15);
      /* Sticks directly beneath the masthead, which is 62px and z-index 40. */
      position: sticky; top: 62px; z-index: 30; margin-top: 22px;
    }
    .view-bar-inner { gap: 3px; padding: 7px 0; align-items: center; }
    .vtab {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 9px 13px; border-radius: 4px; color: var(--text3);
    }
    .vtab:hover:not(.active) { color: var(--bone); background: rgba(244,239,228,.05); }
    .vtab.active {
      background: rgba(212,161,60,.12); color: var(--brass); font-weight: 700;
      border-left: none; padding-left: 13px;
    }
    /* The way out to the printable sheet. Sits at the end of the row,
       pushed clear of the views so it doesn't read as one of them. */
    .vtab-out {
      margin-left: auto; text-decoration: none; color: var(--text3);
      border: 1px solid var(--border); display: inline-flex; align-items: center;
    }
    .vtab-out:hover { color: var(--brass); border-color: rgba(212,161,60,.5); background: transparent; }

    /* ── Type through the data views ────────────────────────────── */
    .tbl th, .num, .rank-num, .fargo-num, .lg-tag, .next-pill, .vs-chip,
    .match-label, .sched-count, .card-meta, .live-pill, .print-btn {
      font-family: 'Space Mono', monospace;
    }
    .tbl th { letter-spacing: .12em; font-weight: 700; }
    .card { background: rgba(0,0,0,.18); }
    .card-header { background: rgba(0,0,0,.28); }
    .card-title {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--brass);
    }
    .sched-block.sched-next { border-color: rgba(212,161,60,.5); }
    .spinner { border-top-color: var(--brass); }

    /* ── Footer ─────────────────────────────────────────────────── */
    footer {
      background: var(--bg2); border-top: 1px solid rgba(244,239,228,.1);
      padding: 30px 0 26px; font-family: 'Space Mono', monospace;
      font-size: 11px; letter-spacing: .06em;
    }
    footer a { color: var(--text2); }
    footer a:hover { color: var(--brass); }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 3px;
    }

    @media (max-width: 640px) {
      .page-hd { padding-top: 20px; }
      .mast-in { height: auto; flex-direction: column; justify-content: center;
                 gap: 2px; padding-top: 9px; padding-bottom: 7px; }
      .mark b { font-size: 14px; }
      .mast-nav { margin-left: 0; }
      .mast-nav a { padding: 6px 9px; letter-spacing: .08em; }
      /* Two sticky bars eat half a phone screen, and the stacked masthead
         has no fixed height to offset against anyway. So the masthead
         scrolls away here and the view bar alone holds the top. */
      header { position: static; }
      .view-bar { top: 0; margin-top: 16px; }
      .view-bar + main { padding-top: 18px; }
      .ltab { padding: 9px 12px; font-size: 10px; letter-spacing: .08em; }
      .vtab { padding: 8px 10px; font-size: 10px; letter-spacing: .06em; }
      .vtab.active { padding-left: 10px; }
      .vtab-out { margin-left: 3px; }
      .rail-rule { gap: 26px; }
    }

    @media print {
      .lamp, .rail-rule, .page-hd, .mast-nav, .vtab-out { display: none !important; }
    }
  </style>
</head>
<body>

<div class="lamp" aria-hidden="true"></div>

<header>
  <div class="wrap mast-in">
    <a class="mark" href="index.html">
      <span class="eight" aria-hidden="true"><span>8</span></span>
      <b>Kemmerer Pool League</b>
    </a>
    <nav class="mast-nav">
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="index.html#rooms">Bars</a>
    </nav>
  </div>
</header>

<div class="wrap"><div class="rail-rule" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

<div class="wrap page-hd">
  <div class="eyebrow" id="lg-eyebrow">Wednesday nights</div>
  <h1 id="lg-title">10-Ball Summer 2026</h1>
  <div class="sub" id="lg-sub">Standings, players and the schedule.</div>
  <div class="league-tabs">
    <button class="ltab" id="ltab-10ball" onclick="switchLeague('10ball')">10-Ball 26</button>
    <button class="ltab inactive-league" id="ltab-8ball" onclick="switchLeague('8ball')">8-Ball 25-26</button>
  </div>
</div>

<div class="view-bar">
  <div class="wrap">
    <div class="view-bar-inner">
      <button class="vtab active" id="vt-teams"    onclick="switchView('teams')">Standings</button>
      <button class="vtab"        id="vt-players"  onclick="switchView('players')">Players</button>
      <button class="vtab"        id="vt-byteam"   onclick="switchView('byteam')">By Team</button>
      <button class="vtab"        id="vt-list"     onclick="switchView('list')">Ratings</button>
      <button class="vtab"        id="vt-schedule" onclick="switchView('schedule')">Schedule</button>
      <a class="vtab vtab-out" id="print-link" href="schedule.html?league=10ball">Print sheet &rarr;</a>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="content"></div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-status">
      <span id="live-status" class="live-pill demo"><span class="dot"></span> Loading&hellip;</span>
      <span id="refresh-note"></span>
    </div>
    <div><a href="index.html">Kemmerer Pool League</a> &nbsp;&middot;&nbsp; league v1.03</div>
  </div>
</footer>

<script>
const PROXY = '/proxy?url=';
const BASE  = 'https://lms.fargorate.com/PublicReport';
const DIVISIONS = {
  '10ball': { id: 'c97cf1bf-ff08-44a0-b916-b4520124b3e6', label: 'Kemmerer Summer 10 Ball 2026' },
  '8ball':  { id: '1dc8b2aa-62eb-41a6-a8f6-b379014efe83', label: 'Kemmerer 8 Ball League 25-26' },
};
const VIEWS = {
  teams:    { url: id => `${BASE}/GenerateTeamStandingsReport/${id}`,         method: 'GET' },
  players:  { url: id => `${BASE}/GeneratePlayerStandingsReport/${id}`,       method: 'GET' },
  byteam:   { url: id => `${BASE}/GeneratePlayerStandingsByTeamReport/${id}`, method: 'GET' },
  list:     { url: id => `${BASE}/GeneratePlayerListReport/${id}`,            method: 'GET' },
  schedule: { url: ()  => `${BASE}/GenerateDivisionScheduleReport`,           method: 'POST', body: id => `divisionId=${id}` },
};

let league = '10ball', view = 'teams', cache = {}, isLive = null, inDrillDown = false;

/* One palette now — the light theme went with the redesign. isLightTheme
   stays because winColor() and fargoColor() ask it which way to tint;
   it just always gives the same answer. */
function isLightTheme() { return false; }
document.documentElement.setAttribute('data-theme', 'dark');

function setStatus(live) {
  if (isLive === live) return;
  isLive = live;
  const el = document.getElementById('live-status');
  el.className = `live-pill ${live?'live':'demo'}`;
  el.innerHTML = `<span class="dot"></span> ${live?'Live data':'Demo data'}`;
  document.getElementById('refresh-note').textContent =
    `Ratings as of ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
}

async function fetchSection(lg, vw) {
  const key = `${lg}__${vw}`;
  if (cache[key]) return cache[key];
  const divId = DIVISIONS[lg].id;
  const v = VIEWS[vw];
  const url = v.url(divId);
  try {
    const opts = { method: v.method||'GET', headers: { 'Accept': 'text/html' } };
    if (v.method === 'POST') {
      opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      opts.body = v.body(divId);
    }
    const r = await fetch(PROXY + encodeURIComponent(url), opts);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    if (!html || html.trim().length < 30) throw new Error('empty');
    cache[key] = { html, live: true };
    setStatus(true);
    return cache[key];
  } catch(e) {
    setStatus(false);
    cache[key] = { html: null, live: false };
    return cache[key];
  }
}

function parseTable(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return null;

  const allTrs = [...table.querySelectorAll('tr')];
  if (!allTrs.length) return null;

  // Try <th> elements first
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  let dataStartIdx = 1;

  // If no <th> found, treat first <tr> as header row using its <td>s
  if (!headers.length && allTrs[0]) {
    const firstCells = [...allTrs[0].querySelectorAll('td')];
    if (firstCells.length) {
      headers = firstCells.map(td => td.textContent.trim());
    }
  }

  const rows = allTrs.slice(dataStartIdx)
    .map(tr => [...tr.querySelectorAll('td')].map(td => td.textContent.trim()))
    .filter(r => r.length > 0);

  return { headers, rows };
}

function findWinPctIdx(headers) {
  const patterns = [/win\s*pct/i, /win\s*%/i, /pct/i, /%/i];
  for (const p of patterns) {
    const idx = headers.findIndex(h => p.test(h));
    if (idx >= 0) return idx;
  }
  return -1;
}

function winColor(pctStr) {
  const v = Math.min(Math.max(parseFloat(pctStr)/100, 0), 1);
  return `hsl(${Math.round(v*130)},${isLightTheme()?62:55}%,${isLightTheme()?36:42}%)`;
}
function fargoColor(rating) {
  const pct = Math.min((parseInt(rating)||0)/800, 1);
  return `hsl(${Math.round(pct*100+20)},${isLightTheme()?62:55}%,${isLightTheme()?38:48}%)`;
}

/* ── Teams ── */
function renderTeams(data) {
  if (!data.live || !data.html) return notice('Team standings will appear here once live data loads.');

  // Parse team IDs from anchor tags in the raw HTML
  const d = document.createElement('div');
  d.innerHTML = data.html;
  const teamLinks = {};
  d.querySelectorAll('a[href*="teamId"]').forEach(a => {
    const m = a.href.match(/teamId=([a-f0-9-]+)/i);
    if (m) teamLinks[a.textContent.trim()] = m[1];
  });

  const t = parseTable(data.html);
  if (!t || !t.rows.length) return notice('Team standings will appear here once live data loads.');
  const pctIdx = findWinPctIdx(t.headers);

  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Team Standings</span>
      <span class="card-meta">${t.rows.length} teams · ${DIVISIONS[league].label}</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.rows.map((r,i) => {
        const teamName = r[1] || '';
        const teamId = teamLinks[teamName] || null;
        return `<tr>
          ${r.map((cell,ci) => {
            if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
            if (ci===1) return `<td>${teamId
              ? `<span style="font-weight:500;color:var(--cream);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--text3)" onclick="loadTeamDetail('${teamId}','${teamName.replace(/'/g,"\\'")}')">${cell}</span>`
              : `<span style="font-weight:500;color:var(--cream)">${cell}</span>`
            }</td>`;
            if (ci===pctIdx && pctIdx>0) {
              const pv = parseFloat(cell)||0;
              return `<td><div class="bar-wrap">
                <div class="bar-track" style="width:80px"><div class="bar-fill" style="width:${pv}%;background:${winColor(cell)}"></div></div>
                <span class="num" style="font-size:13px;color:${winColor(cell)};font-weight:600">${cell}</span>
              </div></td>`;
            }
            return `<td class="num" style="color:var(--text2)">${cell}</td>`;
          }).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Players ── */
function renderPlayers(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return notice('Player standings will appear here once live data loads.');
  const winIdx = findWinPctIdx(t.headers);
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player Standings</span>
      <span class="card-meta">${t.rows.length} players</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>${t.headers.map(h=>{
          const label = h.replace(/^GMS WON$/i,'W/L').replace(/^WIN PCT$/i,'WIN %');
          return `<th>${label}</th>`;
        }).join('')}</tr></thead>
      <tbody>${t.rows.map((r,i) => `<tr>
        ${r.map((cell,ci) => {
          if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
          if (ci===1) return `<td style="font-weight:500;color:var(--cream)">${cell}</td>`;
          if (ci===winIdx && winIdx>0) {
            const pv = parseFloat(cell)||0;
            return `<td><div class="bar-wrap">
              <div class="bar-track" style="width:65px"><div class="bar-fill" style="width:${pv}%;background:${winColor(cell)}"></div></div>
              <span class="num" style="font-size:13px;color:${winColor(cell)};font-weight:600">${cell}</span>
            </div></td>`;
          }
          const hdr = t.headers[ci] || '';
          const isAccolade = /^(brs|trs|wzs|wbs|cws|pms)$/i.test(hdr) && parseInt(cell) > 0;
          return `<td class="num" style="color:${isAccolade?'var(--green2)':'var(--text2)'}${isAccolade?';font-weight:700':''}">${cell}</td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Players by Team ── */
function renderByTeam(data) {
  if (!data.live || !data.html) return notice('Players by team will appear here once live data loads.');
  const d = document.createElement('div');
  d.innerHTML = data.html;
  const table = d.querySelector('table');
  if (!table) return notice('No data available.');

  // Get headers — try <th> first, fall back to first <tr> tds
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  const allTrs = [...table.querySelectorAll('tr')];
  let dataRows = allTrs.slice(1);
  if (!headers.length && allTrs[0]) {
    headers = [...allTrs[0].querySelectorAll('td')].map(td => td.textContent.trim());
  }

  // Find WIN PCT column index (for bar rendering)
  const winPctIdx = headers.findIndex(h => /win.?pct|win.?%|pct/i.test(h));
  // Name column is index 0, but FargoRate puts name at col 0 in byteam view
  // Detect if names are "Last, First" or "First Last"

  // Count teams for the meta line
  let teamCount = 0;

  let html = `<div style="display:flex;flex-direction:column;gap:16px">`;

  let currentTeam = null;
  let currentPlayers = [];

  function flushTeam() {
    if (!currentTeam) return;
    teamCount++;
    html += `<div class="card">
      <div class="card-header" style="border-left:3px solid var(--accent)">
        <span class="card-title" style="color:var(--cream);font-size:15px">${currentTeam}</span>
        <span class="card-meta">${currentPlayers.length} player${currentPlayers.length!==1?'s':''}</span>
      </div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          <th>Player</th>
          ${headers.slice(1).map(h => {
            const label = h.replace(/^GMS WON$/i,'W/L').replace(/^WIN PCT$/i,'WIN %');
            return `<th style="text-align:${h==='NAME'?'left':'center'}">${label}</th>`;
          }).join('')}
        </tr></thead>
        <tbody>
          ${currentPlayers.map(cells => {
            const name = (cells[0] || '').replace(/\s+/g, ' ').trim();
            // Format name: "Last, First" → "First Last", or leave as-is
            const displayName = /,\s/.test(name)
              ? name.replace(/^([^,]+),\s*(.+)$/, '$2 $1')
              : name;
            return `<tr>
              <td style="font-weight:600;color:var(--cream);min-width:130px">${displayName}</td>
              ${cells.slice(1).map((cell, ci) => {
                const hdr = headers[ci + 1] || '';
                // Win pct bar
                if (ci + 1 === winPctIdx) {
                  const pv = parseFloat(cell) || 0;
                  const pvNorm = pv > 1 ? pv : pv * 100;
                  const pvStr = cell.includes('%') ? cell : pvNorm.toFixed(0) + '%';
                  return `<td style="text-align:center"><div class="bar-wrap" style="justify-content:center">
                    <div class="bar-track" style="width:55px"><div class="bar-fill" style="width:${pvNorm}%;background:${winColor(pvNorm+'%')}"></div></div>
                    <span class="num" style="font-size:13px;color:${winColor(pvNorm+'%')};font-weight:600;min-width:36px">${pvStr}</span>
                  </div></td>`;
                }
                // Highlight non-zero BR/TR type cols
                const isHighlight = /^(brs|trs|wzs|wbs|cws|pms)$/i.test(hdr) && parseInt(cell) > 0;
                return `<td class="num" style="text-align:center;color:${isHighlight?'var(--green2)':'var(--text2)'}${isHighlight?';font-weight:700':''}">${cell||'—'}</td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>`;
    currentPlayers = [];
  }

  dataRows.forEach(row => {
    const cells = [...row.querySelectorAll('td')];
    if (!cells.length) return;
    // A team header row has either: only 1 cell, or a colspan > 1 on the first cell,
    // or ALL non-first cells are empty/dash (but NOT just zeros — players can have 0 wins)
    const isTeamHdr = cells.length === 1
      || (cells[0] && cells[0].colSpan > 1)
      || (cells.length > 1 && cells.slice(1).every(c => {
            const t = c.textContent.trim();
            return t === '' || t === '-';
          }));
    if (isTeamHdr) {
      flushTeam();
      currentTeam = cells[0]?.textContent.trim();
    } else {
      const vals = cells.map(c => c.textContent.trim());
      if (vals[0]) currentPlayers.push(vals);
    }
  });
  flushTeam();

  html += `</div>`;
  return html;
}

/* ── Player List ── */
function renderList(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return notice('Player list will appear here once live data loads.');
  const ratingIdx = t.headers.findIndex(h => /rating|fargo/i.test(h));
  const sorted = ratingIdx >= 0
    ? [...t.rows].sort((a,b) => (parseInt(b[ratingIdx])||0)-(parseInt(a[ratingIdx])||0))
    : t.rows;
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player List &amp; Fargo Ratings</span>
      <span class="card-meta">${sorted.length} players · sorted by rating</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>#</th>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${sorted.map((r,i) => {
        const rating = ratingIdx>=0 ? parseInt(r[ratingIdx])||0 : 0;
        const pct = Math.min(rating/800,1);
        return `<tr>
          <td><span class="rank-num">${i+1}</span></td>
          ${r.map((cell,ci) => {
            if (ci===1) return `<td style="font-weight:500;color:var(--cream)">${cell}</td>`;
            if (ci===ratingIdx && ratingIdx>=0) return `<td>
              <div class="fargo-wrap">
                <div class="fargo-track"><div class="fargo-fill" style="width:${pct*100}%;background:${fargoColor(rating)}"></div></div>
                <span class="fargo-num" style="color:${fargoColor(rating)}">${cell}</span>
              </div></td>`;
            return `<td style="color:var(--text2)">${cell}</td>`;
          }).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Schedule ── */
function renderSchedule(data) {
  if (!data.live || !data.html) return notice('Schedule will appear here once live data loads.');
  const d = document.createElement('div');
  d.innerHTML = data.html;

  const today = new Date();
  today.setHours(0,0,0,0);

  // Parse date string "M/D/YYYY" into a Date
  function parseDate(str) {
    try { const p = str.split('/'); return new Date(p[2], p[0]-1, p[1]); }
    catch(e) { return null; }
  }

  function fmtDate(str) {
    const dt = parseDate(str);
    if (!dt) return str;
    return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }

  // Pre-collect ALL matchIds from anywhere in the document, in order
  const allMatchLinks = [...d.querySelectorAll('a[href*="matchId"], a[href*="MatchResult"]')]
    .map(a => {
      const href = a.getAttribute('href') || '';
      const m = href.match(/matchId=([a-f0-9-]{36})/i);
      return m ? m[1] : null;
    }).filter(Boolean);
  let matchLinkIdx = 0;

  const blocks = [];
  let cur = null;
  const container = d.querySelector('#schedule-list') || d;

  // Also search entire document for ALL schedule-team-blocks with data-url
  // Build a map of team pair → matchId for reliable lookup
  const matchIdMap = {};
  [...d.querySelectorAll('.schedule-team-block[data-url]')].forEach(block => {
    const url = block.getAttribute('data-url') || '';
    const mu  = url.match(/matchId=([a-f0-9-]{36})/i);
    if (!mu) return;
    const teams = [...block.querySelectorAll('.schedule-team')]
      .map(s => s.textContent.trim().replace(/^\(H\)\s*|\(A\)\s*/g, '').trim());
    if (teams.length >= 2) matchIdMap[`${teams[0]}|${teams[1]}`] = mu[1];
  });

  [...container.children].forEach(node => {
    if (node.classList.contains('schedule-date')) {
      cur = { date: node.textContent.trim(), matches: [] };
      blocks.push(cur);
    } else if (node.classList.contains('schedule-team-block') && cur) {
      const teams = [...node.querySelectorAll('.schedule-team')]
        .map(s => s.textContent.trim().replace(/^\(H\)\s*|\(A\)\s*/g, '').trim());
      const venue = node.querySelector('.schedule-location')?.textContent.trim() || '';

      // Try data-url on this node first, then map lookup, then sequential fallback
      let matchId = null;
      const dataUrl = node.getAttribute('data-url') || '';
      const mu = dataUrl.match(/matchId=([a-f0-9-]{36})/i);
      if (mu) {
        matchId = mu[1];
      } else if (teams.length >= 2 && matchIdMap[`${teams[0]}|${teams[1]}`]) {
        matchId = matchIdMap[`${teams[0]}|${teams[1]}`];
      } else if (allMatchLinks.length > matchLinkIdx) {
        matchId = allMatchLinks[matchLinkIdx++] || null;
      }

      if (teams.length >= 2) cur.matches.push({ home: teams[0], away: teams[1], venue, matchId });
    }
  });

  if (!blocks.length) return notice('No schedule data found.');

  // First block on or after today — the schedule scrolls here on open.
  const nextIdx = blocks.findIndex(b => {
    if (!b.matches.length) return false;
    const d = parseDate(b.date);
    return d && d >= today;
  });

  return `<div class="sched-toolbar">
    <div class="print-title">
      Kemmerer Pool League &mdash; ${DIVISIONS[league].label}
      <span class="print-sub">Printed ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>
    </div>
    <button class="print-btn" onclick="window.print()">Print Schedule</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    ${blocks.map((block, bi) => {
      if (!block.matches.length) return '';
      const dt     = parseDate(block.date);
      const isPast = dt && dt <= today;
      const isNext = bi === nextIdx;
      return `<div class="sched-block${isNext?' sched-next':''}"${isNext?' id="sched-next"':''}>
        <div class="sched-date-hdr">
          <span>${fmtDate(block.date)}${isNext?' <span class="next-pill">Next up</span>':''}</span>
          <span class="sched-count">${block.matches.length} match${block.matches.length!==1?'es':''}</span>
        </div>
        <div class="match-grid">
          ${block.matches.map(m => `
            <div class="match-card">
              <div class="match-teams-row">
                <div class="match-home">
                  <div class="match-name">${m.home}</div>
                  <div class="match-label">Home</div>
                </div>
                <div class="vs-col">
                  <div class="vs-chip">VS</div>
                </div>
                <div class="match-away">
                  <div class="match-name">${m.away}</div>
                  <div class="match-label">Away</div>
                </div>
              </div>
              ${m.venue || isPast ? `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
                ${m.venue ? `<div class="venue-label">${m.venue}</div>` : ''}
                ${isPast && m.matchId
                  ? `<button class="result-btn" onclick="loadMatchResult('${m.matchId}',this.dataset.title)" data-title="${m.home} vs ${m.away}">📋 Results</button>`
                  : isPast ? `<div class="venue-label" style="font-style:italic">No results</div>` : ''}
              </div>` : ''}
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ── Match Result ── */
async function loadMatchResult(matchId, title) {
  inDrillDown = true;
  // Store schedule HTML so we can go back
  document.getElementById('content').innerHTML = `
    <div style="margin-bottom:12px">
      <button onclick="switchView('schedule')" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
        ← Back to Schedule
      </button>
    </div>
    <div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Loading results…</div></div>`;

  try {
    const url = `https://lms.fargorate.com/PublicReport/MatchResultBCAPL?matchId=${matchId}`;
    const r   = await fetch(PROXY + encodeURIComponent(url));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    document.getElementById('content').innerHTML =
      renderMatchResult(html, title) +
      `<div style="margin-top:16px">
        <button onclick="switchView('schedule')" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
          ← Back to Schedule
        </button>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = notice(`Could not load match results: ${e.message}`);
  }
}

function renderMatchResult(html, title) {
  const d = document.createElement('div');
  d.innerHTML = html;

  // Hidden input helper
  const gi = id => d.querySelector(`#${id}`)?.value || '';
  const team1 = gi('TeamOne_Name') || title.split(' vs ')[0];
  const team2 = gi('TeamTwo_Name') || title.split(' vs ')[1] || '';
  const dateStr = gi('Date') || '';
  const matchDate = dateStr ? new Date(dateStr).toLocaleDateString('en-US',
    { weekday:'long', month:'long', day:'numeric', year:'numeric' }) : '';

  // Clean player name — strip trailing "()" or "(328)" ratings and extra whitespace
  const cleanName = s => (s||'').replace(/\s*\(\s*[^)]*\s*\)\s*$/, '').replace(/\s+/g,' ').trim();

  // Match settings from hidden inputs
  const useHandicap = gi('UseHandicapScoring') === 'True';
  const maxScore    = parseInt(gi('MaxScore')) || 1;

  // Get unique round numbers in order
  const roundNums = [...new Set(
    [...d.querySelectorAll('.game-container[data-round]')]
      .map(g => g.getAttribute('data-round'))
  )].sort((a,b) => Number(a)-Number(b));

  let out = '';
  let matchTotal1 = 0, matchTotal2 = 0;   // raw point totals for final card
  let matchWins1  = 0, matchWins2  = 0;   // total individual game wins
  let matchRoundWins1 = 0, matchRoundWins2 = 0; // rounds won (0.5 for tie)

  // Pre-calculate exact FargoRate handicap distribution across rounds
  const use8BallFargoHdcp = maxScore > 1;
  let matchHdcpByRound = {};  // rn → balls for that round
  let matchHdcpTeam = 0;      // which team receives handicap (1 or 2)
  if (use8BallFargoHdcp) {
    const maxHdcp = parseInt(gi('Division_MaximumAllowedHandicap') || '20');
    // Collect all per-game expectations across all rounds
    let totalV1 = 0.0, totalV2 = 0.0;
    roundNums.forEach(rn => {
      const games = [...d.querySelectorAll(`.game-container[data-round="${rn}"]`)];
      games.forEach(game => {
        const r1 = parseInt(game.querySelector('select.team-one-player')?.querySelector('option[selected]')?.getAttribute('data-handicap') || '0') || 0;
        const r2 = parseInt(game.querySelector('select.team-two-player')?.querySelector('option[selected]')?.getAttribute('data-handicap') || '0') || 0;
        if (r1 > 0 && r2 > 0) {
          const p = 1.0 / (1 + Math.pow(2, (r2 - r1) / 100.0));
          totalV1 += p * 10.0 + (1.0 - p) * (7.4 - 0.0062 * r2);
          totalV2 += (1.0 - p) * 10.0 + p * (7.4 - 0.0062 * r1);
        }
      });
    });
    // Floor of difference = total match handicap
    let totalHdcp = 0;
    if (totalV2 > totalV1) {
      matchHdcpTeam = 1;  // team 1 gets handicap
      totalHdcp = Math.min(Math.floor(totalV2 - totalV1), maxHdcp);
    } else if (totalV1 > totalV2) {
      matchHdcpTeam = 2;  // team 2 gets handicap
      totalHdcp = Math.min(Math.floor(totalV1 - totalV2), maxHdcp);
    }
    // Distribute last-to-first
    let remaining = totalHdcp;
    let currentRound = roundNums.length - 1;
    const rnArr = [...roundNums];
    while (remaining > 0) {
      const rn = rnArr[currentRound];
      matchHdcpByRound[rn] = (matchHdcpByRound[rn] || 0) + 1;
      remaining--;
      currentRound--;
      if (currentRound < 0) currentRound = rnArr.length - 1;
    }
  }

  roundNums.forEach(rn => {
    const games = [...d.querySelectorAll(`.game-container[data-round="${rn}"]`)];
    if (!games.length) return;

    const gameType = games[0]?.getAttribute('data-gametype') || 'SINGLES';
    const isDoubles = gameType.startsWith('D');

    let rows = '';
    let roundWins1 = 0, roundWins2 = 0;
    let roundPts1  = 0, roundPts2  = 0;




    games.forEach((game, gi_idx) => {
      // Player names — first selected option from each team's select
      const p1sel = game.querySelector('select.team-one-player');
      const p2sel = game.querySelector('select.team-two-player');
      const p1 = cleanName(p1sel?.querySelector('option[selected]')?.textContent || p1sel?.options?.[p1sel?.selectedIndex||0]?.textContent);
      const p2 = cleanName(p2sel?.querySelector('option[selected]')?.textContent || p2sel?.options?.[p2sel?.selectedIndex||0]?.textContent);

      // Scores — specifically .row-score inputs (not .row-handicap)
      const s1inp = game.querySelector('input.row-score[data-team="1"]');
      const s2inp = game.querySelector('input.row-score[data-team="2"]');
      const s1 = s1inp?.value ?? '—';
      const s2 = s2inp?.value ?? '—';
      const sv1 = parseInt(s1) || 0;
      const sv2 = parseInt(s2) || 0;
      const hasScore = s1inp !== null;

      // Winner = whoever reached maxScore or scored higher
      const w1 = hasScore && (sv1 >= maxScore || (sv1 > sv2 && sv2 < maxScore));
      const w2 = hasScore && (sv2 >= maxScore || (sv2 > sv1 && sv1 < maxScore));
      // Also check for adornment codes in raw value (TR, BR, WZ, WF = automatic win)
      const rawS1 = (s1||'').toString().toUpperCase().trim();
      const rawS2 = (s2||'').toString().toUpperCase().trim();
      const adornWin1 = ['TR','BR','WZ','WF'].includes(rawS1);
      const adornWin2 = ['TR','BR','WZ','WF'].includes(rawS2);

      if (hasScore) {
        // Count game WINS for round totals (1 per game)
        if (adornWin1 || w1) roundWins1 += 1;
        else if (adornWin2 || w2) roundWins2 += 1;
        // Sum raw POINTS for overall ball-count total (TR/BR/WZ/WF = maxScore pts)
        roundPts1 += adornWin1 ? maxScore : sv1;
        roundPts2 += adornWin2 ? maxScore : sv2;
      }

      // Break indicator — active chip = who broke
      const broke1 = game.querySelector('.break-container-1 .game-chip.break-active') !== null;
      const broke2 = game.querySelector('.break-container-2 .game-chip.break-active') !== null;

      if (isDoubles) {
        // Doubles: each game-container has 2 player-containers per side
        // Render as two sub-rows (one per player pair), score only on first row spanning both
        const p1containers = [...game.querySelectorAll('.player-container-1')];
        const p2containers = [...game.querySelectorAll('.player-container-2')];
        const p1breaks = [...game.querySelectorAll('.break-container-1 .game-chip')];
        const p2breaks = [...game.querySelectorAll('.break-container-2 .game-chip')];

        const getPlayer = (containers, idx) => {
          const sel = containers[idx]?.querySelector('select');
          return cleanName(sel?.querySelector('option[selected]')?.textContent || sel?.options?.[sel?.selectedIndex||0]?.textContent);
        };
        const getBroke = (chips, idx) => chips[idx]?.classList.contains('break-active') || false;

        const dp1a = getPlayer(p1containers, 0);
        const dp1b = getPlayer(p1containers, 1);
        const dp2a = getPlayer(p2containers, 0);
        const dp2b = getPlayer(p2containers, 1);
        const db1a = getBroke(p1breaks, 0);
        const db1b = getBroke(p1breaks, 1);
        const db2a = getBroke(p2breaks, 0);
        const db2b = getBroke(p2breaks, 1);

        const nameStyle = 'color:var(--cream);font-weight:600;font-size:14px';
        const dotStyle = (active) => `color:${active?'var(--green2)':'var(--border2)'};font-size:9px`;

        rows += `<tr>
          <td style="padding-bottom:2px">
            <div style="${nameStyle}"><span style="${dotStyle(db1a)};margin-right:5px">●</span>${dp1a}</div>
            <div style="${nameStyle}"><span style="${dotStyle(db1b)};margin-right:5px">●</span>${dp1b}</div>
          </td>
          <td class="num" style="text-align:center;font-size:17px;font-weight:700;color:${w1?'var(--green2)':w2?'var(--loss)':'var(--text2)'}">${s1}</td>
          <td style="text-align:center;color:var(--text3);font-size:18px;font-weight:300">—</td>
          <td class="num" style="text-align:center;font-size:17px;font-weight:700;color:${w2?'var(--green2)':w1?'var(--loss)':'var(--text2)'}">${s2}</td>
          <td style="text-align:right;padding-bottom:2px">
            <div style="${nameStyle}">${dp2a}<span style="${dotStyle(db2a)};margin-left:5px">●</span></div>
            <div style="${nameStyle}">${dp2b}<span style="${dotStyle(db2b)};margin-left:5px">●</span></div>
          </td>
        </tr>`;
      } else {
        // Display adornment codes as green badges
      const displayS1 = adornWin1 ? `<span style="font-size:11px;background:var(--green);color:var(--on-accent);padding:2px 6px;border-radius:4px;font-weight:700">${s1}</span>` : s1;
      const displayS2 = adornWin2 ? `<span style="font-size:11px;background:var(--green);color:var(--on-accent);padding:2px 6px;border-radius:4px;font-weight:700">${s2}</span>` : s2;
      const aw1 = adornWin1 || w1;
      const aw2 = adornWin2 || w2;

      // Accumulate ratings and per-game handicap (floor(|diff|/50) per matchup)
      const pgR1 = parseInt(game.querySelector('select.team-one-player')?.querySelector('option[selected]')?.getAttribute('data-handicap') || '0') || 0;
      const pgR2 = parseInt(game.querySelector('select.team-two-player')?.querySelector('option[selected]')?.getAttribute('data-handicap') || '0') || 0;



      rows += `<tr>
          <td style="color:var(--cream);font-weight:600">
            <span style="color:${broke1?'var(--green2)':'var(--border2)'};font-size:9px;margin-right:5px">●</span>${p1}
          </td>
          <td class="num" style="text-align:center;font-size:17px;font-weight:700;color:${aw1?'var(--green2)':aw2?'var(--loss)':'var(--text2)'}">${displayS1}</td>
          <td style="text-align:center;color:var(--text3);font-size:18px;font-weight:300">—</td>
          <td class="num" style="text-align:center;font-size:17px;font-weight:700;color:${aw2?'var(--green2)':aw1?'var(--loss)':'var(--text2)'}">${displayS2}</td>
          <td style="text-align:right;color:var(--cream);font-weight:600">
            ${p2}<span style="color:${broke2?'var(--green2)':'var(--border2)'};font-size:9px;margin-left:5px">●</span>
          </td>
        </tr>`;
      }
    });

    // Round totals:
    // 10-ball (maxScore=1): show game wins (1-3, 2-2 etc.)
    // 8-ball  (maxScore>1): show total points + round handicap
    const use8BallScoring = maxScore > 1;

    // 8-ball: FargoRate HandicapMode=2 uses floor(diff/50) per game, summed for the round
    // The lower-rated team accumulates handicap balls across all games in the round
    const maxHdcp = parseInt(gi('Division_MaximumAllowedHandicap') || '20');
    const roundHdcpAmt = use8BallScoring ? (matchHdcpByRound[rn] || 0) : 0;
    const team1GetsHdcp = use8BallScoring && matchHdcpTeam === 1 && roundHdcpAmt > 0;
    const team2GetsHdcp = use8BallScoring && matchHdcpTeam === 2 && roundHdcpAmt > 0;
    const adjPts1 = roundPts1 + (team1GetsHdcp ? roundHdcpAmt : 0);
    const adjPts2 = roundPts2 + (team2GetsHdcp ? roundHdcpAmt : 0);

    const tot1 = use8BallScoring ? adjPts1 : roundWins1;
    const tot2 = use8BallScoring ? adjPts2 : roundWins2;
    matchTotal1 += use8BallScoring ? adjPts1 : roundPts1;
    matchTotal2 += use8BallScoring ? adjPts2 : roundPts2;
    matchWins1  += Math.floor(roundWins1);
    matchWins2  += Math.floor(roundWins2);
    // Award round win for this round
    if (tot1 > tot2)       { matchRoundWins1 += 1; }
    else if (tot2 > tot1)  { matchRoundWins2 += 1; }
    else if (tot1 > 0)     { matchRoundWins1 += 0.5; matchRoundWins2 += 0.5; }
    const totW1 = Number(tot1) > Number(tot2);
    const totW2 = Number(tot2) > Number(tot1);

    // Handicap row (8-ball only, when there's an actual handicap)
    if (use8BallScoring && roundHdcpAmt > 0) {
      rows += `<tr style="background:var(--bg3);border-top:1px solid var(--border)">
        <td style="font-weight:600;color:var(--green2);font-size:12px;text-transform:uppercase;letter-spacing:.06em">Handicap</td>
        <td class="num" style="text-align:center;font-weight:700;font-size:15px;color:${team1GetsHdcp?'var(--green2)':'var(--text3)'}">
          ${team1GetsHdcp ? '+' + roundHdcpAmt : '—'}
        </td>
        <td></td>
        <td class="num" style="text-align:center;font-weight:700;font-size:15px;color:${team2GetsHdcp?'var(--green2)':'var(--text3)'}">
          ${team2GetsHdcp ? '+' + roundHdcpAmt : '—'}
        </td>
        <td></td>
      </tr>`;
    }

    // Round total row — (W) on winner's score, (T) on both if tie
    const roundWinner = totW1 ? team1 : totW2 ? team2 : null;
    const roundLabel = roundWinner
      ? `<span style="color:var(--green2);font-weight:700">${roundWinner} wins</span>`
      : `<span style="color:var(--text2);font-weight:600">Tie</span>`;
    const tag1 = totW1
      ? ` <span style="font-size:11px;font-weight:700;color:var(--green2)">(W)</span>`
      : (!totW2 ? ` <span style="font-size:11px;font-weight:600;color:var(--text2)">(T)</span>` : '');
    const tag2 = totW2
      ? ` <span style="font-size:11px;font-weight:700;color:var(--green2)">(W)</span>`
      : (!totW1 ? ` <span style="font-size:11px;font-weight:600;color:var(--text2)">(T)</span>` : '');
    rows += `<tr style="background:var(--bg);border-top:2px solid var(--accent)">
      <td style="font-weight:700;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.06em">Round ${rn} Total</td>
      <td class="num" style="text-align:center;font-weight:800;font-size:18px;color:${totW1?'var(--green2)':totW2?'var(--loss)':'var(--text2)'}">${tot1}${tag1}</td>
      <td></td>
      <td class="num" style="text-align:center;font-weight:800;font-size:18px;color:${totW2?'var(--green2)':totW1?'var(--loss)':'var(--text2)'}">${tot2}${tag2}</td>
      <td style="font-size:11px;text-align:right">${roundLabel}</td>
    </tr>`;

    out += `<div class="card" style="margin-bottom:12px">
      <div class="card-header">
        <span class="card-title">Round ${rn}${isDoubles?' <span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:6px">Doubles</span>':''}</span>
        <span class="card-meta">${games.length} game${games.length!==1?'s':''}</span>
      </div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          <th>${team1}</th>
          <th style="text-align:center">Score</th>
          <th style="text-align:center;width:30px"></th>
          <th style="text-align:center">Score</th>
          <th style="text-align:right">${team2}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  });

  if (!out) {
    out = `<div class="card"><div style="padding:20px;color:var(--text2)">
      No match data found. <a href="https://lms.fargorate.com/PublicReport/MatchResultBCAPL?matchId=${gi('Id')}"
      target="_blank" style="color:var(--brass);font-weight:600">Open the scoresheet ↗</a>
    </div></div>`;
  }

  const use8BallFinal = maxScore > 1;

  // 5th point: total points (balls/games) across all rounds — can tie
  if (matchTotal1 > matchTotal2)      { matchRoundWins1 += 1; }
  else if (matchTotal2 > matchTotal1) { matchRoundWins2 += 1; }
  else if (matchTotal1 > 0)           { matchRoundWins1 += 0.5; matchRoundWins2 += 0.5; }
  const fin1 = use8BallFinal ? matchTotal1 : matchWins1;
  const fin2 = use8BallFinal ? matchTotal2 : matchWins2;
  const rw1str = matchRoundWins1 % 1 === 0 ? String(matchRoundWins1) : matchRoundWins1.toFixed(1);
  const rw2str = matchRoundWins2 % 1 === 0 ? String(matchRoundWins2) : matchRoundWins2.toFixed(1);
  const rwWin1 = matchRoundWins1 > matchRoundWins2;
  const rwWin2 = matchRoundWins2 > matchRoundWins1;
  const mw1 = fin1 > fin2;
  const mw2 = fin2 > fin1;
  const matchResult = rwWin1 ? `${team1} wins` : rwWin2 ? `${team2} wins` : 'Tie';

  // (W)/(T) tags for total games row
  const finTag1 = mw1
    ? ` <span style="font-size:13px;font-weight:700;color:var(--green2)">(W)</span>`
    : (!mw2 ? ` <span style="font-size:13px;font-weight:600;color:var(--text2)">(T)</span>` : '');
  const finTag2 = mw2
    ? ` <span style="font-size:13px;font-weight:700;color:var(--green2)">(W)</span>`
    : (!mw1 ? ` <span style="font-size:13px;font-weight:600;color:var(--text2)">(T)</span>` : '');

  out += `<div class="card" style="margin-top:4px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px">
      <span style="font-weight:700;color:var(--cream);font-size:15px">${team1}</span>
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:26px;font-weight:800;color:${mw1?'var(--green2)':mw2?'var(--loss)':'var(--text2)'}">${fin1}${finTag1}</span>
        <span style="color:var(--text3);font-size:11px;font-weight:600;text-align:center;line-height:1.3">TOTAL<br>GAMES</span>
        <span style="font-size:26px;font-weight:800;color:${mw2?'var(--green2)':mw1?'var(--loss)':'var(--text2)'}">${fin2}${finTag2}</span>
      </div>
      <span style="font-weight:700;color:var(--cream);font-size:15px">${team2}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px 14px;border-top:1px solid var(--border)">
      <span style="font-size:12px;color:var(--text3)"></span>
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:26px;font-weight:800;color:${rwWin1?'var(--green2)':rwWin2?'var(--loss)':'var(--text2)'}">${rw1str}</span>
        <span style="color:var(--text3);font-size:11px;font-weight:600;text-align:center;line-height:1.3">ROUNDS<br>WON</span>
        <span style="font-size:26px;font-weight:800;color:${rwWin2?'var(--green2)':rwWin1?'var(--loss)':'var(--text2)'}">${rw2str}</span>
      </div>
      <span style="font-size:12px;color:var(--text3)"></span>
    </div>
    <div style="padding:0 20px 14px;text-align:center;font-size:12px;color:${rwWin1||rwWin2?'var(--green2)':'var(--text3)'};font-weight:600;letter-spacing:.05em;text-transform:uppercase">
      ${matchResult}
    </div>
  </div>`;

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-header">
        <span class="card-title" style="color:var(--cream);font-size:16px">${team1} vs ${team2}</span>
        <span class="card-meta">${matchDate}</span>
      </div>
      <div style="padding:10px 20px;font-size:12px;color:var(--text3);border-top:1px solid var(--border)">
        <span style="color:var(--green2);font-size:10px;margin-right:4px">●</span> Green dot = that player breaks
        &nbsp;·&nbsp; BR = Break &amp; Run &nbsp;·&nbsp; TR = Table Run &nbsp;·&nbsp; WZ = Win-zip &nbsp;·&nbsp; WF = Win by Forfeit
      </div>
    </div>
    ${out}`;
}

function notice(msg) {
  return `<div class="notice">${msg}</div>`;
}

/* ── Team Detail ── */
async function loadTeamDetail(teamId, teamName) {
  inDrillDown = true;
  const url = `https://lms.fargorate.com/PublicReport/DivisionTeamReportBCAPL?teamId=${teamId}`;
  document.getElementById('content').innerHTML =
    `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Loading ${teamName}…</div></div>`;
  try {
    const r = await fetch(PROXY + encodeURIComponent(url));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    document.getElementById('content').innerHTML = renderTeamDetail(html, teamName);
  } catch(e) {
    document.getElementById('content').innerHTML = notice(`Could not load team detail: ${e.message}`);
  }
}

function renderTeamDetail(html, teamName) {
  const d = document.createElement('div');
  d.innerHTML = html;

  const table = d.querySelector('table');
  if (!table) return notice('No team data found.');

  const allRows = [...table.querySelectorAll('tr')];

  // ── Step 1: find the header row that names the stat columns ──────────────
  // FargoRate puts week columns first, then summary stats at the far right.
  // We scan RIGHT-TO-LEFT so we find the summary stats, not the week opponent names.
  const knownStatCols = ['games played','games won','win percentage','player points',
                          'opp. points','opp points','break & run','break run',
                          'table run','weeks played','opp. run','played','won',
                          'win%','win pct','pct','pts','br','tr','wks','weeks'];
  let colMap = {};
  let playerHeaderRowIdx = -1;

  allRows.forEach((row, ri) => {
    const cells = [...row.querySelectorAll('th,td')];
    const texts = cells.map(c => c.textContent.replace(/\s+/g,' ').trim().toLowerCase());
    const matchCount = texts.filter(t => knownStatCols.some(k => t === k || t.includes(k))).length;
    if (matchCount >= 3 && playerHeaderRowIdx === -1) {
      playerHeaderRowIdx = ri;
      // Scan RIGHT-TO-LEFT so summary stats win over week column labels
      for (let ci = texts.length - 1; ci >= 0; ci--) {
        const t = texts[ci];
        if ((t.includes('games played') || t === 'played') && colMap.played === undefined) colMap.played = ci;
        if ((t.includes('games won') || (t.includes('won') && !t.includes('rounds') && !t.includes('opp'))) && colMap.won === undefined) colMap.won = ci;
        if ((t.includes('win percentage') || t.includes('win pct') || t.includes('win%') || t === 'pct') && colMap.winPct === undefined) colMap.winPct = ci;
        if ((t.includes('player points') || t === 'pts' || t === 'points') && colMap.pts === undefined) colMap.pts = ci;
        if ((t.includes('opp. points') || t.includes('opp points') || (t.includes('opp') && !t.includes('run'))) && colMap.opp === undefined) colMap.opp = ci;
        if ((t === 'br' || t.includes('break & run') || t.includes('break run')) && colMap.br === undefined) colMap.br = ci;
        if ((t === 'tr' || t.includes('table run')) && colMap.tr === undefined) colMap.tr = ci;
        if ((t.includes('weeks played') || t === 'wks' || (t.includes('week') && !t.includes('played') === false)) && colMap.weeks === undefined) colMap.weeks = ci;
      }
    }
  });

  // Fallback: if header detection failed, use end-offsets
  const useFallback = Object.keys(colMap).length < 3;

  // ── Step 2: find week-date header row ─────────────────────────────────────
  // FargoRate rotates month+day headers. They appear as "MAY\n27" or "MAY 27".
  const isDateToken = t => /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[\s\n]\d+/i.test(t.trim());
  let weekDates = [];
  let weekColStart = -1;   // first column index that is a date
  let weekColEnd   = -1;   // last column index that is a date

  allRows.forEach(row => {
    const cells = [...row.querySelectorAll('th,td')];
    const texts = cells.map(c => c.textContent.replace(/\s+/g,' ').trim());
    if (weekDates.length) return; // already found
    const dateIdxs = texts.map((t,i) => isDateToken(t) ? i : -1).filter(i => i >= 0);
    if (dateIdxs.length >= 1) {
      weekDates = dateIdxs.map(i => texts[i]);
      weekColStart = dateIdxs[0];
      weekColEnd   = dateIdxs[dateIdxs.length - 1];
    }
  });

  // ── Step 3: classify every data row ───────────────────────────────────────
  // Stat label pattern — broaden to catch anything FargoRate might use
  const statLabelRe = /^(match\s*points?|opp\.?(\s*pts?)?|rounds?\s*won|rounds?\s*lost|win\s*[\/\-]?\s*loss|w\s*\/\s*l|points?|games?(\s*won)?|score|result)/i;

  const playerRows = [];
  const statRows   = [];

  // Skip known non-player row labels
  const skipRowLabels = /^(week|location|name|date|home|away|bye|stat|team|round|division|points?)$/i;

  // Player detection: primary signal is <td class="heavy"> on the name cell
  // Fallback: two+ word name-like string not matching stat labels
  const isPlayerRow = (row, firstText) => {
    const nameCell = row.querySelector('td.heavy, th.heavy');
    if (nameCell) {
      const t = nameCell.textContent.trim();
      // Exclude known stat/section labels
      if (skipRowLabels.test(t) || statLabelRe.test(t)) return false;
      // Must look like a name (letters, spaces, hyphens, apostrophes)
      if (/^[A-Za-zÀ-ÖØ-öø-ÿ'][\w\sÀ-ÖØ-öø-ÿ'\-]{1,}$/.test(t)) return true;
    }
    // Fallback: two+ word string
    if (!firstText || skipRowLabels.test(firstText) || statLabelRe.test(firstText)) return false;
    return /^[A-Za-zÀ-ÖØ-öø-ÿ][\w\sÀ-ÖØ-öø-ÿ'\-,]{2,}$/.test(firstText.trim()) &&
           /\s/.test(firstText.trim());
  };

  allRows.forEach((row, ri) => {
    // Skip the detected header row, but always process if no header was found
    if (playerHeaderRowIdx >= 0 && ri === playerHeaderRowIdx) return;
    const cells = [...row.querySelectorAll('td,th')];
    if (!cells.length) return;
    // Normalize whitespace in first cell (FargoRate uses double spaces)
    const first = cells[0]?.textContent.replace(/\s+/g, ' ').trim();
    if (!first) return;

    if (statLabelRe.test(first)) {
      // Stat row: grab week-column values
      let values;
      if (weekColStart >= 0) {
        values = cells.slice(weekColStart, weekColEnd + 1).map(c => c.textContent.trim());
      } else {
        values = cells.slice(1).map(c => c.textContent.trim());
      }
      statRows.push({ label: first, values });

    } else if (isPlayerRow(row, first)) {
      // Player row — map by header names when available, fallback to end-offsets
      const vals = cells.map(c => c.textContent.trim());
      const len  = vals.length;
      const get  = (key, fallbackOffset) =>
        colMap[key] !== undefined ? (vals[colMap[key]] || '-') : (vals[len + fallbackOffset] || '-');

      playerRows.push({
        name:    vals[0].replace(/\s+/g, ' ').trim(),
        gPlayed: get('played', -8),
        gWon:    get('won',    -7),
        winPct:  get('winPct', -6),
        pts:     get('pts',    -5),
        oppPts:  get('opp',    -4),
        br:      get('br',     -3),
        tr:      get('tr',     -2),
        weeks:   get('weeks',  -1),
      });
    }
  });

  // ── Render ────────────────────────────────────────────────────────────────
  return `
    <div style="margin-bottom:12px">
      <button onclick="switchView('teams')" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
        ← Back to Teams
      </button>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <span class="card-title" style="font-size:18px;color:var(--cream)">${teamName}</span>
        <span class="card-meta">${DIVISIONS[league].label}</span>
      </div>

      ${playerRows.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          <th>Player</th><th>Played</th><th>GMS WON</th><th>Win %</th>
          <th>Pts</th><th>Opp Pts</th><th>BR</th><th>TR</th><th>Wks</th>
        </tr></thead>
        <tbody>
          ${playerRows.map(p => {
            const pv = parseFloat(p.winPct)||0;  // works whether value is "48%" or "48" or "0.48"
            const pvNorm = pv > 1 ? pv : pv * 100; // normalise to 0-100 for bar width
            const pvStr = p.winPct.includes('%') ? p.winPct : pvNorm.toFixed(0) + '%';
            return `<tr>
              <td style="font-weight:500;color:var(--cream)">${p.name}</td>
              <td class="num" style="color:var(--text2)">${p.gPlayed}</td>
              <td class="num" style="color:var(--text2)">${p.gWon}</td>
              <td><div class="bar-wrap">
                <div class="bar-track" style="width:60px"><div class="bar-fill" style="width:${pvNorm}%;background:${winColor(pvNorm+'%')}"></div></div>
                <span class="num" style="font-size:13px;color:${winColor(pvNorm+'%')};font-weight:600">${pvStr}</span>
              </div></td>
              <td class="num" style="color:var(--text2)">${p.pts}</td>
              <td class="num" style="color:var(--text2)">${p.oppPts}</td>
              <td class="num" style="color:${parseInt(p.br)>0?'var(--green2)':'var(--text2)'}">${p.br}</td>
              <td class="num" style="color:${parseInt(p.tr)>0?'var(--green2)':'var(--text2)'}">${p.tr}</td>
              <td class="num" style="color:var(--text2)">${p.weeks}</td>
            </tr>`;
          }).join('')}
        </tbody>
