      </table></div>` : '<div style="padding:20px;color:var(--text3);font-size:13px">No player data detected.</div>'}
    </div>

    ${statRows.length ? `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Season Record</span>
        <span class="card-meta">${weekDates.length} week${weekDates.length!==1?'s':''} scheduled</span>
      </div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          <th style="min-width:140px">Stat</th>
          ${weekDates.map(w => `<th style="text-align:center;min-width:52px;white-space:nowrap">${w}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${statRows.map(r => `<tr>
            <td style="font-weight:500;color:var(--cream)">${r.label}</td>
            ${r.values.map(v => {
              const isWL  = /win|w\/l|result/i.test(r.label);
              const isW   = isWL && /^w$/i.test(v);
              const isL   = isWL && /^l$/i.test(v);
              const color = isW ? 'var(--green2)' : isL ? 'var(--loss)' : 'var(--text2)';
              return `<td class="num" style="text-align:center;color:${color};font-weight:${isW||isL?'700':'400'}">${v||'—'}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>` : ''}
  `;
}

async function submitSuggestion() {
  const btn    = document.getElementById('sg-submit');
  const status = document.getElementById('sg-status');
  const say = (msg, color) => { status.textContent = msg; status.style.color = color; };

  const message = document.getElementById('sg-message').value.trim();
  if (message.length < 5) {
    say('Please enter a suggestion first.', 'var(--loss)');
    document.getElementById('sg-message').focus();
    return;
  }

  btn.disabled = true;
  say('Sending…', 'var(--text3)');

  try {
    const r = await fetch('/suggest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:    document.getElementById('sg-name').value,
        email:   document.getElementById('sg-email').value,
        website: document.getElementById('sg-website').value,  // honeypot
        message,
      }),
    });
    const data = await r.json().catch(() => ({}));

    if (r.ok && data.ok) {
      ['sg-name','sg-email','sg-message'].forEach(id => document.getElementById(id).value = '');
      say('Thanks — your suggestion was sent.', 'var(--green2)');
      btn.disabled = false;
    } else {
      say(data.error || 'Something went wrong. Please try again.', 'var(--loss)');
      btn.disabled = false;
    }
  } catch(e) {
    say('Could not connect. Please try again.', 'var(--loss)');
    btn.disabled = false;
  }
}

const PAGE_TABS = [];   // every tab here is a league now; Events has its own page          // not leagues, so no standings views

/* Title, subtitle and the printable-sheet link all follow the tab. */
const LEAGUE_HD = {
  '10ball': { title: '10-Ball Summer 2026', eyebrow: 'Playing now',
              sub: 'Standings, players and the schedule.' },
  '8ball':  { title: '8-Ball Fall 2025\u201326', eyebrow: 'Season ended',
              sub: 'Last winter\u2019s league, start to finish.' },
};

function switchLeague(lg) {
  league = lg;
  ['10ball','8ball'].forEach(k => {
    const el = document.getElementById(`ltab-${k}`);
    if (!el) return;
    el.classList.toggle('active', k === lg);
    if (!PAGE_TABS.includes(k)) {
      el.classList.toggle('inactive-league', k !== lg && !PAGE_TABS.includes(lg));
    }
  });

  const hd = LEAGUE_HD[lg];
  if (hd) {
    document.getElementById('lg-title').textContent = hd.title;
    document.getElementById('lg-eyebrow').textContent = hd.eyebrow;
    document.getElementById('lg-sub').textContent = hd.sub;
    document.title = hd.title + ' \u2014 Kemmerer Pool League';
  }

  // Events has no standings, so neither the view bar nor the print
  // sheet mean anything there.
  const isLeague = !PAGE_TABS.includes(lg);
  document.querySelector('.view-bar').style.display = isLeague ? '' : 'none';
  const pl = document.getElementById('print-link');
  if (pl && isLeague) pl.href = 'schedule.html?league=' + lg;

  try { history.replaceState(null, '', '?lg=' + lg); } catch (e) {}

  cache = {};
  loadView();
}
function switchView(vw) {
  view = vw;
  ['teams','players','byteam','list','schedule'].forEach(k => document.getElementById(`vt-${k}`).classList.toggle('active', k===vw));
  loadView();
}

async function loadView() {
  inDrillDown = false;
  document.getElementById('content').innerHTML =
    `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Loading…</div></div>`;
  const data = await fetchSection(league, view);
  let html = '';
  if      (view==='teams')    html = renderTeams(data);
  else if (view==='players')  html = renderPlayers(data);
  else if (view==='byteam')   html = renderByTeam(data);
  else if (view==='list')     html = renderList(data);
  else if (view==='schedule') html = renderSchedule(data);
  document.getElementById('content').innerHTML = html;
  if (view === 'schedule') scrollToNextMatch();
}

// Jump to the next upcoming date so the schedule doesn't open on old weeks.
function scrollToNextMatch() {
  const el = document.getElementById('sched-next');
  if (!el) return;                       // season over, or nothing upcoming
  if (el.previousElementSibling === null) return;  // already at the top
  const bar = document.querySelector('.view-bar');
  const offset = (bar ? bar.offsetHeight : 0) + 12;
  const y = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top: Math.max(y, 0), behavior: 'smooth' });
}

/* Which league to open on comes from the link that got you here. */
(function boot() {
  const want = new URLSearchParams(location.search).get('lg');
  /* ?lg=events used to be a tab here. It has its own page now. */
  if (want === 'events') { location.replace('events.html'); return; }
  switchLeague(['10ball', '8ball'].includes(want) ? want : '10ball');
})();
