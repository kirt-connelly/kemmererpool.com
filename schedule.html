<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedule — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brass:     #d4a13c;
      --bone:      #f4efe4;
      --bg:        #14100c;
      --bg2:       #1d1712;
      --bg3:       #251d15;
      --bg4:       #31261b;
      --border:    #33291f;
      --border2:   #473829;
      --text:      #f4efe4;
      --text2:     #b7ab99;
      --text3:     #8d8172;
      --accent:    #d4a13c;
      --cream:     #f4efe4;
      --green:     #2f8a63;
      --green2:    #4fae86;
      --on-accent: #201910;
      --radius:    6px;
      --radius-sm: 4px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Barlow', system-ui, sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; line-height: 1.55; font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }

    .lamp {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(120vw 70vh at 50% -18vh, rgba(212,161,60,.16), transparent 62%),
        radial-gradient(70vw 46vh at 50% -6vh, rgba(212,161,60,.10), transparent 60%);
    }
    /* `header` sets its own position and z-index below; it must not get
       a competing `position` from a shared rule. */
    footer { position: relative; z-index: 1; }
    main { position: relative; z-index: 0; }

    /* ── Masthead ───────────────────────────────────────────────── */
    header {
      background: rgba(20,16,12,.86);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid rgba(212,161,60,.15);
      position: sticky; top: 0; z-index: 40;
    }
    .mast-in { display: flex; align-items: center; gap: 24px; height: 62px; }
    .mark { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
    .mark .eight {
      width: 27px; height: 27px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: radial-gradient(circle at 33% 27%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%), #100d0a;
      box-shadow: inset -3px -4px 7px rgba(0,0,0,.6);
    }
    .mark .eight span {
      width: 12px; height: 12px; border-radius: 50%; background: var(--bone);
      font: 700 8px/12px 'Space Mono', monospace; color: #100d0a; text-align: center;
    }
    .mark b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; color: var(--bone); white-space: nowrap; }
    .mast-nav { margin-left: auto; display: flex; gap: 4px; }
    .mast-nav a {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--text3);
      text-decoration: none; padding: 8px 12px; border-radius: 4px;
    }
    .mast-nav a:hover { color: var(--bone); background: rgba(244,239,228,.06); }

    /* ── Rail diamonds ──────────────────────────────────────────── */
    .rail-rule {
      display: flex; align-items: center; justify-content: center; gap: 46px;
      height: 26px; position: relative;
    }
    .rail-rule::before {
      content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,161,60,.22) 12%,
                  rgba(212,161,60,.22) 88%, transparent);
    }
    .rail-rule i {
      width: 7px; height: 7px; background: var(--brass); opacity: .5;
      transform: rotate(45deg); position: relative; flex: none;
    }

    /* ── Page head ──────────────────────────────────────────────── */
    /* Longhand. This page head carries .wrap on league.html, and a
       `padding:` shorthand here wipes .wrap's `0 24px` — which put the
       whole head flush against the edge of the phone. */
    .page-hd { padding-top: 26px; }
    .eyebrow {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--brass);
    }
    .page-hd h1 {
      font-size: clamp(26px, 4vw, 38px); font-weight: 700;
      letter-spacing: -.02em; line-height: 1.1; margin: 9px 0 0; color: var(--bone);
    }
    .page-hd .sub { color: var(--text3); font-size: 15px; margin-top: 7px; }

  /* ── The schedule ──
     Each week is a block with its date as a header, so the date never eats a
     column of width — which is what made this unreadable on a phone. Matches
     line up in a grid on a wide screen and fold onto two lines on a narrow one. */
  .page { max-width: 900px; margin: 0 auto; padding: 0 24px 50px; }

  .acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 22px 0 18px; }
  .act {
    display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    padding: 10px 15px; border-radius: 4px; cursor: pointer; text-decoration: none;
    border: 1px solid var(--border); background: rgba(244,239,228,.07); color: var(--text3);
    box-shadow: inset 0 1px 0 rgba(244,239,228,.06);
    white-space: nowrap; transition: color .15s, border-color .15s, background .15s;
  }
  .act:hover { background: rgba(244,239,228,.13); color: var(--bone); border-color: var(--border2); }
  .act.primary { border-color: rgba(212,161,60,.6); background: rgba(212,161,60,.2); color: var(--brass); }
  .act.primary:hover { background: rgba(212,161,60,.3); color: var(--bone); }

  /* Weeks sit on cloth, the way the fixtures do on the front page. */
  .week {
    position: relative; border: 1px solid rgba(244,239,228,.12); border-radius: 5px;
    background: rgba(0,0,0,.18); overflow: hidden; margin-bottom: 12px;
  }
  .week-hdr {
    display: flex; align-items: baseline; gap: 12px; padding: 11px 16px;
    background: rgba(0,0,0,.28); border-bottom: 1px solid rgba(244,239,228,.1);
  }
  .wkno {
    font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--text3);
  }
  .wkdate { font-size: 16px; font-weight: 700; color: var(--cream); letter-spacing: -.01em; }
  .pill {
    margin-left: auto; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px;
    background: rgba(212,161,60,.16); border: 1px solid rgba(212,161,60,.5); color: var(--brass);
  }

  /* The next week to be played is the one you came for, so it gets the
     cloth and a brass edge. Everything else stays quiet. */
  .week.next {
    border-color: rgba(212,161,60,.42);
    background: linear-gradient(180deg, rgba(28,81,66,.42), rgba(16,46,38,.55));
  }
  .week.next::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .45;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px);
  }
  .week.next .week-hdr { background: rgba(11,33,27,.72); border-bottom-color: rgba(212,161,60,.28); }
  .week.next .wkdate { color: var(--bone); }
  .week.next .match { position: relative; z-index: 1; }

  .match {
    display: grid; grid-template-columns: 1fr 40px 1fr 170px; align-items: center;
    gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid rgba(244,239,228,.08);
    font-size: 16px;
  }
  .match:last-child { border-bottom: none; }
  .side { color: var(--cream); font-weight: 600; min-width: 0; }
  .home { text-align: right; }
  .away { text-align: left; }
  /* Same ball that separates the fixtures on the front page. */
  .vs {
    justify-self: center; width: 27px; height: 27px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 33% 27%, rgba(255,255,255,.30), rgba(255,255,255,0) 45%), #100d0a;
    box-shadow: inset -2px -3px 6px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.45);
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; color: var(--brass);
  }
  .at {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text3); text-align: right;
  }

  /* Weeks already played stay readable but recede. */
  .week.past .wkdate { color: var(--text2); }
  .week.past .side { color: var(--text2); font-weight: 500; }
  .week.past .vs { opacity: .5; }

  @media (max-width: 620px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .page { padding: 0 16px 36px; }
    .page-hd { padding-top: 20px; }
    .acts { padding: 16px 0 14px; }
    .act { flex: 1; justify-content: center; padding: 10px 8px; font-size: 10px; letter-spacing: .08em; }
    /* Teams on one line, the bar beneath — nothing gets squeezed. */
    .match { grid-template-columns: 1fr 32px 1fr; gap: 5px 8px; padding: 11px 13px; font-size: 15px; }
    .vs { width: 24px; height: 24px; font-size: 8.5px; }
    /* The bar sits under the pairing, centred on it rather than adrift on the left. */
    .at { grid-column: 1 / -1; text-align: center; margin-top: 1px; }
    .mast-in { height: auto; flex-direction: column; justify-content: center;
               gap: 2px; padding-top: 9px; padding-bottom: 7px; }
    .mark b { font-size: 14px; }
    .mast-nav { margin-left: 0; flex-wrap: wrap; justify-content: center; }
    .mast-nav a { padding: 6px 8px; letter-spacing: .06em; font-size: 10px; }
    .rail-rule { gap: 26px; }
    .wkdate { font-size: 15px; }
  }

  .msg { padding: 44px 20px; text-align: center; color: var(--text3); font-size: 15px; }
  footer {
    border-top: 1px solid rgba(244,239,228,.1); background: var(--bg2);
    padding: 24px 0; text-align: center; font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--text3); letter-spacing: .06em; margin-top: 30px;
  }
  footer a { color: var(--text2); text-decoration: none; }
  footer a:hover { color: var(--brass); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 3px;
  }

  /* ── Print ──
     This is the sheet that goes on the wall at the bar, so it prints
     black on white with no screen furniture, and a week never splits
     across a page. */
  @media print {
    html, body { background: #fff; color: #000; font-size: 10.5pt; }
    .lamp, .acts, .rail-rule, .mast-nav, .pill, footer { display: none !important; }
    header {
      position: static; background: none; backdrop-filter: none;
      border-bottom: 2px solid #000; padding: 0;
    }
    .mast-in { height: auto; padding: 0 0 6px; }
    .mark .eight { display: none; }
    .mark b { color: #000; font-size: 11pt; }
    .wrap, .page { max-width: none; padding: 0; }
    .page-hd { padding: 10px 0 12px; }
    .page-hd h1 { font-size: 16pt; color: #000; margin: 2px 0 0; }
    .eyebrow { color: #444; font-size: 8pt; letter-spacing: .14em; }
    .page-hd .sub { color: #444; font-size: 9pt; }

    .week {
      border: none; border-top: 1.5px solid #888; border-radius: 0; background: none !important;
      margin-bottom: 0; break-inside: avoid; page-break-inside: avoid;
    }
    .week.next::after { display: none; }
    .week-hdr { background: none !important; border-bottom: 1px solid #ccc; padding: 5px 0 3px; }
    .wkno, .wkdate { color: #000 !important; font-size: 10pt; }
    .match {
      padding: 3px 0; border-bottom: none; font-size: 9.5pt;
      grid-template-columns: 1fr 34px 1fr 160px; gap: 4px 10px;
    }
    .side { color: #000 !important; font-weight: 500; }
    .week.past .side { color: #444 !important; }
    /* The ball is a background gradient, and browsers drop those when
       printing — so it prints as the word instead. */
    .vs {
      background: none !important; box-shadow: none !important; color: #000 !important;
      width: auto; height: auto; font-size: 8pt;
    }
    .at { color: #000 !important; font-size: 8.5pt; letter-spacing: .06em; }
  }

    @media (max-width: 360px) {
      .mast-nav a { padding: 5px 6px; font-size: 9.5px; letter-spacing: .04em; }
    }
</style>
</head>
<body>

<div class="lamp" aria-hidden="true"></div>

<header>
  <div class="wrap mast-in">
    <a class="mark" href="index.html">
      <span class="eight" aria-hidden="true"><span>8</span></span>
      <b>Kemmerer Pool League</b>
    </a>
    <nav class="mast-nav">
      <a href="index.html#leagues">Leagues</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="index.html#rooms">Bars</a>
      <a href="index.html#officers">Contact</a>
    </nav>
  </div>
</header>

<div class="wrap"><div class="rail-rule" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

<main>
<div class="page">
  <div class="page-hd">
    <div class="eyebrow">Wednesday nights</div>
    <h1 id="lg-title">Schedule</h1>
    <div class="sub" id="lg-sub">Every week of the season, start to finish.</div>
  </div>

  <!-- Only what you can't get from the masthead: the other league's
       sheet, and the print button. -->
  <div class="acts">
    <a class="act" id="other-link" href="#">Other schedule</a>
    <button class="act primary" onclick="window.print()">Print</button>
  </div>

  <div id="board"><div class="msg">Loading the schedule&hellip;</div></div>
</div>
</main>

<footer>
  <div class="wrap"><a href="index.html">Kemmerer Pool League</a> &nbsp;&middot;&nbsp; schedule v2.07</div>
</footer>

<script>
const PROXY = '/proxy?url=';
const BASE  = 'https://lms.fargorate.com/PublicReport';

const DIVISIONS = {
  '10ball': { id: 'c97cf1bf-ff08-44a0-b916-b4520124b3e6', label: '10-Ball 2026' },
  '8ball':  { id: '1dc8b2aa-62eb-41a6-a8f6-b379014efe83', label: '8-Ball 25-26' },
};

const league = (new URLSearchParams(location.search).get('league') || '10ball');
const div = DIVISIONS[league] || DIVISIONS['10ball'];

const other = league === '8ball' ? '10ball' : '8ball';

document.getElementById('lg-title').textContent = div.label + ' Schedule';
document.getElementById('lg-sub').textContent =
  'Every week of the season, start to finish. Print it for the wall.';
document.title = div.label + ' Schedule \u2014 Kemmerer Pool League';
document.getElementById('other-link').href = 'schedule.html?league=' + other;
document.getElementById('other-link').textContent = DIVISIONS[other].label;

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* FargoRate returns the schedule as an HTML fragment, grouped by date. Each
   date is followed by one block per match, carrying both teams and the bar. */
function parseSchedule(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const container = d.querySelector('#schedule-list') || d;
  const weeks = [];
  let cur = null;

  [...container.children].forEach(node => {
    if (node.classList.contains('schedule-date')) {
      cur = { date: node.textContent.trim(), matches: [] };
      weeks.push(cur);
    } else if (node.classList.contains('schedule-team-block') && cur) {
      const teams = [...node.querySelectorAll('.schedule-team')]
        .map(s => s.textContent.trim().replace(/^\(H\)\s*|\(A\)\s*/g, '').trim());
      const loc = node.querySelector('.schedule-location');
      const venue = loc ? loc.textContent.trim() : '';
      if (teams.length >= 2) cur.matches.push({ home: teams[0], away: teams[1], venue });
    }
  });
  return weeks.filter(w => w.matches.length);
}

function parseDate(str) {
  const m = String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function fmtDate(str) {
  const d = parseDate(str);
  if (!d) return str;
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function render(weeks) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const nextIdx = weeks.findIndex(w => {
    const d = parseDate(w.date);
    return d && d >= today;
  });

  document.getElementById('board').innerHTML = weeks.map((w, wi) => {
    const d = parseDate(w.date);
    const past = d && d < today;
    const next = wi === nextIdx;
    return `<section class="week${past ? ' past' : ''}${next ? ' next' : ''}"${next ? ' id="next-week"' : ''}>
      <header class="week-hdr">
        <span class="wkno">Week ${wi + 1}</span>
        <span class="wkdate">${esc(fmtDate(w.date))}</span>
        ${next ? '<span class="pill">Next up</span>' : ''}
      </header>
      ${w.matches.map(m => `<div class="match">
        <span class="side home">${esc(m.home)}</span>
        <span class="vs" aria-hidden="true">VS</span>
        <span class="side away">${esc(m.away)}</span>
        <span class="at">${esc(m.venue)}</span>
      </div>`).join('')}
    </section>`;
  }).join('');

  // Land on the next week to be played rather than the top of the season.
  const el = document.getElementById('next-week');
  if (el && el.scrollIntoView) {
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }
}

function fail(msg) {
  document.getElementById('board').innerHTML = `<div class="msg">${esc(msg)}</div>`;
}

(async function load() {
  try {
    const r = await fetch(PROXY + encodeURIComponent(`${BASE}/GenerateDivisionScheduleReport`), {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `divisionId=${div.id}`,
    });
    if (!r.ok) throw new Error(r.status);
    const weeks = parseSchedule(await r.text());
    if (!weeks.length) { fail('No schedule has been posted for this division yet.'); return; }
    render(weeks);
  } catch (e) {
    fail('Could not load the schedule. Try again in a moment.');
  }
})();
</script>
</body>
</html>
