<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kemmerer Pool League</title>
  <meta name="description" content="Official standings, player stats, and schedule for the Kemmerer Pool League." />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #1c2030;
      --bg2:     #242838;
      --bg3:     #2c3248;
      --bg4:     #323850;
      --border:  #3a4260;
      --border2: #4a5478;
      --text:    #f0f4ff;
      --text2:   #9aa8cc;
      --text3:   #5a6888;
      --accent:  #4d8fcc;
      --accent2: #6aaee8;
      --green:   #2a9d6f;
      --green2:  #34c487;
      --red:     #c45a5a;
      --felt:    repeating-linear-gradient(90deg,#1a5c32 0px,#154d28 3px,#1a5c32 6px);
      --radius:  10px;
      --radius-sm: 6px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; font-size: 15px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .felt-strip { height: 4px; background: var(--felt); }

    /* ── Header ── */
    header { background: var(--bg2); border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 0; gap: 16px; flex-wrap: wrap; }
    .logo-block { display: flex; align-items: center; gap: 14px; }
    .pool-balls { display: flex; gap: 5px; }
    .league-name { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    .league-sub { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
    .live-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 12px; font-size: 11px; font-weight: 600; letter-spacing: .03em; }
    .live-pill.live { background: rgba(52,196,135,.12); border: 1px solid rgba(52,196,135,.3); color: var(--green2); }
    .live-pill.demo { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
    .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .live-pill.live .dot { background: var(--green2); }
    .live-pill.demo .dot { background: var(--text3); }

    /* ── League tabs ── */
    .league-tabs { display: flex; gap: 3px; padding-top: 16px; }
    .ltab { padding: 9px 22px; cursor: pointer; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm) var(--radius-sm) 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text2); transition: all .15s; }
    .ltab:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .ltab.active { background: var(--bg); color: var(--text); border-color: var(--border); border-bottom-color: var(--bg); position: relative; bottom: -1px; font-weight: 600; }
    .ltab .badge { font-size: 9px; background: var(--green); color: #fff; border-radius: 99px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; font-weight: 600; }

    /* ── View tabs ── */
    .view-bar { background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .view-bar-inner { display: flex; gap: 2px; padding: 8px 0; }
    .vtab { padding: 7px 16px; cursor: pointer; font-size: 14px; font-weight: 400; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); transition: all .12s; }
    .vtab:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .vtab.active { background: var(--bg3); color: var(--text); font-weight: 600; border-left: 2px solid var(--accent2); padding-left: 14px; }

    /* ── Main ── */
    main { padding: 24px 0 80px; }

    /* ── Card ── */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg3); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-meta { font-size: 12px; color: var(--text3); }

    /* ── Table ── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--bg3); }
    .tbl .num { font-variant-numeric: tabular-nums; }
    .rank-num { font-size: 13px; font-weight: 600; color: var(--text3); width: 28px; display: inline-block; text-align: center; }
    .rank-1 .rank-num { color: var(--accent2); }

    /* ── Win bar ── */
    .bar-wrap { display: flex; align-items: center; gap: 10px; }
    .bar-track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
    .bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

    /* ── Fargo rating bar ── */
    .fargo-wrap { display: flex; align-items: center; gap: 10px; }
    .fargo-track { width: 100px; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
    .fargo-fill { height: 100%; border-radius: 4px; }
    .fargo-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 36px; }

    /* ── Team section header (Players/Team) ── */
    .team-section-header { padding: 10px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--accent2); letter-spacing: .06em; text-transform: uppercase; }

    /* ── Schedule ── */
    .sched-date-header { padding: 9px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: .05em; text-transform: uppercase; }
    .sched-block { margin-bottom: 10px; }
    .match-card { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-top: none; background: var(--bg2); font-size: 14px; }
    .match-card:hover { background: var(--bg3); }
    .match-card:last-child { border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
    .match-home { text-align: right; }
    .match-away { text-align: left; }
    .match-venue { font-size: 11px; color: var(--text3); text-align: center; margin-top: 2px; }
    .vs-chip { display: flex; align-items: center; justify-content: center; background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 12px; font-size: 12px; font-weight: 700; color: var(--text3); letter-spacing: .05em; white-space: nowrap; min-width: 60px; }
    .tbd-chip { display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--bg4); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 5px 12px; font-size: 11px; color: var(--text3); white-space: nowrap; min-width: 60px; }
    .tbd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green2); flex-shrink: 0; }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 0; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { color: var(--text3); font-size: 13px; }

    /* ── Notice / demo block ── */
    .notice { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; color: var(--text2); font-size: 14px; line-height: 1.8; }
    .notice strong { color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .league-name { font-size: 18px; }
      .tbl th, .tbl td { padding: 9px 10px; font-size: 13px; }
      .match-card { grid-template-columns: 1fr 50px 1fr; gap: 6px; font-size: 13px; }
      .fargo-track { width: 60px; }
    }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 11px; color: var(--text3); letter-spacing: .05em; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { color: var(--accent2); }
  </style>
</head>
<body>

<div class="felt-strip"></div>

<header>
  <div class="wrap">
    <div class="header-inner">
      <div class="logo-block">
        <div class="pool-balls" id="pool-balls" aria-hidden="true"></div>
        <div>
          <div class="league-name">Kemmerer Pool League</div>
          <div class="league-sub">Jenkins Music &amp; Vending · kemmererpool.com</div>
        </div>
      </div>
      <div style="text-align:right">
        <div id="live-status" class="live-pill demo"><span class="dot"></span> Loading…</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px" id="refresh-note"></div>
      </div>
    </div>
    <div class="league-tabs">
      <button class="ltab active" id="ltab-10ball" onclick="switchLeague('10ball')">⚫ 10-Ball 2026 <span class="badge">Active</span></button>
      <button class="ltab" id="ltab-8ball" onclick="switchLeague('8ball')">⚪ 8-Ball 25-26</button>
    </div>
  </div>
</header>

<div class="view-bar">
  <div class="wrap">
    <div class="view-bar-inner">
      <button class="vtab active" id="vt-teams"    onclick="switchView('teams')">Teams</button>
      <button class="vtab"        id="vt-players"  onclick="switchView('players')">Players</button>
      <button class="vtab"        id="vt-byteam"   onclick="switchView('byteam')">Players / Team</button>
      <button class="vtab"        id="vt-list"     onclick="switchView('list')">Player List</button>
      <button class="vtab"        id="vt-schedule" onclick="switchView('schedule')">Schedule</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="content"></div>
  </div>
</main>

<footer>
  <div class="felt-strip" style="margin-bottom:16px;opacity:.4"></div>
  KEMMERER POOL LEAGUE · JENKINS MUSIC &amp; VENDING · KEMMERER, WY<br>
  Powered by <a href="https://fargorate.com" target="_blank" rel="noopener">FargoRate LMS</a>
  &nbsp;·&nbsp; <span style="color:var(--text3)">v1.7</span>
</footer>

<script>
/* ── Config ── */
const PROXY = '/proxy?url=';
const BASE  = 'https://lms.fargorate.com/PublicReport';
const DIVISIONS = {
  '10ball': { id: 'c97cf1bf-ff08-44a0-b916-b4520124b3e6', label: 'Kemmerer Summer 10 Ball 2026' },
  '8ball':  { id: '1dc8b2aa-62eb-41a6-a8f6-b379014efe83', label: 'Kemmerer 8 Ball League 25-26' },
};
const VIEWS = {
  teams:    { url: id => `${BASE}/GenerateTeamStandingsReport/${id}`,            method: 'GET' },
  players:  { url: id => `${BASE}/GeneratePlayerStandingsReport/${id}`,          method: 'GET' },
  byteam:   { url: id => `${BASE}/GeneratePlayerStandingsByTeamReport/${id}`,    method: 'GET' },
  list:     { url: id => `${BASE}/GeneratePlayerListReport/${id}`,               method: 'GET' },
  schedule: { url: ()  => `${BASE}/GenerateDivisionScheduleReport`,              method: 'POST', body: id => `divisionId=${id}` },
};

/* ── State ── */
let league = '10ball', view = 'teams', cache = {}, isLive = null;

/* ── Pool balls ── */
(function() {
  const colors = {1:'#F5C518',2:'#1B4FD8',3:'#D42B2B',4:'#6B1DB5',5:'#E87C1E',6:'#1A7A3A',7:'#A0190F',8:'#222',9:'#F5C518'};
  [8,1,9].forEach(n => {
    const c = colors[n], stripe = n > 8;
    document.getElementById('pool-balls').insertAdjacentHTML('beforeend',
      `<svg width="30" height="30" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="${stripe?'#fff':c}" stroke="#00000033" stroke-width="1"/>
      ${stripe?`<rect x="1" y="11" width="34" height="14" fill="${c}" rx="1"/>`:''}
      <circle cx="18" cy="18" r="7" fill="rgba(255,255,255,.88)"/>
      <text x="18" y="22" text-anchor="middle" font-size="8" font-weight="bold" fill="#111" font-family="sans-serif">${n}</text></svg>`);
  });
})();

/* ── Status ── */
function setStatus(live) {
  if (isLive === live) return;
  isLive = live;
  const el = document.getElementById('live-status');
  el.className = `live-pill ${live?'live':'demo'}`;
  el.innerHTML = `<span class="dot"></span> ${live?'Live data':'Demo data'}`;
  document.getElementById('refresh-note').textContent =
    `Ratings current as of ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
}

/* ── Fetch ── */
async function fetchSection(lg, vw) {
  const key = `${lg}__${vw}`;
  if (cache[key]) return cache[key];
  const divId = DIVISIONS[lg].id;
  const v = VIEWS[vw];
  const url = v.url(divId);
  const method = v.method || 'GET';
  try {
    const opts = { method, headers: { 'Accept': 'text/html' } };
    if (method === 'POST') {
      opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      opts.body = v.body(divId);
    }
    const r = await fetch(PROXY + encodeURIComponent(url), opts);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    if (!html || html.trim().length < 30) throw new Error('empty');
    cache[key] = { html, live: true };
    setStatus(true);
    return cache[key];
  } catch(e) {
    setStatus(false);
    cache[key] = { html: null, live: false };
    return cache[key];
  }
}

/* ── Parse table ── */
function parseTable(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return null;
  const headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  const rows = [...table.querySelectorAll('tr')].slice(1)
    .map(tr => [...tr.querySelectorAll('td')].map(td => td.textContent.trim()))
    .filter(r => r.length > 0);
  return { headers, rows };
}

/* ── Color helpers ── */
function winColor(pct) {
  const v = Math.min(Math.max(parseFloat(pct)/100, 0), 1);
  const h = Math.round(v * 130);
  return `hsl(${h},60%,45%)`;
}
function fargoColor(rating) {
  const pct = Math.min((parseInt(rating)||0)/800, 1);
  return `hsl(${Math.round(pct*200+160)},60%,48%)`;
}

/* ── Render Teams ── */
function renderTeams(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  const rows = t ? t.rows : [];
  const headers = t ? t.headers : ['#','Team','RDS %','RDS','GMS','PTS','WKS'];
  const pctIdx = headers.findIndex(h => h.includes('%'));
  if (!rows.length) return demoBlock('Team Standings');

  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Team Standings</span>
      <span class="card-meta">${rows.length} teams · ${DIVISIONS[league].label}</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map((r,i) => {
            const pctStr = pctIdx >= 0 ? r[pctIdx] : '0%';
            const pctVal = parseFloat(pctStr) || 0;
            return `<tr class="${i===0?'rank-1':''}">
              ${r.map((cell,ci) => {
                if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
                if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
                if (ci===pctIdx) return `<td>
                  <div class="bar-wrap">
                    <div class="bar-track" style="width:80px">
                      <div class="bar-fill" style="width:${pctVal}%;background:${winColor(pctStr)}"></div>
                    </div>
                    <span class="num" style="font-size:13px;color:var(--text2)">${cell}</span>
                  </div></td>`;
                return `<td class="num" style="color:var(--text2)">${cell}</td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ── Render Players ── */
function renderPlayers(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return demoBlock('Player Standings');
  const winIdx = t.headers.findIndex(h => /win/i.test(h));
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player Standings</span>
      <span class="card-meta">${t.rows.length} players</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>
          ${t.rows.map((r,i) => `<tr class="${i===0?'rank-1':''}">
            ${r.map((cell,ci) => {
              if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
              if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
              if (ci===winIdx && winIdx>0) {
                const pct = parseFloat(cell)||0;
                return `<td>
                  <div class="bar-wrap">
                    <div class="bar-track" style="width:60px">
                      <div class="bar-fill" style="width:${pct}%;background:${winColor(cell)}"></div>
                    </div>
                    <span class="num" style="font-size:13px;color:var(--text2)">${cell}</span>
                  </div></td>`;
              }
              return `<td class="num" style="color:var(--text2)">${cell}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ── Render Players by Team ── */
function renderByTeam(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return demoBlock('Players by Team');

  // Detect team header rows (rows where only first cell has content or row has class)
  // FargoRate puts team name as a row with colspan or single cell
  const d = document.createElement('div');
  d.innerHTML = data.html;
  const table = d.querySelector('table');
  if (!table) return demoBlock('Players by Team');

  const allRows = [...table.querySelectorAll('tr')].slice(1);
  let html = `<div class="card">
    <div class="card-header">
      <span class="card-title">Players by Team</span>
      <span class="card-meta">${DIVISIONS[league].label}</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>`;

  allRows.forEach(row => {
    const cells = row.querySelectorAll('td');
    const isTeamHeader = cells.length === 1 || (cells.length > 0 && cells[0].getAttribute('colspan') > 1)
      || (cells.length > 0 && row.className.toLowerCase().includes('team'));

    if (isTeamHeader || (cells.length > 0 && [...cells].every((c,i) => i===0 || c.textContent.trim()==='' || c.textContent.trim()==='-'))) {
      const name = cells[0]?.textContent.trim();
      if (name) html += `<tr><td colspan="${t.headers.length}" class="team-section-header">${name}</td></tr>`;
    } else {
      const rowData = [...cells].map(c => c.textContent.trim());
      html += `<tr>${rowData.map((cell,ci) => {
        if (ci===0) return `<td class="num" style="color:var(--text3);font-size:13px">${cell}</td>`;
        if (ci===1) return `<td style="font-weight:500;color:var(--text)">${cell}</td>`;
        return `<td class="num" style="color:var(--text2)">${cell}</td>`;
      }).join('')}</tr>`;
    }
  });

  html += `</tbody></table></div></div>`;
  return html;
}

/* ── Render Player List ── */
function renderList(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return demoBlock('Player List');

  const ratingIdx = t.headers.findIndex(h => /rating|fargo/i.test(h));

  // Sort by fargo rating descending
  const sorted = ratingIdx >= 0
    ? [...t.rows].sort((a,b) => (parseInt(b[ratingIdx])||0) - (parseInt(a[ratingIdx])||0))
    : t.rows;

  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player List &amp; Fargo Ratings</span>
      <span class="card-meta">${sorted.length} players · sorted by rating</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th>#</th>
          ${t.headers.map(h=>`<th>${h}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${sorted.map((r,i) => {
            const rating = ratingIdx >= 0 ? parseInt(r[ratingIdx])||0 : 0;
            const pct = Math.min(rating/800,1);
            return `<tr class="${i===0?'rank-1':''}">
              <td><span class="rank-num">${i+1}</span></td>
              ${r.map((cell,ci) => {
                if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
                if (ci===ratingIdx && ratingIdx>=0) return `<td>
                  <div class="fargo-wrap">
                    <div class="fargo-track">
                      <div class="fargo-fill" style="width:${pct*100}%;background:${fargoColor(rating)}"></div>
                    </div>
                    <span class="fargo-num" style="color:${fargoColor(rating)}">${cell}</span>
                  </div></td>`;
                return `<td style="color:var(--text2)">${cell}</td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ── Render Schedule ── */
function renderSchedule(data) {
  if (!data.live || !data.html) return demoBlock('Schedule');
  const d = document.createElement('div');
  d.innerHTML = data.html;

  // Walk ALL text lines and group by date
  const text = (d.innerText || d.textContent || '');
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const dateRe = /^\d{1,2}\/\d{1,2}\/\d{4}$/;

  const blocks = [];
  let current = null;
  lines.forEach(line => {
    if (dateRe.test(line)) {
      current = { date: line, lines: [] };
      blocks.push(current);
    } else if (current) {
      current.lines.push(line);
    }
  });

  if (!blocks.length) {
    return `<div class="card">
      <div class="card-header"><span class="card-title">Schedule</span></div>
      <div style="padding:16px">
        ${lines.map(l=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);color:var(--text2);font-size:14px">${l}</div>`).join('')}
      </div>
    </div>`;
  }

  // Parse ALL matches from a date's lines - handles both (H)/(A) and plain "Team vs Team"
  function parseMatches(lines) {
    const matches = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      // Format 1: starts with (H)
      if (line.startsWith('(H)')) {
        const home = line.replace(/^\(H\)\s*/,'');
        let j = i + 1;
        if (j < lines.length && lines[j].toLowerCase() === 'vs') j++;
        let away = '', venue = '';
        if (j < lines.length && lines[j].startsWith('(A)')) {
          away = lines[j].replace(/^\(A\)\s*/,''); j++;
        }
        if (j < lines.length && !lines[j].startsWith('(H)') && !lines[j].startsWith('(A)') && !dateRe.test(lines[j]) && lines[j].toLowerCase() !== 'vs') {
          venue = lines[j]; j++;
        }
        matches.push({ home, away, venue });
        i = j;
      }
      // Format 2: "Team A vs Team B" on one line
      else if (line.toLowerCase().includes(' vs ') && !line.startsWith('(A)')) {
        const parts = line.split(/ vs /i);
        const home = parts[0].trim();
        const away = parts[1] ? parts[1].trim() : '';
        let venue = '';
        if (i+1 < lines.length && !lines[i+1].startsWith('(H)') && !lines[i+1].toLowerCase().includes(' vs ') && !dateRe.test(lines[i+1])) {
          venue = lines[i+1]; i++;
        }
        matches.push({ home, away, venue });
        i++;
      } else {
        i++;
      }
    }
    return matches;
  }

  // Format date nicely
  function fmtDate(str) {
    try {
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    } catch(e) { return str; }
  }

  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${blocks.map(block => {
      const matches = parseMatches(block.lines);
      if (!matches.length) return '';
      return `<div class="sched-block">
        <div class="sched-date-header">
          ${fmtDate(block.date)}
          <span style="font-weight:400;color:var(--text3);margin-left:8px;font-size:11px">${matches.length} match${matches.length>1?'es':''}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border)">
          ${matches.map(m => `
            <div class="match-card" style="background:var(--bg2)">
              <div class="match-home">
                <div style="font-weight:600;color:var(--text);font-size:14px">${m.home}</div>
                <div style="font-size:11px;color:var(--text3);margin-top:2px">Home</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
                <div class="vs-chip">VS</div>
                ${m.venue ? `<div style="font-size:10px;color:var(--text3);text-align:center;white-space:nowrap">${m.venue}</div>` : ''}
              </div>
              <div class="match-away">
                <div style="font-weight:600;color:var(--text);font-size:14px">${m.away}</div>
                <div style="font-size:11px;color:var(--text3);margin-top:2px">Away</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ── Demo block ── */
function demoBlock(title) {
  return `<div class="notice">
    <strong>${title}</strong><br>
    Live data will load once connected to kemmererpool.com via the Cloudflare proxy.
  </div>`;
}

/* ── Tab switching ── */
function switchLeague(lg) {
  league = lg;
  ['10ball','8ball'].forEach(k => document.getElementById(`ltab-${k}`).classList.toggle('active', k===lg));
  cache = {};
  loadView();
}
function switchView(vw) {
  view = vw;
  ['teams','players','byteam','list','schedule'].forEach(k => document.getElementById(`vt-${k}`).classList.toggle('active', k===vw));
  loadView();
}

/* ── Load ── */
async function loadView() {
  document.getElementById('content').innerHTML =
    `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Loading live data…</div></div>`;
  const data = await fetchSection(league, view);
  let html = '';
  if      (view==='teams')    html = renderTeams(data);
  else if (view==='players')  html = renderPlayers(data);
  else if (view==='byteam')   html = renderByTeam(data);
  else if (view==='list')     html = renderList(data);
  else if (view==='schedule') html = renderSchedule(data);
  document.getElementById('content').innerHTML = html;
}

loadView();
</script>
