<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kemmerer Pool League</title>
  <meta name="description" content="Official standings, player stats, and schedule for the Kemmerer Pool League." />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #181818;
      --bg2:       #202020;
      --bg3:       #282828;
      --bg4:       #303030;
      --border:    #383838;
      --border2:   #484848;
      --text:      #f0ece8;
      --text2:     #9a9088;
      --text3:     #585048;
      --accent:    #c0392b;
      --accent-dim:#8a2820;
      --cream:     #e8ddd0;
      --green:     #27855a;
      --green2:    #32a870;
      --felt:      repeating-linear-gradient(90deg,#1a5c32 0px,#154d28 3px,#1a5c32 6px);
      --radius:    8px;
      --radius-sm: 5px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; font-size: 15px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .felt-strip { height: 4px; background: var(--felt); }

    /* ── Header ── */
    header { background: var(--bg2); border-bottom: 1px solid var(--border); }
    .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0px,#154d28 4px,#1a5c32 8px); opacity: .5; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; gap: 16px; flex-wrap: wrap; }
    .logo-block { display: flex; align-items: center; gap: 0; }
    .league-name { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    .league-sub { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
    .live-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 12px; font-size: 11px; font-weight: 600; }
    .live-pill.live { background: rgba(50,168,112,.12); border: 1px solid rgba(50,168,112,.3); color: var(--green2); }
    .live-pill.demo { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
    .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .live-pill.live .dot { background: var(--green2); }
    .live-pill.demo .dot { background: var(--text3); }
    .refresh-note { font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* ── League tabs ── */
    .league-tabs { display: flex; gap: 3px; padding-top: 16px; }
    .ltab { padding: 9px 22px; cursor: pointer; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm) var(--radius-sm) 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text2); transition: all .15s; }
    .ltab:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .ltab.active { background: var(--bg); color: var(--text); border-color: var(--border); border-bottom-color: var(--bg); position: relative; bottom: -1px; font-weight: 600; }
    .ltab .badge { font-size: 9px; background: var(--green); color: #fff; border-radius: 99px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; font-weight: 600; }

    /* ── View tabs ── */
    .view-bar { background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .view-bar-inner { display: flex; gap: 2px; padding: 8px 0; }
    .vtab { padding: 7px 16px; cursor: pointer; font-size: 14px; font-weight: 400; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); transition: all .12s; }
    .vtab:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .vtab.active { background: var(--bg3); color: var(--text); font-weight: 600; border-left: 2px solid var(--accent); padding-left: 14px; }

    /* ── Main ── */
    main { padding: 24px 0 80px; }

    /* ── Card ── */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg3); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-meta { font-size: 12px; color: var(--text3); }

    /* ── Table ── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--bg3); }
    .num { font-variant-numeric: tabular-nums; }
    .rank-num { font-size: 13px; font-weight: 600; color: var(--text3); width: 24px; display: inline-block; text-align: right; }

    /* ── Bar ── */
    .bar-wrap { display: flex; align-items: center; gap: 10px; }
    .bar-track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; flex-shrink: 0; }
    .bar-fill { height: 100%; border-radius: 3px; }

    /* ── Fargo bar ── */
    .fargo-wrap { display: flex; align-items: center; gap: 10px; }
    .fargo-track { width: 90px; height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; flex-shrink: 0; }
    .fargo-fill { height: 100%; border-radius: 4px; }
    .fargo-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── Team section (Players/Team) ── */
    .team-section-hdr { padding: 9px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--cream); letter-spacing: .05em; text-transform: uppercase; border-left: 3px solid var(--accent); }

    /* ── Schedule ── */
    .sched-block { margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .sched-date-hdr { padding: 10px 16px; background: var(--bg3); font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
    .sched-count { font-weight: 400; color: var(--text3); font-size: 11px; }
    .match-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 600px) { .match-grid { grid-template-columns: 1fr; } }
    .match-card { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--bg2); }
    .match-card:hover { background: var(--bg3); }
    .match-home { text-align: right; }
    .match-away { text-align: left; }
    .match-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .match-label { font-size: 10px; color: var(--text3); margin-top: 2px; letter-spacing: .04em; text-transform: uppercase; }
    .vs-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .vs-chip { background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: .05em; }
    .venue-label { font-size: 10px; color: var(--text3); text-align: center; }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 0; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { color: var(--text3); font-size: 13px; }

    /* ── Notice ── */
    .notice { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; color: var(--text2); font-size: 14px; line-height: 1.8; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .league-name { font-size: 18px; }
      .tbl th, .tbl td { padding: 9px 10px; font-size: 13px; }
      .match-card { grid-template-columns: 1fr 55px 1fr; gap: 6px; }
    }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 11px; color: var(--text3); letter-spacing: .05em; }
    footer a { color: var(--text2); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div class="logo-block">
        <div>
          <div class="league-name">Kemmerer Pool League</div>
          <div class="league-sub">Jenkins Music &amp; Vending · kemmererpool.com</div>
        </div>
      </div>
      <div style="text-align:right">
        <div id="live-status" class="live-pill demo"><span class="dot"></span> Loading…</div>
        <div class="refresh-note" id="refresh-note"></div>
      </div>
    </div>
    <div class="league-tabs">
      <button class="ltab active" id="ltab-10ball" onclick="switchLeague('10ball')">10-Ball 2026 <span class="badge">Active</span></button>
      <button class="ltab" id="ltab-8ball" onclick="switchLeague('8ball')">8-Ball 25-26</button>
    </div>
  </div>
</header>

<div class="view-bar">
  <div class="wrap">
    <div class="view-bar-inner">
      <button class="vtab active" id="vt-teams"    onclick="switchView('teams')">Teams</button>
      <button class="vtab"        id="vt-players"  onclick="switchView('players')">Players</button>
      <button class="vtab"        id="vt-byteam"   onclick="switchView('byteam')">Players / Team</button>
      <button class="vtab"        id="vt-list"     onclick="switchView('list')">Player List</button>
      <button class="vtab"        id="vt-schedule" onclick="switchView('schedule')">Schedule</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="content"></div>
  </div>
</main>

<footer>
  <div class="felt-strip" style="margin-bottom:16px;opacity:.4"></div>
  KEMMERER POOL LEAGUE &nbsp;·&nbsp; JENKINS MUSIC &amp; VENDING &nbsp;·&nbsp; KEMMERER, WY<br>
  Powered by <a href="https://fargorate.com" target="_blank" rel="noopener">FargoRate LMS</a>
  &nbsp;·&nbsp; v1.11
</footer>

<script>
const PROXY = '/proxy?url=';
const BASE  = 'https://lms.fargorate.com/PublicReport';
const DIVISIONS = {
  '10ball': { id: 'c97cf1bf-ff08-44a0-b916-b4520124b3e6', label: 'Kemmerer Summer 10 Ball 2026' },
  '8ball':  { id: '1dc8b2aa-62eb-41a6-a8f6-b379014efe83', label: 'Kemmerer 8 Ball League 25-26' },
};
const VIEWS = {
  teams:    { url: id => `${BASE}/GenerateTeamStandingsReport/${id}`,         method: 'GET' },
  players:  { url: id => `${BASE}/GeneratePlayerStandingsReport/${id}`,       method: 'GET' },
  byteam:   { url: id => `${BASE}/GeneratePlayerStandingsByTeamReport/${id}`, method: 'GET' },
  list:     { url: id => `${BASE}/GeneratePlayerListReport/${id}`,            method: 'GET' },
  schedule: { url: ()  => `${BASE}/GenerateDivisionScheduleReport`,           method: 'POST', body: id => `divisionId=${id}` },
};

let league = '10ball', view = 'teams', cache = {}, isLive = null;

function setStatus(live) {
  if (isLive === live) return;
  isLive = live;
  const el = document.getElementById('live-status');
  el.className = `live-pill ${live?'live':'demo'}`;
  el.innerHTML = `<span class="dot"></span> ${live?'Live data':'Demo data'}`;
  document.getElementById('refresh-note').textContent =
    `Ratings current as of ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
}

async function fetchSection(lg, vw) {
  const key = `${lg}__${vw}`;
  if (cache[key]) return cache[key];
  const divId = DIVISIONS[lg].id;
  const v = VIEWS[vw];
  const url = v.url(divId);
  try {
    const opts = { method: v.method||'GET', headers: { 'Accept': 'text/html' } };
    if (v.method === 'POST') {
      opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      opts.body = v.body(divId);
    }
    const r = await fetch(PROXY + encodeURIComponent(url), opts);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    if (!html || html.trim().length < 30) throw new Error('empty');
    cache[key] = { html, live: true };
    setStatus(true);
    return cache[key];
  } catch(e) {
    setStatus(false);
    cache[key] = { html: null, live: false };
    return cache[key];
  }
}

function parseTable(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return null;
  const headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  const rows = [...table.querySelectorAll('tr')].slice(1)
    .map(tr => [...tr.querySelectorAll('td')].map(td => td.textContent.trim()))
    .filter(r => r.length > 0);
  return { headers, rows };
}

function winColor(pctStr) {
  const v = Math.min(Math.max(parseFloat(pctStr)/100, 0), 1);
  return `hsl(${Math.round(v*130)},55%,42%)`;
}
function fargoColor(rating) {
  const pct = Math.min((parseInt(rating)||0)/800, 1);
  return `hsl(${Math.round(pct*100+20)},55%,48%)`;
}

/* ── Teams ── */
function renderTeams(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return notice('Team standings will appear here once live data loads.');
  const pctIdx = t.headers.findIndex(h => h.includes('%'));
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Team Standings</span>
      <span class="card-meta">${t.rows.length} teams · ${DIVISIONS[league].label}</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.rows.map((r,i) => `<tr>
        ${r.map((cell,ci) => {
          if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
          if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
          if (ci===pctIdx && pctIdx>0) {
            const pv = parseFloat(cell)||0;
            return `<td><div class="bar-wrap">
              <div class="bar-track" style="width:80px"><div class="bar-fill" style="width:${pv}%;background:${winColor(cell)}"></div></div>
              <span class="num" style="font-size:13px;color:var(--text2)">${cell}</span>
            </div></td>`;
          }
          return `<td class="num" style="color:var(--text2)">${cell}</td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Players ── */
function renderPlayers(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return notice('Player standings will appear here once live data loads.');
  const winIdx = t.headers.findIndex(h => /win\s*pct/i.test(h));
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player Standings</span>
      <span class="card-meta">${t.rows.length} players</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.rows.map((r,i) => `<tr>
        ${r.map((cell,ci) => {
          if (ci===0) return `<td><span class="rank-num">${i+1}</span></td>`;
          if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
          if (ci===winIdx && winIdx>0) {
            const pv = parseFloat(cell)||0;
            return `<td><div class="bar-wrap">
              <div class="bar-track" style="width:65px"><div class="bar-fill" style="width:${pv}%;background:${winColor(cell)}"></div></div>
              <span class="num" style="font-size:13px;color:var(--text2)">${cell}</span>
            </div></td>`;
          }
          return `<td class="num" style="color:var(--text2)">${cell}</td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Players by Team ── */
function renderByTeam(data) {
  if (!data.live || !data.html) return notice('Players by team will appear here once live data loads.');
  const d = document.createElement('div');
  d.innerHTML = data.html;
  const table = d.querySelector('table');
  if (!table) return notice('No data available.');
  const headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  const allRows = [...table.querySelectorAll('tr')].slice(1);

  let html = `<div class="card">
    <div class="card-header">
      <span class="card-title">Players by Team</span>
      <span class="card-meta">${DIVISIONS[league].label}</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>`;

  allRows.forEach(row => {
    const cells = [...row.querySelectorAll('td')];
    const isHeader = cells.length === 1
      || (cells[0] && cells[0].colSpan > 1)
      || (cells.length > 1 && cells.slice(1).every(c => !c.textContent.trim() || c.textContent.trim() === '-'));
    if (isHeader) {
      const name = cells[0]?.textContent.trim();
      if (name) html += `<tr><td colspan="${headers.length}" class="team-section-hdr">${name}</td></tr>`;
    } else {
      html += `<tr>${cells.map((c,ci) => {
        const cell = c.textContent.trim();
        if (ci===0) return `<td class="num" style="color:var(--text3);font-size:13px">${cell}</td>`;
        if (ci===1) return `<td style="font-weight:500;color:var(--text)">${cell}</td>`;
        return `<td class="num" style="color:var(--text2)">${cell}</td>`;
      }).join('')}</tr>`;
    }
  });

  html += `</tbody></table></div></div>`;
  return html;
}

/* ── Player List ── */
function renderList(data) {
  const t = data.live && data.html ? parseTable(data.html) : null;
  if (!t || !t.rows.length) return notice('Player list will appear here once live data loads.');
  const ratingIdx = t.headers.findIndex(h => /rating|fargo/i.test(h));
  const sorted = ratingIdx >= 0
    ? [...t.rows].sort((a,b) => (parseInt(b[ratingIdx])||0)-(parseInt(a[ratingIdx])||0))
    : t.rows;
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Player List &amp; Fargo Ratings</span>
      <span class="card-meta">${sorted.length} players · sorted by rating</span>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>#</th>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${sorted.map((r,i) => {
        const rating = ratingIdx>=0 ? parseInt(r[ratingIdx])||0 : 0;
        const pct = Math.min(rating/800,1);
        return `<tr>
          <td><span class="rank-num">${i+1}</span></td>
          ${r.map((cell,ci) => {
            if (ci===1) return `<td style="font-weight:600;color:var(--text)">${cell}</td>`;
            if (ci===ratingIdx && ratingIdx>=0) return `<td>
              <div class="fargo-wrap">
                <div class="fargo-track"><div class="fargo-fill" style="width:${pct*100}%;background:${fargoColor(rating)}"></div></div>
                <span class="fargo-num" style="color:${fargoColor(rating)}">${cell}</span>
              </div></td>`;
            return `<td style="color:var(--text2)">${cell}</td>`;
          }).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Schedule ── */
function renderSchedule(data) {
  if (!data.live || !data.html) return notice('Schedule will appear here once live data loads.');
  const d = document.createElement('div');
  d.innerHTML = data.html;

  // FargoRate returns structured HTML with classes:
  // .schedule-date, .schedule-team-block, .schedule-team, .schedule-location
  const blocks = [];
  let cur = null;

  const container = d.querySelector('#schedule-list') || d;
  [...container.children].forEach(node => {
    if (node.classList.contains('schedule-date')) {
      cur = { date: node.textContent.trim(), matches: [] };
      blocks.push(cur);
    } else if (node.classList.contains('schedule-team-block') && cur) {
      const teams = [...node.querySelectorAll('.schedule-team')]
        .map(s => s.textContent.trim().replace(/^\(H\)\s*|\(A\)\s*/g, '').trim());
      const venue = node.querySelector('.schedule-location')?.textContent.trim() || '';
      if (teams.length >= 2) cur.matches.push({ home: teams[0], away: teams[1], venue });
    }
  });

  if (!blocks.length) return notice('No schedule data found.');

  function fmtDate(str) {
    try {
      const p = str.split('/');
      return new Date(p[2], p[0]-1, p[1]).toLocaleDateString('en-US',
        { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    } catch(e) { return str; }
  }

  return `<div style="display:flex;flex-direction:column;gap:10px">
    ${blocks.map(block => {
      if (!block.matches.length) return '';
      return `<div class="sched-block">
        <div class="sched-date-hdr">
          <span>${fmtDate(block.date)}</span>
          <span class="sched-count">${block.matches.length} match${block.matches.length!==1?'es':''}</span>
        </div>
        <div class="match-grid">
          ${block.matches.map(m => `
            <div class="match-card">
              <div class="match-home">
                <div class="match-name">${m.home}</div>
                <div class="match-label">Home</div>
              </div>
              <div class="vs-col">
                <div class="vs-chip">VS</div>
                ${m.venue ? `<div class="venue-label">${m.venue}</div>` : ''}
              </div>
              <div class="match-away">
                <div class="match-name">${m.away}</div>
                <div class="match-label">Away</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function notice(msg) {
  return `<div class="notice">${msg}</div>`;
}

function switchLeague(lg) {
  league = lg;
  ['10ball','8ball'].forEach(k => document.getElementById(`ltab-${k}`).classList.toggle('active', k===lg));
  cache = {};
  loadView();
}
function switchView(vw) {
  view = vw;
  ['teams','players','byteam','list','schedule'].forEach(k => document.getElementById(`vt-${k}`).classList.toggle('active', k===vw));
  loadView();
}

async function loadView() {
  document.getElementById('content').innerHTML =
    `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Loading…</div></div>`;
  const data = await fetchSection(league, view);
  let html = '';
  if      (view==='teams')    html = renderTeams(data);
  else if (view==='players')  html = renderPlayers(data);
  else if (view==='byteam')   html = renderByTeam(data);
  else if (view==='list')     html = renderList(data);
  else if (view==='schedule') html = renderSchedule(data);
  document.getElementById('content').innerHTML = html;
}

loadView();
</script>
</body>
</html>
