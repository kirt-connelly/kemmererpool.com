<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Tri City Admin — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414; --bg2: #1e1e1e; --bg3: #262626; --bg4: #2e2e2e;
    --border: #363636; --border2: #464646;
    --text: #ffffff; --text2: #b0a898; --text3: #666058;
    --accent: #27855a; --cream: #e8ddd0; --green2: #32a870; --loss: #cc4444;
    --on-accent: #ffffff;
    --radius: 8px; --radius-sm: 5px;
  }
  html[data-theme="light"] {
    --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae6df; --bg4: #ddd8ce;
    --border: #d6d0c5; --border2: #bcb4a6;
    --text: #1a1714; --text2: #5a5348; --text3: #8b8376;
    --accent: #1f6b48; --cream: #2b2419; --green2: #1a7a4e; --loss: #b23636;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); }
  .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0,#154d28 4px,#1a5c32 8px); opacity: .5; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 12px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .theme-btn { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-size: 13px; padding: 0; }
  .theme-btn:hover { background: var(--bg4); color: var(--text); }

  main { padding: 22px 0 70px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-meta { font-size: 13px; color: var(--text3); }
  .pad { padding: 18px; }

  .act { display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: .02em;
    padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
  .act:hover { background: var(--bg4); color: var(--text); }
  .act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .act.primary:hover { background: var(--accent); opacity: .88; color: var(--on-accent); }
  .act.small { padding: 6px 12px; font-size: 13px; }
  .act:disabled { opacity: .45; cursor: default; }
  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 16px 18px; border-top: 1px solid var(--border); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 13px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--loss); }

  .gate { max-width: 420px; margin: 60px auto; }
  .field-lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  .inp { width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; }
  .inp:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--text3); }

  /* ── Counts ── */
  .tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px;
    background: var(--border); }
  .tally div { background: var(--bg2); padding: 15px 18px; }
  .tally .n { font-size: 26px; font-weight: 700; color: var(--cream); line-height: 1.1; }
  .tally .l { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text3); margin-top: 3px; }

  /* ── Entries ── */
  .rows { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .row { background: var(--bg2); padding: 14px 18px; display: flex; gap: 14px;
    align-items: flex-start; flex-wrap: wrap; }
  .row.done { background: var(--bg); }
  .row .main { flex: 1; min-width: 240px; }
  .row .name { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .row.done .name { color: var(--text2); }
  .row .meta { font-size: 13px; color: var(--text3); margin-top: 3px;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  /* The bar is what an officer scans for, so it reads in plain text a
     shade brighter than the date beside it. No badge. */
  .row .bar { font-size: 14px; font-weight: 600; color: var(--text2); }
  .row.done .bar { color: var(--text3); }
  /* Bookkeeping, so it sits under everything else in small italics. */
  .row .stamp { display: block; font-size: 11px; font-style: italic;
    color: var(--text3); opacity: .75; margin-top: 9px; }
  .row .roster { font-size: 14px; color: var(--text2); margin-top: 7px; line-height: 1.6; }
  .row .roster b { color: var(--cream); font-weight: 600; }
  /* Still tappable, but it shouldn't shout over the team name. */
  .row .tel { color: var(--text2); text-decoration: none; font-weight: 400; }
  .row .tel:hover { color: var(--green2); text-decoration: underline; }
  .row .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border2); color: var(--text3); }
  .tag.done { border-color: var(--accent); color: var(--green2); }
  .empty { padding: 24px 18px; color: var(--text3); font-size: 14px; background: var(--bg2); }

  /* ── Editing a row in place ── */
  .edit { background: var(--bg2); padding: 16px 18px; }
  .edit .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .edit .lbl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 5px; }
  .edit .num { font-size: 13px; color: var(--text3); width: 18px; flex: none; }
  .ed-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ed-row .inp { flex: 1; }
  .kill { flex: none; width: 32px; height: 34px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg3); color: var(--text3);
    font-size: 16px; line-height: 1; cursor: pointer; }
  .kill:hover { border-color: var(--loss); color: var(--loss); }
  @media (max-width: 560px) { .edit .grid { grid-template-columns: 1fr; } }
  .msg { font-size: 13px; color: var(--text3); }
  .msg.bad { color: var(--loss); }

  footer { border-top: 1px solid var(--border); padding: 18px 0; text-align: center;
    font-size: 11px; color: var(--text3); letter-spacing: .05em; }
  footer a { color: var(--text3); }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .row .acts { width: 100%; }
  }

  /* ── Tri City additions ── */
  .ev-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .ev-pick button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; }
  .ev-pick button.on { border-color: var(--accent); color: var(--green2); background: var(--bg); }
  .row .hcap { font-size: 22px; font-weight: 700; color: var(--cream); font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
  .row .hcap small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); margin-top: 4px; }
  .row .num { font-size: 13px; color: var(--text3); width: 22px; flex: none; padding-top: 3px; }
  .plist { margin-top: 7px; font-size: 14px; color: var(--text2); line-height: 1.65; }
  .plist .r { font-variant-numeric: tabular-nums; color: var(--cream); font-weight: 600; }
  .plist .out { color: var(--text3); }
  .plist .none { color: var(--loss); font-weight: 600; }
  .flags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .flag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px;
    border: 1px solid var(--loss); color: var(--loss); }
  .tag.paid { border-color: var(--accent); color: var(--green2); }
  .ed-row .rate { flex: 0 0 90px; text-align: right; }
  .win { background: var(--bg2); padding: 11px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .win .w { flex: 1; min-width: 220px; font-size: 15px; }
  .win .w b { color: var(--cream); }
  .win .w span { color: var(--text3); }
  .win .t { font-size: 13px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .state { font-size: 13px; font-weight: 600; }
  .rf-team { background: var(--bg2); padding: 14px 18px; }
  .rf-team .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rf-team .nm { font-size: 16px; font-weight: 700; }
  .rf-team .tot { font-size: 14px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .rf-team .tot b { color: var(--cream); font-size: 16px; }
  .rf-ch { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--text2); margin-top: 7px; cursor: pointer; }
  .rf-ch input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .rf-ch .n { color: var(--text); font-weight: 600; }
  .rf-ch .v { font-variant-numeric: tabular-nums; }
  .rf-ch .up { color: var(--green2); font-weight: 700; }
  .rf-ch .dn { color: var(--loss); font-weight: 700; }
  .rf-ch .hand { font-size: 12px; color: var(--loss); }
  .rf-note { background: var(--bg2); padding: 12px 18px; font-size: 14px; color: var(--text2); line-height: 1.6; }
  .rf-note b { color: var(--text); }
  .state.open { color: var(--green2); }
  .state.closed { color: var(--loss); }
</style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div>
        <h1>Tri City Admin</h1>
        <div class="sub" id="sub-line">Teams, rosters and reported wins</div>
      </div>
      <div class="head-right">
        <button class="act small" id="signout" onclick="signOut()" style="display:none">Sign out</button>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark">🌙</button>
      </div>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <div id="gate" class="gate">
    <div class="card">
      <div class="card-header"><span class="card-title">Officers</span></div>
      <div class="pad">
        <label class="field-lbl" for="pw">League password</label>
        <input id="pw" class="inp" type="password" autocomplete="current-password"
               placeholder="Ask another officer" onkeydown="if(event.key==='Enter')signIn()">
        <div class="btn-row" style="padding:14px 0 0">
          <button class="act primary" onclick="signIn()">Sign in</button>
          <span class="msg" id="gate-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="admin" style="display:none">

    <div class="card">
      <div class="card-header">
        <div class="ev-pick" id="ev-pick"></div>
        <span class="card-meta" id="updated"></span>
      </div>
      <div class="tally" id="tally"></div>
      <div class="btn-row">
        <button class="act" onclick="load()">Refresh</button>
        <button class="act primary" id="rf-btn" onclick="refreshRatings()">Refresh all ratings</button>
        <a class="act" id="print-all" href="#" target="_blank">Print all rosters</a>
        <a class="act" id="open-signup" href="#" target="_blank">Signup page</a>
        <button class="act" onclick="exportCsv()">Download CSV</button>
        <button class="act" id="toggle-open" onclick="toggleOpen()">Close signups</button>
        <span class="msg" id="top-msg"></span>
      </div>
    </div>

    <div class="card" id="rf-card" style="display:none">
      <div class="card-header">
        <span class="card-title">Rating refresh</span>
        <span class="card-meta" id="rf-meta"></span>
      </div>
      <div class="rows" id="rf-rows"></div>
      <div class="btn-row">
        <button class="act primary" id="rf-save" onclick="saveRefresh()">Save</button>
        <button class="act" onclick="cancelRefresh()">Cancel</button>
        <span class="msg" id="rf-msg"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Reported wins</span>
        <span class="card-meta" id="win-count"></span>
      </div>
      <div class="rows" id="wins"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Teams</span>
        <span class="card-meta" id="team-count"></span>
      </div>
      <div class="rows" id="teams"></div>
    </div>

  </div>

</div>
</main>

<footer>
  <a href="index.html">Kemmerer Pool League</a> &nbsp;&middot;&nbsp; <a href="leagueadmin.html">League signups</a> &nbsp;&middot;&nbsp; tricityadmin v1.01
</footer>

<script src="tricity.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   Officers' side of the Tri City: every team that signed up, their
   roster and handicap, paid or not, and the wins teams report from
   the QR on their roster. Same password as leagueadmin.html — sign
   in on one and the other lets you straight in.
   ═══════════════════════════════════════════════════════════════ */

const PASS_STORE = 'kpl-league-pass';
const pass = () => { try { return sessionStorage.getItem(PASS_STORE) || ''; } catch (e) { return ''; } };

let E = tcEventKey();
let DATA = { teams: [], wins: [], closed: false };
let EDITING = null;
let PENDING = null;          /* a rating refresh waiting to be saved */

/* ── Theme ── */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem('kpl-theme', t); } catch (e) {}
}
function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
(function () { let s = null; try { s = localStorage.getItem('kpl-theme'); } catch (e) {} applyTheme(s || 'dark'); })();

/* ── Sign in ── */
async function signIn() {
  const p = document.getElementById('pw').value.trim();
  if (!p) return;
  const msg = document.getElementById('gate-msg');
  msg.textContent = 'Checking…'; msg.className = 'msg';
  try {
    const d = await tcGet(E, p);
    if (!d.officer) throw new Error('That password was not accepted.');
    try { sessionStorage.setItem(PASS_STORE, p); } catch (e) {}
    show(d);
  } catch (err) {
    msg.textContent = err.code === 'not_configured' ? 'Storage is not set up on the server yet.' : 'That password was not accepted.';
    msg.className = 'msg bad';
  }
}
function signOut() { try { sessionStorage.removeItem(PASS_STORE); } catch (e) {} location.reload(); }

function show(d) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('admin').style.display = '';
  document.getElementById('signout').style.display = '';
  render(d);
}

async function load() {
  const msg = document.getElementById('top-msg');
  try {
    const d = await tcGet(E, pass());
    if (!d.officer) throw new Error('Sign in again.');
    msg.textContent = '';
    render(d);
    return true;
  } catch (err) {
    msg.textContent = err.message || 'Could not load.'; msg.className = 'msg bad';
    return false;
  }
}

function pickEvent(key) {
  E = key; EDITING = null;
  const u = new URL(location.href); u.searchParams.set('e', key); history.replaceState(null, '', u);
  load();
}

/* ── Helpers ── */
const fmt = n => (n || 0).toLocaleString('en-US');
const telLink = p => {
  const d = String(p || '').replace(/[^0-9]/g, '');
  return d ? '<a class="tel" href="tel:' + d + '">' + esc(p) + '</a>' : '<span class="meta">no number</span>';
};
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

/* Things an officer should look at before the draw. Warnings only —
   the officer makes the call. */
function flagsFor(t, seen) {
  const f = [];
  const top = tcRanked(t.players).slice(0, TC_RULES.countTop);
  if (t.players.length < TC_RULES.countTop) f.push('Only ' + t.players.length + ' players');
  const unrated = t.players.filter(p => !p.rating).length;
  if (unrated) f.push(unrated + ' without a rating' + (top.some(p => !p.rating) ? ' (in the top ' + TC_RULES.countTop + ')' : ''));
  t.players.forEach(p => {
    const others = (seen[p.name.toLowerCase()] || []).filter(x => x !== t.team);
    if (others.length) f.push(p.name + ' is also on ' + others.join(', '));
  });
  return f;
}

/* ── Render ── */
function render(d) {
  DATA = d;
  const ev = TC_EVENTS[E];
  const teams = d.teams || [], wins = d.wins || [];

  document.getElementById('ev-pick').innerHTML = Object.keys(TC_EVENTS).map(k =>
    `<button class="${k === E ? 'on' : ''}" data-e="${k}">${esc(TC_EVENTS[k].where)}</button>`).join('');
  document.querySelectorAll('#ev-pick button').forEach(b => b.onclick = () => pickEvent(b.dataset.e));
  document.getElementById('sub-line').textContent = ev.name + (ev.when ? ' · ' + ev.when : '');

  const players = teams.reduce((n, t) => n + t.players.length, 0);
  const paid = teams.filter(t => t.paid).length;
  document.getElementById('tally').innerHTML =
    `<div><div class="n">${teams.length}${ev.maxTeams ? '<span style="font-size:15px;color:var(--text3)"> / ' + ev.maxTeams + '</span>' : ''}</div><div class="l">Teams in</div></div>` +
    `<div><div class="n">${paid}</div><div class="l">Paid</div></div>` +
    `<div><div class="n">${players}</div><div class="l">Players</div></div>` +
    `<div><div class="n">${wins.length}</div><div class="l">Wins reported</div></div>` +
    `<div><div class="n state ${d.closed ? 'closed' : 'open'}" style="font-size:20px;padding-top:5px">${d.closed ? 'Closed' : 'Open'}</div><div class="l">Signups</div></div>`;

  document.getElementById('toggle-open').textContent = d.closed ? 'Open signups' : 'Close signups';
  document.getElementById('print-all').href = 'tricity-roster.html?e=' + E;
  document.getElementById('open-signup').href = 'tricity.html?e=' + E;
  document.getElementById('updated').textContent = 'As of ' + when(Date.now());
  document.getElementById('team-count').textContent = teams.length + (teams.length === 1 ? ' team' : ' teams') + ' · in signup order · ' +
    (d.ratingsAt ? 'ratings as of ' + when(d.ratingsAt) : 'ratings from signup');
  document.getElementById('win-count').textContent = wins.length ? 'Newest first · refreshes every 30 seconds' : '';

  /* Which teams each player appears on, for the double-roster check. */
  const seen = {};
  teams.forEach(t => t.players.forEach(p => {
    const k = p.name.toLowerCase();
    (seen[k] = seen[k] || []).push(t.team);
  }));

  document.getElementById('teams').innerHTML = teams.length ? teams.map((t, i) => {
    if (t.id === EDITING) return teamForm(t);
    const ranked = tcRanked(t.players);
    const captain = t.players[0] ? t.players[0].name : '';
    const flags = flagsFor(t, seen);
    return `<div class="row">
      <span class="num">${i + 1}.</span>
      <div class="main">
        <div class="name">${esc(t.team)}</div>
        <div class="meta"><span>${esc(captain)} (captain)</span> ${telLink(t.captainPhone)}</div>
        <div class="plist">${ranked.map((p, j) =>
          `<span class="${j < TC_RULES.countTop ? '' : 'out'}">${esc(p.name)} ${p.rating ? '<span class="r">' + p.rating + '</span>' : '<span class="none">no rating</span>'}</span>`
        ).join(' &middot; ')}</div>
        ${flags.length ? '<div class="flags">' + flags.map(f => '<span class="flag">' + esc(f) + '</span>').join('') + '</div>' : ''}
        <div class="stamp">Signed up ${when(t.at)}${t.source === 'officer' ? ' by an officer' : ''}${t.editedAt ? ' · edited ' + when(t.editedAt) : ''}</div>
      </div>
      <div class="acts" style="flex-direction:column;align-items:flex-end;gap:10px">
        <div class="hcap">${fmt(tcTeamRating(t.players))}<small>Handicap</small></div>
        <div class="acts">
          <button class="tag${t.paid ? ' paid' : ''}" style="cursor:pointer;background:none;font-family:inherit" data-act="paid" data-id="${esc(t.id)}">${t.paid ? 'Paid' : 'Not paid'}</button>
          <a class="act small" href="tricity-roster.html?e=${E}&t=${encodeURIComponent(t.id)}" target="_blank">Roster</a>
          <button class="act small" data-act="edit" data-id="${esc(t.id)}">Edit</button>
          <button class="linkish" data-act="del" data-id="${esc(t.id)}">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">No teams signed up yet.</div>';

  document.getElementById('wins').innerHTML = wins.length ? wins.map(w => `
    <div class="win">
      <div class="w"><b>${esc(w.winnerName)}</b> <span>beat</span> ${esc(w.loserName)}${w.reporter ? ' <span>· sent by ' + esc(w.reporter) + '</span>' : ''}</div>
      <span class="t">${when(w.at)}</span>
      <button class="linkish" data-act="delwin" data-id="${esc(w.id)}">Remove</button>
    </div>`).join('') : '<div class="empty">No wins reported yet.</div>';

  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, b.dataset.id));
}

function act(what, id) {
  if (what === 'edit') { EDITING = id; render(DATA); }
  else if (what === 'paid') setPaid(id);
  else if (what === 'del') removeTeam(id);
  else if (what === 'delwin') removeWin(id);
}

/* ═══ Editing ═══════════════════════════════════════════════════
   Player 1 is the captain. Ratings can be typed, or filled from
   FargoRate for any name that matches exactly.
   ═══════════════════════════════════════════════════════════════ */

function playerRow(n, p) {
  return '<div class="ed-row">' +
    '<span class="num">' + n + '.</span>' +
    '<input class="inp ed-name" type="text" maxlength="80" value="' + esc(p ? p.name : '') + '" placeholder="' + (n === 1 ? 'Captain' : 'Name') + '">' +
    '<input class="inp rate ed-rate" type="number" min="0" max="1000" value="' + (p && p.rating ? p.rating : '') + '" placeholder="Fargo">' +
  '</div>';
}

function teamForm(t) {
  const rows = [];
  for (let i = 0; i < TC_RULES.maxPlayers; i++) rows.push(playerRow(i + 1, t.players[i]));
  return '<div class="edit">' +
    '<div class="grid">' +
      '<div><label class="lbl">Team name</label><input class="inp" id="ed-team" type="text" maxlength="60" value="' + esc(t.team) + '"></div>' +
      '<div><label class="lbl">Captain\'s number</label><input class="inp" id="ed-phone" type="tel" maxlength="40" value="' + esc(t.captainPhone) + '"></div>' +
    '</div>' +
    '<label class="lbl">Players &mdash; 1 is the captain</label>' +
    '<div id="ed-players">' + rows.join('') + '</div>' +
    '<div class="btn-row" style="padding:14px 0 0">' +
      '<button class="act primary" onclick="saveEdit(\'' + t.id + '\')">Save</button>' +
      '<button class="act" onclick="cancelEdit()">Cancel</button>' +
      '<button class="act small" onclick="fillRatings()">Look up ratings</button>' +
      '<span class="msg" id="ed-msg"></span>' +
    '</div>' +
  '</div>';
}

function cancelEdit() { EDITING = null; render(DATA); }

async function fillRatings() {
  const msg = document.getElementById('ed-msg');
  tcStatusHook = m => { msg.textContent = m || ''; msg.className = 'msg'; };
  const idx = await loadIndex().catch(() => []);
  let found = 0, missed = [];
  document.querySelectorAll('#ed-players .ed-row').forEach(r => {
    const name = r.querySelector('.ed-name').value.trim();
    if (!name) return;
    const hit = (idx || []).find(p => p.name.toLowerCase() === name.toLowerCase());
    if (hit) { r.querySelector('.ed-rate').value = hit.rating; found++; }
    else missed.push(name);
  });
  msg.textContent = found + ' rating' + (found === 1 ? '' : 's') + ' filled' + (missed.length ? ' · no exact match for ' + missed.join(', ') : '');
  msg.className = missed.length ? 'msg bad' : 'msg';
}

async function saveEdit(id) {
  const msg = document.getElementById('ed-msg');
  const players = [...document.querySelectorAll('#ed-players .ed-row')].map(r => ({
    name: r.querySelector('.ed-name').value.trim(),
    rating: parseInt(r.querySelector('.ed-rate').value, 10) || 0,
  })).filter(p => p.name);
  const old = DATA.teams.find(t => t.id === id);
  /* Keep where each rating came from when the name didn't change. */
  players.forEach(p => {
    const was = old && old.players.find(o => o.name === p.name);
    p.division = was && was.rating === p.rating ? was.division : null;
  });

  msg.textContent = 'Saving…'; msg.className = 'msg';
  const r = await tcSend('PUT', {
    e: E, id,
    team: document.getElementById('ed-team').value,
    captainPhone: document.getElementById('ed-phone').value,
    players,
  }, pass()).catch(() => ({ ok: false, error: 'Could not reach the server.' }));
  if (r.ok) { EDITING = null; load(); return; }
  msg.textContent = r.error || 'That did not save.'; msg.className = 'msg bad';
}

async function setPaid(id) {
  const t = DATA.teams.find(x => x.id === id);
  if (!t) return;
  const r = await tcSend('PUT', { e: E, id, paid: !t.paid }, pass()).catch(() => ({}));
  if (r.ok) load();
}

async function removeTeam(id) {
  const t = DATA.teams.find(x => x.id === id);
  if (!confirm('Delete ' + (t ? t.team : 'this team') + '? This cannot be undone.')) return;
  const r = await tcSend('DELETE', { e: E, kind: 'team', id }, pass()).catch(() => ({}));
  if (r.ok) load();
}

async function removeWin(id) {
  const w = DATA.wins.find(x => x.id === id);
  if (!confirm('Remove ' + (w ? w.winnerName + ' beat ' + w.loserName : 'this result') + '?')) return;
  const r = await tcSend('DELETE', { e: E, kind: 'win', id }, pass()).catch(() => ({}));
  if (r.ok) load();
}

async function toggleOpen() {
  const closing = !DATA.closed;
  if (closing && !confirm('Close signups? The signup page will say signups are closed. Officers signed in can still add teams.')) return;
  const r = await tcSend('PUT', { e: E, settings: { closed: closing } }, pass()).catch(() => ({}));
  if (r.ok) load();
}

/* ── CSV — one row per player ── */
function exportCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['Team', 'Handicap', 'Paid', 'Player', 'Role', 'Fargo', 'Counts', 'Captain phone', 'Signed up'].map(q).join(',')];
  DATA.teams.forEach(t => {
    const total = tcTeamRating(t.players);
    const ranked = tcRanked(t.players);
    const stamp = t.at ? new Date(t.at).toISOString().slice(0, 16).replace('T', ' ') : '';
    ranked.forEach((p, i) => {
      const cap = t.players[0] && p.name === t.players[0].name;
      lines.push([t.team, total, t.paid ? 'Yes' : 'No', p.name, cap ? 'Captain' : 'Player', p.rating || '',
        i < TC_RULES.countTop ? 'Yes' : 'No', cap ? t.captainPhone : '', stamp].map(q).join(','));
    });
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tricity-' + E + '-teams.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}


/* ═══ Refresh all ratings ═══════════════════════════════════════
   Reads FargoRate fresh, matches every player by name, and shows each
   change with a tick box before anything is saved. Players nobody can
   find (usually the ones entered by hand) are left as they are and
   listed so their rating can be typed in. Saving also stamps the date
   that prints on the rosters as "ratings as of".
   ═══════════════════════════════════════════════════════════════ */

async function refreshRatings() {
  const btn = document.getElementById('rf-btn');
  const msg = document.getElementById('top-msg');
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'Getting current ratings from FargoRate…';
  tcStatusHook = m => { if (m) msg.textContent = m; };

  let idx;
  try { idx = await loadIndex({ fresh: true, pass: pass() }); }
  catch (e) { idx = null; }
  btn.disabled = false;
  if (!idx || !idx.length) {
    msg.textContent = 'Could not get ratings from FargoRate. Try again in a minute.';
    msg.className = 'msg bad';
    return;
  }
  msg.textContent = '';

  const byName = {};
  idx.forEach(p => { byName[p.name.toLowerCase()] = p; });

  const teams = [], missing = [];
  DATA.teams.forEach(t => {
    const changes = [];
    t.players.forEach((p, i) => {
      const hit = byName[p.name.toLowerCase()];
      if (!hit) { missing.push({ team: t.team, name: p.name, rating: p.rating }); return; }
      if (hit.rating !== p.rating) changes.push({ i, name: p.name, from: p.rating || 0, to: hit.rating, division: hit.division, hand: !p.division });
    });
    if (changes.length) teams.push({ id: t.id, team: t.team, players: t.players, changes });
  });

  PENDING = { teams, missing, at: indexAt || Date.now() };
  showRefresh();
}

function refreshTotal(t, onlyTicked) {
  const list = t.players.map((p, i) => {
    const c = t.changes.find(x => x.i === i);
    const use = c && (!onlyTicked || c.on !== false);
    return { name: p.name, rating: use ? c.to : p.rating };
  });
  return tcTeamRating(list);
}

function showRefresh() {
  const P = PENDING;
  const n = P.teams.reduce((k, t) => k + t.changes.length, 0);
  document.getElementById('rf-card').style.display = '';
  document.getElementById('rf-meta').textContent = 'FargoRate read ' + when(P.at);

  let html = '';
  if (!n) html += '<div class="rf-note"><b>No changes.</b> Every player found on FargoRate already has their current rating.</div>';

  html += P.teams.map((t, ti) => {
    const before = tcTeamRating(t.players), after = refreshTotal(t, true);
    return `<div class="rf-team">
      <div class="hd">
        <span class="nm">${esc(t.team)}</span>
        <span class="tot">Handicap ${fmt(before)} &rarr; <b>${fmt(after)}</b></span>
      </div>
      ${t.changes.map((c, ci) => `
        <label class="rf-ch">
          <input type="checkbox" data-t="${ti}" data-c="${ci}"${c.on === false ? '' : ' checked'}>
          <span class="n">${esc(c.name)}</span>
          <span class="v">${c.from || '—'} &rarr; <span class="${c.to > c.from ? 'up' : 'dn'}">${c.to}</span></span>
          ${c.hand ? '<span class="hand">was entered by hand — check it’s the same person</span>' : ''}
        </label>`).join('')}
    </div>`;
  }).join('');

  if (P.missing.length) {
    html += '<div class="rf-note"><b>Not found on FargoRate, left as they are:</b> ' +
      P.missing.map(m => esc(m.name) + ' (' + esc(m.team) + ', ' + (m.rating || 'no rating') + ')').join(' &middot; ') +
      '<br>Fix these with Edit on the team.</div>';
  }
  document.getElementById('rf-rows').innerHTML = html;

  document.querySelectorAll('#rf-rows input[type=checkbox]').forEach(box => box.onchange = () => {
    P.teams[+box.dataset.t].changes[+box.dataset.c].on = box.checked;
    showRefresh();
  });

  const ticked = P.teams.reduce((k, t) => k + t.changes.filter(c => c.on !== false).length, 0);
  document.getElementById('rf-save').textContent = ticked
    ? 'Save ' + ticked + (ticked === 1 ? ' change' : ' changes')
    : 'Save — mark ratings as of ' + new Date(P.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  document.getElementById('rf-msg').textContent = '';
  document.getElementById('rf-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelRefresh() {
  PENDING = null;
  document.getElementById('rf-card').style.display = 'none';
}

async function saveRefresh() {
  const P = PENDING;
  const msg = document.getElementById('rf-msg');
  const btn = document.getElementById('rf-save');
  btn.disabled = true;
  let done = 0, failed = [];

  for (const t of P.teams) {
    const ticked = t.changes.filter(c => c.on !== false);
    if (!ticked.length) continue;
    const players = t.players.map((p, i) => {
      const c = ticked.find(x => x.i === i);
      return c ? { name: p.name, rating: c.to, division: c.division } : p;
    });
    msg.className = 'msg';
    msg.textContent = 'Saving ' + t.team + '…';
    const r = await tcSend('PUT', { e: E, id: t.id, players }, pass()).catch(() => ({}));
    if (r.ok) done++; else failed.push(t.team);
  }

  await tcSend('PUT', { e: E, settings: { ratingsAt: P.at } }, pass()).catch(() => ({}));
  btn.disabled = false;

  if (failed.length) {
    msg.textContent = 'These did not save: ' + failed.join(', ') + '. Try again.';
    msg.className = 'msg bad';
    return;
  }
  cancelRefresh();
  await load();
  const top = document.getElementById('top-msg');
  top.className = 'msg';
  top.textContent = done ? done + (done === 1 ? ' team' : ' teams') + ' updated. Reprint any rosters you already printed.' : 'Ratings marked as of ' + when(P.at) + '.';
}

/* Wins come in all day — keep the list current while nobody is editing. */
setInterval(() => {
  if (pass() && !EDITING && !PENDING && document.getElementById('admin').style.display !== 'none' && !document.hidden) load();
}, 30000);

/* Signed in on leagueadmin.html already? Straight in. */
if (pass()) load().then(ok => {
  if (ok) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('admin').style.display = '';
    document.getElementById('signout').style.display = '';
  }
});
