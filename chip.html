<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chip Tournament — Kemmerer Pool League</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='22' fill='white'/><text x='50' y='58' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23111'>8</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414; --bg2: #1e1e1e; --bg3: #262626; --bg4: #2e2e2e;
    --border: #363636; --border2: #464646;
    --text: #ffffff; --text2: #b0a898; --text3: #666058;
    --accent: #27855a; --cream: #e8ddd0; --green2: #32a870; --loss: #cc4444;
    --on-accent: #ffffff;
    --seat-tint: rgba(50,168,112,.12);
    --radius: 8px; --radius-sm: 5px;
  }
  html[data-theme="light"] {
    --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae6df; --bg4: #ddd8ce;
    --border: #d6d0c5; --border2: #bcb4a6;
    --text: #1a1714; --text2: #5a5348; --text3: #8b8376;
    --accent: #1f6b48; --cream: #2b2419; --green2: #1a7a4e; --loss: #b23636;
    --seat-tint: rgba(31,107,72,.10);
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); }
  .header-felt { height: 6px; background: repeating-linear-gradient(90deg,#1a5c32 0,#154d28 4px,#1a5c32 8px); opacity: .5; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 12px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 10px; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
  .theme-btn { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-size: 13px; padding: 0; }
  .theme-btn:hover { background: var(--bg4); color: var(--text); }

  main { padding: 22px 0 70px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-meta { font-size: 12px; color: var(--text3); }
  .pad { padding: 18px; }
  .setup-head { cursor: pointer; user-select: none; }
  .setup-head:hover .card-title { color: var(--green2); }
  .head-right { display: flex; align-items: center; gap: 11px; }
  .chev { font-size: 20px; line-height: 1; color: var(--text2); display: inline-block; transition: transform .18s; }
  /* Collapsed after the draw — the setup is done, the bracket is the point. */
  .setup-card.collapsed .pad { display: none; }
  .setup-card.collapsed .chev { transform: rotate(-90deg); }

  label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font-family: inherit; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .fee-row { margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .fee-input { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
  .fee-input:focus-within { border-color: var(--accent); }
  .fee-input span { color: var(--text3); font-size: 14px; }
  .fee-input input { width: 76px; border: none; background: none; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 9px 0; }
  .fee-input input:focus { outline: none; }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green2); margin-right: 7px; vertical-align: middle;
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .notice-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px; color: var(--text2); font-size: 14px; }
  .th-live { color: var(--green2); font-weight: 600; }
  .ro-banner { padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--accent);
    border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2);
    font-size: 13px; font-weight: 500; }
  body.read-only .slot { cursor: default; }
  body.read-only .slot:hover:not(.locked) { background: none; }
  body.read-only .payout .place, body.read-only .payout .amt { cursor: default; }
  body.read-only .payout .place:hover, body.read-only .payout .amt:hover { background: none; }

  .code-entry { max-width: 380px; margin: 7vh auto 40px; }
  .code-entry .pad { padding: 22px; }
  .code-entry label.fl { text-align: center; margin-bottom: 10px; }
  /* min-width:0 matters — an input won't shrink below its intrinsic size
     otherwise, which pushed the button outside the card. */
  .code-input { display: block; width: 100%; min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 30px; font-weight: 700; letter-spacing: .34em; text-indent: .34em;
    text-align: center; text-transform: uppercase; color: var(--cream);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 10px; }
  .code-input::placeholder { color: var(--text3); }
  .code-input:focus { outline: none; border-color: var(--accent); }
  .code-go { display: block; width: 100%; margin-top: 12px; padding: 13px;
    font-size: 15px; text-align: center; }
  .code-help { margin-top: 14px; text-align: center; font-size: 12px;
    color: var(--text3); line-height: 1.6; }
  .code-entry .hint:not(:empty) { margin-top: 10px; text-align: center; }

  /* ── Tournament header ── */
  .tourney-head { display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .th-name { font-size: 20px; font-weight: 700; color: var(--cream); line-height: 1.2; }
  .th-meta { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .th-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
  .th-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── Saving ── */
  .name-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .tname { width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; }
  .tname:focus { outline: none; border-color: var(--accent); }
  .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    color: var(--text2); background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 12px; letter-spacing: .04em; }
  .saved-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .saved-row { display: flex; align-items: center; gap: 12px; padding: 11px 18px;
    background: var(--bg2); font-size: 14px; flex-wrap: wrap; }
  .saved-row .sn { flex: 1; min-width: 140px; color: var(--cream); font-weight: 600; }
  .saved-row .sm { font-size: 11px; color: var(--text3); }
  .saved-row .sid { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text3); }
  .saved-row.current { border-left: 3px solid var(--accent); }
  .saved-empty { padding: 20px 18px; color: var(--text3); font-size: 13px; background: var(--bg2); }

  /* ── Payouts ── */
  .payouts { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .payout { flex: 1; min-width: 128px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); padding: 12px 14px; }
  .payout .place { font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text3); }
  .payout .amt { font-size: 22px; font-weight: 700; color: var(--cream); margin-top: 3px;
    font-variant-numeric: tabular-nums; }
  .payout .place, .payout .amt { cursor: pointer; border-radius: 3px; }
  .payout .place:hover, .payout .amt:hover { background: var(--bg3); }
  .payout.add { flex: 0 0 auto; min-width: 48px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-family: inherit; color: var(--text3);
    cursor: pointer; border: 1px dashed var(--border2); border-radius: var(--radius-sm);
    background: none; padding: 12px 14px; }
  .payout.add:hover { color: var(--green2); border-color: var(--accent); }
  .pay-input { width: 100%; font-family: inherit; background: var(--bg2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; }
  .pay-input:focus { outline: none; }
  .pay-input.place, .pay-input.label { font-size: 11px; font-weight: 700; letter-spacing: .09em; }
  .pay-input.amt { font-size: 20px; font-weight: 700; }
  .payout-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 0 18px 16px; }
  .tally { font-size: 12px; font-weight: 600; }
  .tally.ok { color: var(--text3); }
  .tally.off { color: var(--loss); }
  .linkish { background: none; border: none; font-family: inherit; font-size: 12px;
    color: var(--text3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkish:hover { color: var(--text); }
  .payout.first { border-color: var(--accent); }
  .payout.first .amt { color: var(--green2); }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 18px; }
  .setup-card:not(.collapsed) .btn-row { border-top: 1px solid var(--border); }
  button.act { font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: .03em;
    padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text2); transition: background .15s, color .15s; }
  button.act:hover { background: var(--bg4); color: var(--text); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.act.primary:hover { opacity: .87; color: var(--on-accent); }
  button.act:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 12px; color: var(--text3); }

  /* ── Bracket ── */
  .bracket-scroll { overflow-x: auto; padding: 4px 18px 22px; }
  /* Positions are computed in JS and set inline — flexbox can't align a bracket
     reliably once rounds stop halving (losers-bracket major rounds feed 1:1). */
  .canvas { position: relative; min-width: min-content; }
  .round-label { position: absolute; top: 0; font-size: 10px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--text3);
    text-align: center; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .line { position: absolute; background: var(--border2); }
  .match { position: absolute; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  .match.decided { border-color: var(--border2); }
  .match.ready { border-color: var(--accent); }
  .match-no { position: absolute; top: -1px; left: -1px; font-size: 9px; font-weight: 700;
    background: var(--bg3); color: var(--text3); padding: 1px 5px; border-radius: var(--radius-sm) 0 var(--radius-sm) 0;
    letter-spacing: .04em; }
  .slot { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 9px 0 26px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .slot:last-child { border-bottom: none; }
  .slot:hover:not(.locked) { background: var(--bg3); }
  .slot .nm { font-weight: 600; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.won .nm { color: var(--green2); }
  .slot.lost .nm { color: var(--text3); text-decoration: line-through; }
  .slot.empty .nm, .slot.bye .nm { color: var(--text3); font-weight: 400; font-style: italic; }
  .slot .src { font-size: 11px; font-weight: 600; font-style: normal; letter-spacing: .04em;
    color: var(--text3); opacity: .8; }
  .slot.locked { cursor: default; }
  .slot.bye.open { cursor: pointer; }
  .slot.bye.open .nm { color: var(--accent); font-style: normal; font-weight: 600; }
  .slot.bye.open:hover { background: var(--bg3); }
  .slot-input { width: 100%; font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--cream); background: var(--bg2); border: 1px solid var(--accent);
    border-radius: 3px; padding: 3px 6px; }
  .slot-input:focus { outline: none; }
  .race-box { width: 24px; height: 21px; flex-shrink: 0; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg2); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; color: var(--text2);
    font-variant-numeric: tabular-nums; }
  .slot.won .race-box { border-color: var(--accent); color: var(--green2); }

  .gf-col { border-left: 1px solid var(--border); padding-left: 26px; }
  .gf-col .round-label { color: var(--accent); }
  .champion { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px;
    border: 1px solid var(--accent); border-radius: var(--radius); background: var(--bg2); margin-bottom: 18px; }
  .champion .lbl { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); }
  .champion .nm { font-size: 24px; font-weight: 700; color: var(--green2); }

  .empty-state { padding: 46px 18px; text-align: center; color: var(--text3); font-size: 14px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    h1 { font-size: 18px; }
    .round { min-width: 165px; }
  }

  /* ── Print: this gets taped to the wall and written on in pen ── */
  @media print {
    @page { size: landscape; margin: 0.4in; }
    :root, html[data-theme="light"], html[data-theme="dark"] {
      --bg: #fff; --bg2: #fff; --bg3: #f2f2f2; --bg4: #eee;
      --border: #999; --border2: #666;
      --text: #000; --text2: #222; --text3: #555;
      --accent: #000; --cream: #000; --green2: #000; --loss: #000; --on-accent: #000;
    }
    html, body { background: #fff; font-size: 9.5pt; }
    header, .setup-card, .btn-row, .theme-btn, .header-felt,
    #saved-panel, .payout.add, .linkish, .th-actions { display: none !important; }
    .th-name { font-size: 15pt; color: #000; }
    .th-meta { font-size: 8pt; color: #555; }
    main { padding: 0; }
    .wrap { max-width: none; padding: 0; }
    .card { border: none; margin-bottom: 10px; break-inside: avoid; }
    .card-header { background: transparent; border-bottom: 1px solid #000; padding: 0 0 4px; }
    .card-title { font-size: 11pt; }
    .bracket-scroll { overflow: visible; padding: 8px 0 0; }
    /* Browsers drop background colors when printing, and the connectors are
       colored divs — without this the bracket prints as boxes with no lines. */
    .line { background: #000 !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .race-box, .match { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Canvas widths are fixed pixels, so shrink to fit the page. zoom reflows
       (transform would leave the original height as blank space). */
    .canvas { zoom: .74; }
    .match { break-inside: avoid; }
    .slot { padding: 5px 7px 5px 22px; min-height: 26px; }
    .slot.won .nm { font-weight: 700; }
    .slot.lost .nm { text-decoration: line-through; }
    .race-box { border: 1px solid #666; color: #000; }
    .champion { border: 1px solid #000; }
    .print-head { display: block !important; }
  }
  footer { border-top: 1px solid var(--border); padding: 18px 0; text-align: center;
    font-size: 11px; color: var(--text3); letter-spacing: .05em; }
  .print-head { display: none; margin-bottom: 10px; }
  .print-head .t { font-size: 14pt; font-weight: 700; }
  .print-head .d { font-size: 9pt; color: #555; }

  /* ── Add late player ── */
  .modal-back { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 80;
    background: rgba(0,0,0,.55); display: flex; align-items: flex-start;
    justify-content: center; padding: 8vh 16px 16px; overflow-y: auto; }
  .modal { width: 100%; max-width: 460px; background: var(--bg2);
    border: 1px solid var(--border2); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .modal-head { padding: 14px 18px; background: var(--bg3);
    border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600;
    color: var(--cream); border-radius: var(--radius) var(--radius) 0 0; }
  .late-in { width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; }
  .late-in:focus { outline: none; border-color: var(--accent); }
  .pen-row { display: flex; gap: 6px; }
  .pen { flex: 1; font-family: inherit; font-size: 12px; font-weight: 600; padding: 9px 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text3); cursor: pointer; white-space: nowrap; }
  .pen.on { border-color: var(--accent); color: var(--green2); background: var(--seat-tint); }
  #late-results { margin-top: 10px; max-height: 250px; overflow-y: auto; }
  #late-results .res { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg);
    margin-bottom: 6px; cursor: pointer; }
  #late-results .res:hover, #late-results .res.sel { border-color: var(--accent); background: var(--bg3); }
  #late-results .rn { flex: 1; min-width: 0; color: var(--cream); font-weight: 600; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #late-results .rd { font-size: 11px; color: var(--text3); white-space: nowrap; }
  #late-results .rf { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #late-results .rc2 { font-size: 11px; font-weight: 700; color: var(--green2); white-space: nowrap; }
  @media print { .modal-back { display: none !important; } }

  /* ── Chip board ──
     Players down the left with their chips, tables on the right — the whole
     field readable at a glance. Stacks on a phone, tables first, since whoever
     is scoring is walking between them. */
  .split { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 18px; align-items: start; }
  @media (max-width: 820px) {
    .split { grid-template-columns: 1fr; }
    .col-tables { order: -1; }
  }

  .plist { max-height: none; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); font-size: 14px; }
  .prow:last-child { border-bottom: none; }
  .prow.out { opacity: .5; }
  .prow .pn { flex: 1; min-width: 0; color: var(--cream); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow.out .pn { text-decoration: line-through; font-weight: 400; }
  /* Record, win %, best run — fixed widths so the three columns line up down
     the list and match the legend above them. */
  .pstats { display: inline-flex; align-items: center; gap: 8px; flex: none;
    font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  .pstats > span { display: inline-block; text-align: right; }
  .prow .pw { width: 34px; }
  .prow .ppc { width: 38px; }
  .prow .pst { width: 24px; }
  .prow .pst.hot { color: var(--green2); font-weight: 700; }
  .prow.out .pst.hot { font-weight: 600; }
  .sl { display: none; }                       /* label shows on phones only */
  /* The legend sits over the three columns and is padded to clear the tag and
     the edit controls, so the headings sit above the numbers they name. */
  .stat-legend { display: flex; justify-content: flex-end; gap: 8px;
    padding: 6px 16px 6px 0; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border);
    white-space: nowrap; }
  .stat-legend span { display: inline-block; text-align: right; }
  .stat-legend .l1 { width: 34px; } .stat-legend .l2 { width: 38px; } .stat-legend .l3 { width: 24px; }
  .prow .pl { width: 22px; font-size: 12px; font-weight: 700; color: var(--text3);
    font-variant-numeric: tabular-nums; }
  .prow .tag { width: 82px; text-align: center; }
  /* Anyone on a table is tinted, and each pair is separated so the two players
     at a table read as a unit. */
  .prow.seated { background: var(--seat-tint); }
  .prow.seated .pn { color: var(--green2); }
  .prow.table-start { border-top: 2px solid var(--border2); }
  .prow.armed { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rowctl { display: inline-flex; gap: 4px; flex: none; }
  .adj { background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--text3); min-width: 28px; height: 28px; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0; font-family: inherit; }
  .adj:hover:not(:disabled) { border-color: var(--accent); color: var(--green2); }
  .adj:disabled { opacity: .3; cursor: default; }
  .adj.armed { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }
  .edit-note { padding: 9px 16px; font-size: 12px; color: var(--text2);
    background: var(--seat-tint); border-bottom: 1px solid var(--border); }
  .edit-note strong { color: var(--green2); }

  /* A filled circle is a chip in hand; an empty one is a chip already lost. */
  .chips { display: inline-flex; gap: 3px; flex: none; align-items: center; }
  /* flex:none matters — inside a flex row the dots would otherwise be squeezed
     to different widths depending on how long the name beside them is. */
  .chip { flex: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--green2); border: 1.5px solid var(--green2); box-sizing: border-box; }
  .chip.spent { background: transparent; }

  .tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 99px; border: 1px solid var(--border2);
    color: var(--text3); white-space: nowrap; }
  .tag.on { border-color: var(--accent); color: var(--green2); }
  .tag.next { border-color: var(--border2); color: var(--text2); }
  .tag.out { border-color: var(--border); color: var(--text3); }

  .tables-pad { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  .table-card { border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); overflow: hidden; }
  .table-card.idle { opacity: .5; }
  .table-head { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 11px; background: var(--bg3); border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text3); }
  .table-timer { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .table-timer.over { color: var(--loss); }
  .seat { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 11px; background: none; border: none;
    border-bottom: 1px solid var(--border); font-family: inherit; font-size: 14px;
    text-align: left; color: var(--cream); font-weight: 600; }
  .seat:last-child { border-bottom: none; }
  .seat .sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat.playable { cursor: pointer; }
  .seat.playable:hover { background: var(--bg3); }
  .seat.empty { color: var(--text3); font-weight: 400; font-style: italic; }

  .queue-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px; }
  .qchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 99px; background: var(--bg); font-size: 13px; }
  .qchip .qn { color: var(--cream); font-weight: 600; }
  .qchip.next { border-color: var(--accent); }

  .ticker { padding: 9px 16px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid var(--border); background: var(--bg); }
  .ticker strong { color: var(--cream); }

  @media (max-width: 560px) {
    .seat { padding: 14px 12px; font-size: 15px; }     /* bigger thumb target */
    /* Name, chips and where they are stay on the first line; the three stats
       drop underneath with their labels, rather than squeezing the name down
       to a couple of letters. */
    .prow { flex-wrap: wrap; row-gap: 5px; }
    .prow .pstats { flex-basis: 100%; order: 9; justify-content: flex-start; gap: 14px; }
    .prow .rowctl { order: 8; }
    .pstats > span, .prow .pw, .prow .ppc, .prow .pst { width: auto; text-align: left; }
    .sl { display: inline; font-style: normal; font-size: 10px; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase; opacity: .75; margin-right: 5px; }
    .stat-legend { display: none; }
  }
  @media print {
    .split { grid-template-columns: 1fr 300px; }
    .seat.playable { cursor: default; }
    .th-actions { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-felt"></div>
  <div class="wrap">
    <div class="header-inner">
      <div>
        <h1>Chip Tournament</h1>
        <div class="sub">Winner Stays On · Single Games</div>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark">🌙</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <div class="card code-entry" id="code-entry">
    <div class="card-header"><span class="card-title">Open a tournament</span></div>
    <div class="pad">
      <label class="fl" for="code-in">Tournament code</label>
      <input id="code-in" class="code-input" type="text" maxlength="9" size="4" spellcheck="false"
        autocomplete="off" autocapitalize="characters" placeholder="ABCD"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')goToCode()">
      <button class="act primary code-go" onclick="goToCode()">Open</button>
      <div class="hint" id="hint"></div>
      <div class="hint" id="saved-note"></div>
      <div class="code-help">Four characters, from the officer running the tournament.</div>
    </div>
  </div>

  <div id="out"></div>
  <input type="hidden" id="tname"><span id="tid" style="display:none"></span>
  <input type="hidden" id="fee"><input type="hidden" id="bar">

</div>
</main>

<footer>
  <div class="wrap">Kemmerer Pool League &nbsp;·&nbsp; Chip Tournament &nbsp;·&nbsp; v1.14</div>
</footer>

<script>
/* ── Theme ── */
function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('kpl-theme', t); } catch(e) {}
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = t === 'light' ? '☀' : '🌙';
}
function toggleTheme() { applyTheme(isLight() ? 'dark' : 'light'); }
(function () {
  let saved = null;
  try { saved = localStorage.getItem('kpl-theme'); } catch(e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => applyTheme(saved));
})();

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── Chip tournament engine ──
   Winner stays at the table. The loser drops a chip and joins the back of the
   queue, or is out at zero. The next player in the queue comes down to that
   table. As players are knocked out the field collapses onto fewer tables
   rather than leaving one sitting idle.

   State shape:
     roster    [{ name, rating, chips, start, draw, wins, losses, run, best, outAt }]
               run  = games won in a row right now, reset to zero on a loss
               best = longest run reached at any point tonight, never goes down
     tables    [[nameOrNull, nameOrNull], ...]   index = table number - 1
     queue     [name, ...]                       front of the queue is index 0
     outOrder  [name, ...]                       knocked out, earliest first
     log       [{ winner, loser, table, at }]
*/

/* Bands are set when the tournament is created and travel with it, so a late
   arrival is given chips on the same scale as everyone else. */
const STANDARD_BANDS = [
  { max: 375, chips: 6 }, { max: 499, chips: 5 }, { max: 575, chips: 4 },
  { max: 625, chips: 3 }, { max: 700, chips: 2 }, { max: null, chips: 1 },
];

const chipsFor = (rating, list) => {
  const r = Number(rating) || 0;
  const rows = (list && list.length) ? list : STANDARD_BANDS;
  for (const b of rows) if (b.max === null || b.max === undefined || r <= b.max) return b.chips;
  return rows[rows.length - 1].chips;
};

const alive = (S) => S.roster.filter(p => p.chips > 0);
const playerOf = (S, name) => S.roster.find(p => p.name === name);

/* Seats waiting players and folds the field onto fewer tables as it shrinks.
   Tables mid-match are never disturbed — only ones with an empty seat. */
function rebalance(S) {
  const live = alive(S).length;
  const wanted = Math.max(1, Math.min(S.tableCount, Math.floor(live / 2)));

  // Tables with two players are mid-match and are never disturbed.
  const busy = S.tables.map(t => !!(t[0] && t[1]));
  let active = busy.filter(Boolean).length;

  // A winner sitting alone keeps their table and takes the next in line —
  // lowest table number first when several free up at once.
  for (let t = 0; t < S.tables.length && S.queue.length; t++) {
    if (busy[t] || active >= wanted) continue;
    const sitting = S.tables[t].filter(Boolean);
    if (sitting.length !== 1) continue;
    S.tables[t] = [sitting[0], S.queue.shift()];
    busy[t] = true; active++;
  }

  // Anyone still on their own has nobody left to play. Close that table and put
  // them at the front of the queue rather than leaving them stranded there.
  const stranded = [];
  S.tables.forEach((t, i) => {
    if (busy[i]) return;
    t.forEach(n => { if (n) stranded.push(n); });
    S.tables[i] = [null, null];
  });
  if (stranded.length) {
    S.queue = [...stranded, ...S.queue.filter(n => !stranded.includes(n))];
  }

  // Then seat whole pairs from the front of the queue, lowest table first. This
  // is what folds the field onto fewer tables as players are knocked out.
  for (let t = 0; t < S.tables.length; t++) {
    if (busy[t] || active >= wanted || S.queue.length < 2) continue;
    S.tables[t] = [S.queue.shift(), S.queue.shift()];
    busy[t] = true; active++;
  }
  return S;
}

function buildChip(players, tableCount, rand = Math.random) {
  const names = players.map(p => p.name);
  for (let i = names.length - 1; i > 0; i--) {       // shuffle for the draw
    const j = Math.floor(rand() * (i + 1));
    [names[i], names[j]] = [names[j], names[i]];
  }
  const roster = names.map((name, i) => {
    const src = players.find(p => p.name === name) || {};
    const c = chipsFor(src.rating);
    return { name, rating: src.rating || 0, chips: c, start: c,
             draw: i + 1, wins: 0, losses: 0, run: 0, best: 0, outAt: null };
  });
  const S = { tableCount, roster, tables: Array.from({ length: tableCount }, () => [null, null]),
              queue: [...names], outOrder: [], log: [] };
  return rebalance(S);
}

/* Records a single game. `winnerName` must be one of the two at that table. */
function reportWin(S, tableIdx, winnerName) {
  const seat = S.tables[tableIdx];
  if (!seat || !seat[0] || !seat[1]) return { ok: false, why: 'That table has no match on it.' };
  if (!seat.includes(winnerName)) return { ok: false, why: 'That player is not at this table.' };

  const loserName = seat[0] === winnerName ? seat[1] : seat[0];
  const w = playerOf(S, winnerName), l = playerOf(S, loserName);
  w.wins++; l.losses++;
  // The run is the winner's current stay at the table; best is the high-water
  // mark for the whole session, so it stands even after they lose the table.
  w.run = (w.run || 0) + 1;
  if (w.run > (w.best || 0)) w.best = w.run;
  l.run = 0;
  l.chips--;                                          // the winner never gains one

  S.log.unshift({ winner: winnerName, loser: loserName, table: tableIdx + 1, at: Date.now() });

  if (l.chips <= 0) {
    l.chips = 0;
    l.outAt = S.outOrder.length + 1;
    S.outOrder.push(loserName);                       // knocked out, earliest first
  } else {
    S.queue.push(loserName);                          // back of the line
  }

  S.tables[tableIdx] = [winnerName, null];            // winner stays on
  return { ok: true, loser: loserName, eliminated: l.chips === 0, state: rebalance(S) };
}

/* Placements are reverse elimination order: last one standing wins, the last
   player knocked out is 2nd, and so on back down the list. */
function standings(S) {
  const left = alive(S).map(p => p.name);
  const order = [...left.sort((a, b) => playerOf(S, b).chips - playerOf(S, a).chips),
                 ...[...S.outOrder].reverse()];
  return order.map((name, i) => ({ place: i + 1, ...playerOf(S, name) }));
}

/* Win percentage is of games played, not of the field — a player who has not
   been to the table yet has no percentage rather than a zero. */
function winPct(p) {
  const played = (p.wins || 0) + (p.losses || 0);
  return played ? Math.round((p.wins / played) * 100) : null;
}

/* A tournament started on an older version has no run/best on its players.
   The result log carries every game in order, so the streaks can be replayed
   out of it. The log is trimmed at 200 entries, so on a very long night this
   is a floor rather than gospel — from here on the numbers are kept live. */
function backfillStreaks(S) {
  if (!S || !S.roster || !S.roster.length) return S;
  if (S.roster.every(p => p.best !== undefined && p.run !== undefined)) return S;
  S.roster.forEach(p => { p.run = 0; p.best = 0; });
  const games = [...(S.log || [])].filter(e => !e.manual && e.winner).reverse();
  for (const g of games) {
    const w = playerOf(S, g.winner), l = playerOf(S, g.loser);
    if (w) { w.run++; if (w.run > w.best) w.best = w.run; }
    if (l) l.run = 0;
  }
  return S;
}

const isOver = (S) => alive(S).length <= 1;
const champion = (S) => isOver(S) ? (alive(S)[0] || {}).name || null : null;

/* Chips left is the clearest measure of how far along the night is — it counts
   down to exactly zero. */
function sessionStats(S) {
  const live = alive(S);
  return {
    registered: S.roster.length,
    distributed: S.roster.reduce((a, p) => a + p.start, 0),
    remaining: S.roster.reduce((a, p) => a + p.chips, 0),
    playersLeft: live.length,
    matches: S.log.length,
    inPlay: S.tables.filter(t => t[0] && t[1]).length,
    waiting: S.queue.length,
  };
}

/* ── Payouts ──
   First takes half the pot. The other half splits two-thirds / one-third between
   second and third — the same as a straight 1/2, 1/3, 1/6 of the whole.
   First and second round to the nearest $5 so they're payable in bills; third
   absorbs the difference, keeping the three payouts equal to what was collected. */
const ORDINALS = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];

/* The suggested split when you pick a number of spots: first takes half, and
   the other half is shared among the rest in descending weights. At three spots
   that lands exactly on the league's usual 50 / 33.33 / 16.67. */
function suggestedSplit(spots) {
  const n = Math.max(1, Math.min(10, spots | 0));
  if (n === 1) return [100];
  const weights = [];
  for (let i = 1; i < n; i++) weights.push(n - i);
  const total = weights.reduce((a, b) => a + b, 0);
  return [50, ...weights.map(w => (w / total) * 50)];
}

const DEFAULT_PAYOUTS = suggestedSplit(3).map((pct, i) => ({ label: ORDINALS[i], pct }));

/* Percentages in, dollars out. Every spot rounds to the nearest $5 so it can be
   paid in bills, and the last one absorbs the difference — so the payouts always
   add up to exactly what was collected. */
function computePayouts(players, feeDollars, addOnDollars, spec) {
  const entries = Math.round(players * feeDollars * 100);    // cents, no float drift
  const addOn   = Math.round((addOnDollars || 0) * 100);
  const pot     = entries + addOn;
  if (pot <= 0) return null;

  const rows = (spec && spec.length ? spec : DEFAULT_PAYOUTS)
    .map(r => ({ label: r.label, pct: Number(r.pct) || 0 }));
  const to5 = (cents) => Math.round(cents / 500) * 500;

  let out = rows.map(r => ({ label: r.label, cents: to5(pot * r.pct / 100) }));

  // On a small pot the lower places can round away to nothing. Drop them rather
  // than listing someone for $0 — this has to catch middle places too, not just
  // the tail, since the last place is about to absorb the remainder.
  out = out.filter((r, i) => i === 0 || r.cents > 0);

  for (;;) {
    const others = out.slice(0, -1).reduce((a, r) => a + r.cents, 0);
    out[out.length - 1].cents = pot - others;          // last place takes the remainder
    if (out.length === 1 || out[out.length - 1].cents > 0) break;
    out.pop();
  }
  return { pot, entries, addOn, rows: out };
}

const money = (cents) => {
  const v = cents / 100;
  return '$' + (Number.isInteger(v) ? v.toLocaleString('en-US')
                                    : v.toLocaleString('en-US', { minimumFractionDigits: 2 }));
};

/* The generator seeds the split; from there every line is editable and you can
   add your own (Top Lady, high break, whatever). Once anything is touched the
   card stops recalculating so an edit can't be wiped by a fee change. */
function autoPayouts(players, fee, addOn) {
  const p = computePayouts(players, fee, addOn, S && S.payoutSpec);
  return p ? p.rows : [];
}

function payoutRows(players, fee, addOn) {
  if (!S.payoutsManual) return autoPayouts(players, fee, addOn);
  return S.payoutsManual;
}

// Copy the computed rows into an editable set the first time anything changes.
function goManual(players, fee, addOn) {
  if (!S.payoutsManual) S.payoutsManual = autoPayouts(players, fee, addOn);
  return S.payoutsManual;
}

function editPayout(idx, field) {
  if (readOnly) return;
  const el = document.querySelector(`.payout[data-idx="${idx}"] .${field === 'label' ? 'place' : 'amt'}`);
  if (!el || el.querySelector('input')) return;
  const rows = goManual(lastPayoutCtx.players, lastPayoutCtx.fee, lastPayoutCtx.addOn);
  const row = rows[idx];
  if (!row) return;

  const val = field === 'label' ? row.label : (row.cents / 100);
  el.innerHTML = `<input class="pay-input ${field}" value="${esc(val)}"
    ${field === 'amt' ? 'type="number" step="5" min="0"' : 'spellcheck="false"'}>`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();

  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    if (save) {
      if (field === 'label') {
        const t = inp.value.trim();
        if (!t) rows.splice(idx, 1);            // clearing the label removes the line
        else row.label = t;
      } else {
        row.cents = Math.round((parseFloat(inp.value) || 0) * 100);
      }
    }
    render();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit(true);
    if (e.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', () => commit(true));
}

function addPayout() {
  if (readOnly) return;
  const rows = goManual(lastPayoutCtx.players, lastPayoutCtx.fee, lastPayoutCtx.addOn);
  rows.push({ label: 'Prize', cents: 0 });
  render();
  editPayout(rows.length - 1, 'label');
}

function resetPayouts() { S.payoutsManual = null; render(); }

let lastPayoutCtx = { players: 0, fee: 0, addOn: 0 };

function payoutHTML(players, feeDollars, addOnDollars, champ) {
  lastPayoutCtx = { players, fee: feeDollars, addOn: addOnDollars };
  const p = computePayouts(players, feeDollars, addOnDollars, S && S.payoutSpec);
  if (!p) return '';
  const rows = payoutRows(players, feeDollars, addOnDollars);
  const paid = rows.reduce((a, r) => a + r.cents, 0);
  const off  = paid - p.pot;

  const breakdown = `${players} × ${money(Math.round(feeDollars*100))}`
    + (p.addOn ? ` + ${money(p.addOn)} bar` : '')
    + ` = ${money(p.pot)} pot`;

  const tally = off === 0
    ? `<span class="tally ok">Paying out ${money(paid)} — balanced</span>`
    : `<span class="tally off">Paying out ${money(paid)} — ${off > 0 ? money(off) + ' over' : money(-off) + ' left'}</span>`;

  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Payouts</span>
      <span class="card-meta">${breakdown}</span>
    </div>
    <div class="payouts">
      ${rows.map((r, i) => `<div class="payout${i === 0 ? ' first' : ''}" data-idx="${i}">
        <div class="place" onclick="editPayout(${i},'label')">${esc(r.label)}</div>
        <div class="amt" onclick="editPayout(${i},'amt')">${money(r.cents)}</div>
      </div>`).join('')}
      <button class="payout add" onclick="addPayout()" title="Add a payout">+</button>
    </div>
    <div class="payout-foot">
      ${tally}
      ${S.payoutsManual ? `<button class="linkish" onclick="resetPayouts()">Reset to calculated</button>` : ''}
    </div>
  </div>`;
}

function onFeeChange() { updateCount(); if (S) render(); }

/* ── UI ── */
let S = null;                 // the session
let readOnly = true;
let serverCode = null, adminCode = null, livePoll = null, liveStamp = 0;

const fmtClock = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
};

/* Chips come off the left as they're lost, so the ones still in hand sit
   together on the right and every row lines up on its right edge. */
function chipDots(p) {
  const spent = p.start - p.chips;
  let out = '';
  for (let i = 0; i < p.start; i++) out += `<span class="chip${i < spent ? ' spent' : ''}"></span>`;
  return `<span class="chips" title="${p.chips} of ${p.start} chips left">${out}</span>`;
}

/* Three numbers per player: record, win percentage, and the longest run of
   games they won without leaving the table tonight. The labels are markup so a
   phone can show them beside the numbers, where the header legend is too far
   away to read against. */
function statCells(p) {
  const pct = winPct(p);
  const best = p.best || 0;
  const played = (p.wins || 0) + (p.losses || 0);
  return `<span class="pstats">
    <span class="pw" title="${p.wins} won, ${p.losses} lost"><i class="sl">W&ndash;L</i>${p.wins}&ndash;${p.losses}</span>
    <span class="ppc" title="${played ? pct + '% of games won' : 'Not to the table yet'}"><i class="sl">Win %</i>${pct === null ? '&ndash;' : pct + '%'}</span>
    <span class="pst${best >= 3 ? ' hot' : ''}" title="${best ? 'Longest run tonight — ' + best + ' game' + (best === 1 ? '' : 's') : 'No run yet'}"><i class="sl">Best run</i>${best || '&ndash;'}</span>
  </span>`;
}

/* Reporting a winner: one press on the name of whoever won. */
function win(tableIdx, name) {
  if (readOnly || !S) return;
  const seat = S.tables[tableIdx] || [];
  const other = seat[0] === name ? seat[1] : seat[0];
  pushUndo(`${name} beat ${other}`);
  const r = reportWin(S, tableIdx, name);
  if (!r.ok) { note(r.why, true); return; }
  S.tableStarts = S.tableStarts || {};
  S.tableStarts[tableIdx] = Date.now();       // restart that table's clock
  note(r.eliminated ? `${name} beat ${r.loser} — ${r.loser} is out.`
                    : `${name} beat ${r.loser}.`);
  render();
  queuePush();
}

  if (readOnly || !S) return;
  latePenalty = 0;
  showLate();

/* ── Display names ──
   "Kirt C" fits a table card; "Kirt Connelly" does not. Done at render time so
   sessions created earlier, and names typed in by hand, read the same way. */
const NAME_SUFFIXES = ['jr', 'jr.', 'sr', 'sr.', 'ii', 'iii', 'iv'];


/* First name plus as much of the surname as it takes to be unique. */
function uniqueShort(first, last, taken) {
  const list = taken || [];
  for (let i = 1; i <= last.length; i++) {
    const cand = first + ' ' + last.slice(0, i);
    if (!list.some(t => String(t).toLowerCase() === cand.toLowerCase())) return cand;
  }
  return first + ' ' + last;
}

function shortenName(full, taken) {
  const raw = String(full || '').trim();
  // FargoRate carries nicknames in brackets — "Taydon (TK) Reilly". Everyone at
  // the bar calls him TK, so that's the name that goes on the sheet.
  const nick = (raw.match(/\(([^)]+)\)/) || [])[1];
  let parts = raw.replace(/\([^)]*\)/g, ' ').trim().split(/\s+/).filter(Boolean);
  while (parts.length > 2 && NAME_SUFFIXES.indexOf(parts[parts.length - 1].toLowerCase()) >= 0) parts.pop();
  if (nick) {
    if (!parts.length) return nick.trim();
    const surname = parts[parts.length - 1];
    return uniqueShort(nick.trim(), surname, taken);
  }
  if (parts.length < 2) return parts[0] || '';
  const first = parts[0], last = parts[parts.length - 1];
  return uniqueShort(first, last, taken);
}

let DISPLAY = {};
const disp = (n) => DISPLAY[n] || n;

function buildDisplayNames(names) {
  const map = {}, taken = [];
  names.filter(Boolean).forEach(full => {
    if (map[full]) return;
    const s = shortenName(full, taken);
    taken.push(s);
    map[full] = s;
  });
  return map;
}

/* Any division page carries the dropdown of what's currently running, which is
   how new seasons get picked up. Those are MERGED with the list above — a
   division that has finished still holds ratings for people who play in the
   next one, and dropping them loses hundreds of players. */
async function fetchDivisions() {
  const merged = new Map(DIVISIONS.map(d => [d[0], d[1]]));
  for (const seed of DIVISIONS.map(d => d[0])) {
    try {
      const r = await fetch(PROXY + encodeURIComponent(`${LMS}/LeagueReports/${seed}`));
      if (!r.ok) continue;
      const html = await r.text();
      const sel = html.match(/<select[^>]*id="division-list"[^>]*>([\s\S]*?)<\/select>/i);
      if (!sel) continue;
      let m, found = 0;
      const re = /<option[^>]*value="([0-9a-f-]{36})"[^>]*>([\s\S]*?)<\/option>/gi;
      while ((m = re.exec(sel[1]))) {
        merged.set(m[1], m[2].replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim());
        found++;
      }
      if (found) break;                       // one page lists them all
    } catch (e) { /* try the next seed */ }
  }
  return [...merged.entries()];
}

/* Ratings move once a week, so a day-old index is fine and saves rebuilding it
   on every visit. */
const INDEX_CACHE = 'kpl-fargo-index-v3';
const CACHE_HOURS = 24;

function readCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(INDEX_CACHE));
    if (!raw || !raw.at || !Array.isArray(raw.players)) return null;
    if (Date.now() - raw.at > CACHE_HOURS * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
}
function writeCache(players, divisions) {
  try {
    localStorage.setItem(INDEX_CACHE, JSON.stringify({ at: Date.now(), players, divisions }));
  } catch (e) { /* storage full or blocked — the index just rebuilds next time */ }
}


let playerIndex = null;      // [{name, rating, division}] across every division
let indexLoading = null;
let roster = [];             // [{name, rating, division|null}]

/* ── Fargo lookup ── */
function parsePlayerList(html, divLabel) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const table = d.querySelector('table');
  if (!table) return [];

  const rows = [...table.querySelectorAll('tr')];
  let headers = [...table.querySelectorAll('th')].map(th => th.textContent.trim());
  if (!headers.length && rows[0]) headers = [...rows[0].querySelectorAll('td')].map(td => td.textContent.trim());
  const ratingIdx = headers.findIndex(h => /rating|fargo/i.test(h));
  const nameIdx   = headers.findIndex(h => /name/i.test(h));

  const out = [];
  rows.slice(1).forEach(tr => {
    const cells = [...tr.querySelectorAll('td')].map(td => td.textContent.replace(/\s+/g,' ').trim());
    if (!cells.length) return;
    const raw = cells[nameIdx >= 0 ? nameIdx : 1] || cells[0];
    const rating = parseInt(cells[ratingIdx >= 0 ? ratingIdx : cells.length - 1], 10);
    if (!raw || !rating) return;
    // FargoRate lists names "Last, First" — flip for searching
    const name = /,\s/.test(raw) ? raw.replace(/^([^,]+),\s*(.+)$/, '$2 $1') : raw;
    out.push({ name, rating, division: divLabel });
  });
  return out;
}

async function loadIndex() {
  if (playerIndex) return playerIndex;
  if (indexLoading) return indexLoading;

  const cached = readCache();
  if (cached) {
    playerIndex = cached.players;
    lateStatus(`${playerIndex.length} players (saved earlier today)`);
    return playerIndex;
  }

  lateStatus('Loading player lists from FargoRate…');
  indexLoading = (async () => {
    const divisions = await fetchDivisions();
    const all = [];
    let failed = 0, done = 0;

    // Ninety-odd divisions at once would hammer the proxy, so go in small
    // batches and say how far along we are — it takes a moment the first time.
    const BATCH = 6;
    for (let i = 0; i < divisions.length; i += BATCH) {
      await Promise.all(divisions.slice(i, i + BATCH).map(async ([id, label]) => {
        try {
          const r = await fetch(PROXY + encodeURIComponent(`${LMS}/GeneratePlayerListReport/${id}`));
          if (!r.ok) throw new Error(r.status);
          all.push(...parsePlayerList(await r.text(), label));
        } catch (e) { failed++; }
        done++;
        lateStatus(`Loading players… ${done} of ${divisions.length} divisions`);
      }));
    }

    // Same player can appear in several divisions — keep the highest rating.
    const byKey = {};
    all.forEach(p => {
      const k = p.name.toLowerCase();
      if (!byKey[k] || p.rating > byKey[k].rating) byKey[k] = p;
    });
    playerIndex = Object.values(byKey).sort((a, b) => a.name.localeCompare(b.name));
    if (playerIndex.length) writeCache(playerIndex, divisions.map(d => d[1]));

    lateStatus(playerIndex.length
      ? `${playerIndex.length} players from ${divisions.length} divisions${failed ? ` · ${failed} unavailable` : ''}`
      : 'No players came back — check the proxy, or add players by hand.');
    return playerIndex;
  })();
  return indexLoading;
}

/* Chips for a rating under this tournament's own bands, less any late penalty. */
function chipsWithPenalty(rating) {
  return Math.max(1, chipsFor(rating, S.chipBands) - latePenalty);

          <span class="rc2">${n} chip${n === 1 ? '' : 's'}</span></div>`;
      }).join('')
    : `<div class="hint" style="padding:8px 0">Nobody by that name — add them by hand.</div>`;
}

function lateKey(e) {
  if (!lateHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    lateSel = Math.max(0, Math.min(lateHits.length - 1, lateSel + (e.key === 'ArrowDown' ? 1 : -1)));
    [...document.querySelectorAll('#late-results .res')].forEach((el, i) =>
      el.classList.toggle('sel', i === lateSel));
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const el = document.querySelectorAll('#late-results .res')[lateSel];
    if (el) lateAddFrom(el);
  }
  if (e.key === 'Escape') closeLate();
}

function lateAddFrom(el) { placeLatePlayer(el.dataset.n, parseInt(el.dataset.r, 10) || 0); }

function lateAddByHand() {
  const name = (document.getElementById('late-name').value || '').trim();
  const rating = parseInt(document.getElementById('late-rating').value, 10) || 0;
  const msg = document.getElementById('late-hand-msg');
  if (!name) { msg.textContent = 'Give them a name.'; msg.style.color = 'var(--loss)'; return; }
  placeLatePlayer(name, rating);
}

function placeLatePlayer(name, rating) {
  if (S.roster.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    lateStatus(`${name} is already registered.`, true);
    const hm = document.getElementById('late-hand-msg');
    if (hm) { hm.textContent = `${name} is already registered.`; hm.style.color = 'var(--loss)'; }
    return;
  }
  const chips = chipsWithPenalty(rating);
  pushUndo(`added ${name}`);
  S.roster.push({ name, rating, chips, start: chips,
                  draw: S.roster.length + 1, wins: 0, losses: 0, run: 0, best: 0, outAt: null });
  S.queue.push(name);
  logNote(`${name} joined late with ${chips} chip${chips === 1 ? '' : 's'}`);
  rebalance(S);
  closeLate();
  note(`${name} added with ${chips} chip${chips === 1 ? '' : 's'}.`);
  render();
  queuePush();
}

/* ── Undo ──
   A single result moves a chip, requeues the loser, pulls the next player down,
   can knock someone out and can collapse a table. Unwinding all that field by
   field is asking for trouble, so we keep whole snapshots — the session is about
   a kilobyte — and undo simply restores one. Ten deep, so a mistake spotted a few
   games later can still be backed out. */
let undoStack = [];
const UNDO_DEPTH = 10;

const cloneState = () => JSON.stringify({
  roster: S.roster, tables: S.tables, queue: S.queue,
  outOrder: S.outOrder, log: S.log, tableStarts: S.tableStarts,
});

function pushUndo(label) {
  undoStack.push({ snap: cloneState(), label });
  if (undoStack.length > UNDO_DEPTH) undoStack.shift();
}

function undo() {
  if (readOnly) return;
  const step = undoStack.pop();
  if (!step) { note('Nothing left to undo.', true); return; }
  Object.assign(S, JSON.parse(step.snap));
  note(`Undone — ${step.label}`);
  render();
  queuePush();
}

/* Corrections are noted alongside results so nothing changes silently. */
function logNote(text) {
  S.log.unshift({ manual: true, text, at: Date.now() });
  S.log = S.log.slice(0, 200);
}

/* ── Manual corrections ──
   Edit mode keeps these out of the way during normal scoring — the buttons only
   appear when you ask for them. */
let editing = false;
let swapFrom = null;

function toggleEdit() { editing = !editing; swapFrom = null; render(); }

function adjustChips(name, delta) {
  if (readOnly || !S) return;
  const p = S.roster.find(x => x.name === name);
  if (!p) return;
  pushUndo(`${delta > 0 ? 'gave' : 'took'} a chip ${delta > 0 ? 'to' : 'from'} ${name}`);
  const was = p.chips;
  p.chips = Math.max(0, p.chips + delta);

  // Dropping to zero has to knock them out properly — the order players go out
  // in is what decides 2nd, 3rd and so on.
  if (was > 0 && p.chips === 0) {
    p.outAt = S.outOrder.length + 1;
    S.outOrder.push(name);
    S.queue = S.queue.filter(n => n !== name);
    S.tables = S.tables.map(t => t.map(n => (n === name ? null : n)));
    logNote(`${name} knocked out by hand`);
  } else if (was === 0 && p.chips > 0) {
    S.outOrder = S.outOrder.filter(n => n !== name);
    S.outOrder.forEach((n, i) => { const q = S.roster.find(x => x.name === n); if (q) q.outAt = i + 1; });
    p.outAt = null;
    if (!S.queue.includes(name) && !S.tables.flat().includes(name)) S.queue.push(name);
    logNote(`${name} put back in`);
  } else {
    logNote(`${name} ${delta > 0 ? 'given' : 'docked'} a chip (${p.chips} left)`);
  }
  rebalance(S);
  render();
  queuePush();
}

/* Two taps: pick one player, then pick who they should change places with.
   Works between two seats, or between a seat and someone in the queue. */
function pickSwap(name) {
  if (readOnly || !S) return;
  if (!swapFrom) { swapFrom = name; render(); return; }
  if (swapFrom === name) { swapFrom = null; render(); return; }
  const a = swapFrom, b = name;
  swapFrom = null;
  pushUndo(`swapped ${a} and ${b}`);

  const seatOf = (n) => {
    for (let t = 0; t < S.tables.length; t++) {
      const s = S.tables[t].indexOf(n);
      if (s >= 0) return { t, s };
    }
    return null;
  };
  const sa = seatOf(a), sb = seatOf(b);
  const qa = S.queue.indexOf(a), qb = S.queue.indexOf(b);

  if (sa && sb) { S.tables[sa.t][sa.s] = b; S.tables[sb.t][sb.s] = a; }
  else if (sa && qb >= 0) { S.tables[sa.t][sa.s] = b; S.queue[qb] = a; }
  else if (sb && qa >= 0) { S.tables[sb.t][sb.s] = a; S.queue[qa] = b; }
  else if (qa >= 0 && qb >= 0) { S.queue[qa] = b; S.queue[qb] = a; }
  else { note('One of those players is out.', true); return; }

  logNote(`${a} and ${b} swapped places`);
  render();
  queuePush();
}

function moveInQueue(name, dir) {
  if (readOnly || !S) return;
  const i = S.queue.indexOf(name);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= S.queue.length) return;
  pushUndo(`moved ${name} in the queue`);
  [S.queue[i], S.queue[j]] = [S.queue[j], S.queue[i]];
  logNote(`${name} moved ${dir < 0 ? 'up' : 'down'} the queue`);
  render();
  queuePush();
}

/* Reporting a win. The name travels in a data attribute rather than inside the
   onclick string — a name with a quote or apostrophe in it would otherwise
   break the attribute and the button would silently do nothing. */
function winFrom(el) { win(Number(el.dataset.t), el.dataset.n); }

function render() {
  if (!S) return;
  DISPLAY = buildDisplayNames(S.roster.map(p => p.name));
  const st = sessionStats(S);
  const champ = champion(S);
  const scoring = !!(serverCode && adminCode);
  const fee = Number(document.getElementById('fee').value) || 0;
  const bar = Number(document.getElementById('bar').value) || 0;
  const tName = (document.getElementById('tname').value || '').trim();
  const now = Date.now();
  S.tableStarts = S.tableStarts || {};

  // Tables are held in priority order, so index 0 is the best table and
  // consolidation closing from the end drops the weakest first.
  const tLabel = (i) => (S.tableList && S.tableList[i]) ? S.tableList[i].label : String(i + 1);
  const seatedAt = {};                       // name → table label, for the left column
  S.tables.forEach((seat, i) => seat.forEach(n => { if (n) seatedAt[n] = tLabel(i); }));

  // ── Right: the tables ──
  const tables = S.tables.map((seat, i) => {
    const live = seat[0] && seat[1];
    const started = S.tableStarts[i];
    const el = started ? now - started : null;
    const over = el !== null && el > 4 * 60 * 1000;
    const seats = [0, 1].map(k => {
      const n = seat[k];
      if (!n) return `<div class="seat empty">Open</div>`;
      const p = S.roster.find(x => x.name === n);
      return `<button class="seat${live && scoring ? ' playable' : ''}"
        data-t="${i}" data-n="${esc(n)}"
        ${live && scoring ? 'onclick="winFrom(this)"' : 'disabled'}>
        <span class="sn">${esc(disp(n))}</span>${chipDots(p)}</button>`;
    }).join('');
    return `<div class="table-card${live ? '' : ' idle'}">
      <div class="table-head"><span>Table ${esc(tLabel(i))}</span>
        ${live && el !== null ? `<span class="table-timer${over ? ' over' : ''}">${fmtClock(el)}</span>` : ''}
      </div>${seats}</div>`;
  }).join('');

  // ── Left: ordered to mirror the right ──
  // Knocked out at the top, then whoever is on a table in table order, then the
  // queue reading downwards so the player about to come on sits at the bottom.
  const byName = (n) => S.roster.find(x => x.name === n);
  const seatedOrder = [];
  S.tables.forEach((seat, ti) => seat.forEach(n => {
    if (n) seatedOrder.push({ p: byName(n), table: ti + 1 });
  }));
  // Knocked out at the top, then the queue reading downwards so whoever is up
  // next sits directly above the tables they are about to feed.
  const boardOrder = [
    ...S.roster.filter(p => p.chips === 0)
       .sort((a, b) => (a.outAt || 0) - (b.outAt || 0)).map(p => ({ p, table: null })),
    ...[...S.queue].reverse().map(n => ({ p: byName(n), table: null })),
    ...seatedOrder,
  ].filter(x => x.p);

  // Once it's over, placings are what matter.
  const order = champ ? standings(S).map(p => ({ p, table: null })) : boardOrder;
  const players = order.map((row, i) => {
    const p = row.p;
    const at = seatedAt[p.name];
    const upNext = S.queue.indexOf(p.name);
    const where = p.chips === 0 ? '<span class="tag out">Out</span>'
      : at ? `<span class="tag on">Table ${esc(at)}</span>`
      : upNext === 0 ? '<span class="tag next">Up next</span>'
      : upNext > 0 ? `<span class="tag">#${upNext + 1} in line</span>` : '';
    // A rule above each table's first player keeps the two together as a pair.
    const newTable = row.table && (i === 0 || order[i - 1].table !== row.table);
    const inQueue = upNext >= 0;
    const controls = editing ? `
      <span class="rowctl">
        <button class="adj" title="Take a chip" onclick="adjustChips(${JSON.stringify(p.name)},-1)">&minus;</button>
        <button class="adj" title="Give a chip" onclick="adjustChips(${JSON.stringify(p.name)},1)">+</button>
        ${p.chips > 0 ? `<button class="adj${swapFrom === p.name ? ' armed' : ''}"
            title="${swapFrom ? 'Swap with ' + swapFrom : 'Swap this player with another'}"
            onclick="pickSwap(${JSON.stringify(p.name)})">&#8646;</button>` : ''}
        ${inQueue ? `<button class="adj" title="Move up" ${upNext === 0 ? 'disabled' : ''}
            onclick="moveInQueue(${JSON.stringify(p.name)},-1)">&uarr;</button>
          <button class="adj" title="Move down" ${upNext === S.queue.length - 1 ? 'disabled' : ''}
            onclick="moveInQueue(${JSON.stringify(p.name)},1)">&darr;</button>` : ''}
      </span>` : '';
    return `<div class="prow${p.chips === 0 ? ' out' : ''}${at ? ' seated' : ''}${newTable ? ' table-start' : ''}${swapFrom === p.name ? ' armed' : ''}">
      ${champ ? `<span class="pl">${p.place}</span>` : ''}
      <span class="pn">${esc(disp(p.name))}</span>
      ${chipDots(p)}
      ${where}
      ${statCells(p)}
      ${controls}
    </div>`;
  }).join('');

  document.getElementById('out').innerHTML = `
    ${scoring ? `<div class="ro-banner"><span class="live-dot"></span>Scoring — tap whoever won. Anyone watching sees it within twenty seconds.</div>` : ''}
    <div class="tourney-head">
      <div class="th-left">
        <div class="th-name">${tName ? esc(tName) : 'Chip tournament'}</div>
        <div class="th-meta"><span class="th-id">${esc(serverCode || '')}</span><span id="save-meta"></span></div>
      </div>
      <div class="th-actions">
        ${scoring ? `<button class="act" onclick="undo()" ${undoStack.length ? '' : 'disabled'}
                       title="${undoStack.length ? 'Undo ' + undoStack[undoStack.length-1].label : 'Nothing to undo'}">Undo</button>
                     <button class="act${editing ? ' primary' : ''}" onclick="toggleEdit()">${editing ? 'Done editing' : 'Edit'}</button>
                     <button class="act" onclick="addLatePlayer()">Add late player</button>
                     <button class="act" onclick="copyViewLink()">Copy view link</button>` : ''}
        <button class="act" onclick="window.print()">Print</button>
      </div>
    </div>

    ${champ ? `<div class="champion"><span class="lbl">Champion</span><span class="nm">${esc(disp(champ))}</span></div>` : ''}

    <div class="split">
      <div class="col-players">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Players</span>
            <span class="card-meta">${st.playersLeft} of ${st.registered} still in &middot; ${st.remaining} chips left</span>
          </div>
          ${editing ? `<div class="edit-note">Editing — ${swapFrom
              ? `pick who <strong>${esc(swapFrom)}</strong> should change places with`
              : 'adjust chips, swap players between seats, or reorder the queue'}</div>` : ''}
          ${S.log.length ? `<div class="ticker">${S.log[0].manual
              ? esc(S.log[0].text)
              : `<strong>${esc(disp(S.log[0].winner))}</strong> beat ${esc(disp(S.log[0].loser))} on table ${esc(tLabel(S.log[0].table - 1))}`}</div>` : ''}
          ${editing ? '' : `<div class="stat-legend">
            <span class="l1">W&ndash;L</span><span class="l2">Win %</span><span class="l3">Run</span>
          </div>`}
          <div class="plist">${players}</div>
        </div>
      </div>

      <div class="col-tables">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Tables</span>
            <span class="card-meta">${st.inPlay} on &middot; ${st.waiting} waiting</span>
          </div>
          <div class="pad tables-pad">${tables}</div>
        </div>


      </div>
    </div>

    ${payoutHTML(st.registered, fee, bar, champ)}`;
}

/* ── Server tournaments ──
   A tournament created on the admin page is opened here by its code.
     ?t=ABCD          anyone — read only
     ?t=ABCD&a=WXYZ   whoever is scoring — can advance players
   Without a code the page works standalone on local storage as before. */

async function openFromServer(code, admin) {
  serverCode = code;
  adminCode = admin || null;
  readOnly = !adminCode;
  note('Loading ' + code + '…');
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(code), {
      headers: adminCode ? { 'X-Admin-Code': adminCode } : {},
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      document.getElementById('code-entry').style.display = 'none';
      document.getElementById('out').innerHTML = `<div class="notice-card">${
        j.code === 'not_configured'
          ? 'Tournaments are not set up on this site yet.'
          : 'No tournament with code <strong>' + esc(code) + '</strong>.'}</div>`;
      return;
    }
    if (adminCode && !j.canScore) {
      adminCode = null; readOnly = true;
      note('That admin code was not accepted — showing it read only.', true);
    }
    applyServer(j.data);
    // Watchers poll; whoever is scoring already has the current copy.
    if (readOnly && !livePoll) livePoll = setInterval(pollServer, 20000);
  } catch (e) {
    document.getElementById('code-entry').style.display = 'none';
    document.getElementById('out').innerHTML = '<div class="notice-card">Could not reach the server.</div>';
  }
}

async function pollServer() {
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(serverCode));
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok && (j.data.saved || 0) !== liveStamp) applyServer(j.data);
  } catch (e) {}
}
function applyServer(d) {
  liveStamp = d.saved || 0;
  serverCode = d.code || serverCode;
  document.getElementById('tname').value = d.name || '';
  document.getElementById('tid').textContent = serverCode;
  document.getElementById('fee').value = d.fee ?? '';
  document.getElementById('bar').value = d.bar ?? '';
  S = {
    tableCount: d.tableCount || (d.tables ? d.tables.length : 4),
    roster: d.roster || [], tables: d.tables || [], queue: d.queue || [],
    outOrder: d.outOrder || [], log: d.log || [],
    tableStarts: d.tableStarts || {},
    chipBands: d.chipBands || null,
    tableList: d.tableList || null,
    payoutSpec: d.payoutSpec || null, payoutsManual: d.payoutsManual || null,
  };
  backfillStreaks(S);
  document.getElementById('code-entry').style.display = 'none';
  document.body.classList.toggle('read-only', readOnly);
  render();
}

function snapshot() {
  if (!S || !serverCode) return null;
  const st = sessionStats(S);
  return {
    schema: 1, code: serverCode, id: serverCode,
    name: (document.getElementById('tname').value || '').trim(),
    kind: 'chip', saved: Date.now(),
    tableCount: S.tableCount, chipBands: S.chipBands || null,
    tableList: S.tableList || null,
    roster: S.roster, tables: S.tables, queue: S.queue,
    outOrder: S.outOrder, log: S.log.slice(0, 200), tableStarts: S.tableStarts,
    bySeed: Object.fromEntries(S.roster.map(p => [p.draw, p.name])),
    progress: { played: st.matches, total: st.distributed },
    champion: champion(S),
    fee: document.getElementById('fee').value,
    bar: document.getElementById('bar').value,
    payoutSpec: S.payoutSpec || null,
    payoutsManual: S.payoutsManual || null,
  };
}

function note(msg, bad) {
  const el = document.getElementById('saved-note');
  if (!el) return;
  el.textContent = msg || '';
  el.style.color = bad ? 'var(--loss)' : 'var(--text3)';
}

async function pushToServer() {
  if (!serverCode || !adminCode) return;
  const data = snapshot();
  if (!data) return;
  try {
    const r = await fetch('/api/t/' + encodeURIComponent(serverCode), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Code': adminCode },
      body: JSON.stringify(data),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      liveStamp = data.saved;
      const t = new Date();
      const sm = document.getElementById('save-meta');
      const msg = ` · Saved ${t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`
                + ` · ${data.progress.played}/${data.progress.total} played`;
      if (sm) sm.textContent = msg;
    } else if (j.code === 'bad_admin') {
      note('That admin code stopped working — reload the link.', true);
    }
  } catch (e) { note('Could not reach the server — that result is not saved yet.', true); }
}

let pushTimer = null;
function queuePush() {
  if (!serverCode || !adminCode) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToServer, 600);
}


/* Clears the slate so the next draw is a separate tournament rather than
   overwriting the one that's open. */


function updateCount() {}



function pick(id, slotIdx) {
  if (readOnly) return;
  const m = S.matches.find(x => x.id === id);
  if (!m || m.autoWon || !m.live) return;
  if (m.players[0] === undefined || m.players[1] === undefined) return;
  m.winner = (m.winner === slotIdx) ? null : slotIdx;   // click again to undo
  render();
}

async function copyViewLink() {
  const url = `${location.origin}${location.pathname}?t=${serverCode}`;
  try { await navigator.clipboard.writeText(url); note('View link copied — code ' + serverCode + '.'); }
  catch (e) { prompt('View link:', url); }
}

function goToCode() {
  const v = (document.getElementById('code-in').value || '').replace(/\s/g, '').toUpperCase();
  // An officer who knows their admin code can enter CODE-ADMIN here and land
  // straight in scoring. The hint underneath only ever mentions the four
  // character public code, so it isn't something a player stumbles into.
  const pair = v.match(/^([A-Z1-9]{4})-?([A-Z1-9]{4})$/);
  if (pair) { location.search = '?t=' + pair[1] + '&a=' + pair[2]; return; }
  if (v.length !== 4) {
    const h = document.getElementById('hint');
    h.textContent = 'Codes are four characters.'; h.style.color = 'var(--loss)';
    return;
  }
  location.search = '?t=' + v;
}

// Table clocks tick without redrawing the whole board.
setInterval(() => {
  if (!S) return;
  S.tables.forEach((seat, i) => {
    if (!(seat[0] && seat[1]) || !S.tableStarts[i]) return;
    const el = document.querySelectorAll('.table-card')[i]?.querySelector('.table-timer');
    if (!el) return;
    const ms = Date.now() - S.tableStarts[i];
    el.textContent = fmtClock(ms);
    el.classList.toggle('over', ms > 4 * 60 * 1000);
  });
}, 1000);

(function () {
  const q = new URLSearchParams(location.search);
  const code = (q.get('t') || '').toUpperCase();
  if (code) openFromServer(code, (q.get('a') || '').toUpperCase());
})();
</script>
